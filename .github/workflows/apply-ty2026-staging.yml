name: Apply TY2026 staged tax files
on:
  push:
    paths:
      - 'docs/_staging/ty2026/**'
      - '.github/workflows/apply-ty2026-staging.yml'
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rev/ty2026-parameters
      - name: Decode staged gzip+base64 test files into tree
        run: |
          set -euo pipefail
          python3 << 'PY'
          import base64, gzip, json
          from pathlib import Path
          manifest = json.loads(Path('docs/_staging/ty2026/manifest.json').read_text())
          for item in manifest:
              staged = Path(item['staging'])
              dest = Path(item['dest'])
              raw = gzip.decompress(base64.b64decode(staged.read_text().strip()))
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(raw)
              print('wrote', dest, len(raw))
          PY
      - name: Commit TY2026 fact-dictionary tests
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            direct-file/df-client/df-client-app/src/test/factDictionaryTests/eitc.test.ts \
            direct-file/df-client/df-client-app/src/test/factDictionaryTests/standardDeduction.test.ts
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "test(tax): apply TY2026 EITC + standard deduction fact-dictionary tests (Rev. Proc. 2025-32)"
          git push origin HEAD:rev/ty2026-parameters
