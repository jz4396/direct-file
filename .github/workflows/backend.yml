# Backend JUnit suite for direct-file/backend.
# The check, gitleaks, dependency-audit, and browser jobs do not run it.
name: backend

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "18.20.4"
          cache: npm
          cache-dependency-path: direct-file/df-client/package-lock.json

      - name: Install pinned sbt
        run: |
          .github/scripts/install-pinned-sbt.sh
          echo "/tmp/ci-sbt/sbt/bin" >> "$GITHUB_PATH"

      - name: Publish the fact graph
        working-directory: direct-file/fact-graph-scala
        run: sbt -batch factGraphJVM/publishM2

      - name: Install shared modules
        working-directory: direct-file/libs
        run: ./mvnw -B -DskipTests install

      - name: Install client dependencies without lifecycle scripts
        working-directory: direct-file/df-client
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate the client fact dictionary
        working-directory: direct-file/df-client/df-client-app
        run: npm run generate-fact-dictionary

      - name: Backend JUnit suite
        working-directory: direct-file/backend
        run: ./mvnw -B test
