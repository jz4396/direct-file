# Real-browser no-retention suite for the static client (#126, #132).
# Deploys stay out of GitHub Actions. This workflow only runs the Playwright proof.
name: no-retention

on:
  pull_request:
  push:
    branches: [main]

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: direct-file/df-client/package-lock.json
      - name: Install client dependencies without lifecycle scripts
        working-directory: direct-file/df-client
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned Chromium
        working-directory: direct-file/df-client
        run: npx playwright install --with-deps chromium
      - name: No-retention browser test
        working-directory: direct-file/df-client/df-client-app
        run: npm run test:no-retention
