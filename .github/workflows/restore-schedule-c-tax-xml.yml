name: restore-schedule-c-tax-xml
on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/_staging/schedule-c/**'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode staging into tax modules
        run: python3 docs/_staging/schedule-c/restore.py
      - name: Commit restored tax XML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add direct-file/backend/src/main/resources/tax/flow.xml \
                  direct-file/backend/src/main/resources/tax/income.xml \
                  direct-file/backend/src/main/resources/tax/taxCalculations.xml \
                  direct-file/backend/src/main/resources/tax/scheduleC.xml \
                  direct-file/backend/src/main/resources/tax/scheduleSE.xml || true
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "fix(tax): restore flow + wire Schedule C/SE from staging"
          git push
