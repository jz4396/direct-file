name: restore-schedule-c-tax-xml
on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/_staging/schedule-c/**'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cod/impl-schedule-c
      - name: Decode staging into tax modules
        run: |
          python3 <<'PY'
          import gzip, base64, pathlib
          root = pathlib.Path("docs/_staging/schedule-c")
          dest = pathlib.Path("direct-file/backend/src/main/resources/tax")
          for name in ["flow.xml", "income.xml", "taxCalculations.xml"]:
              b64 = (root / f"{name}.gz.b64").read_text().strip()
              data = gzip.decompress(base64.b64decode(b64))
              out = dest / name
              out.write_bytes(data)
              print(name, len(data), "flowKnockoutScheduleCQbi" in data.decode(errors="ignore"))
          PY
      - name: Commit restored tax XML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add direct-file/backend/src/main/resources/tax/flow.xml \
                  direct-file/backend/src/main/resources/tax/income.xml \
                  direct-file/backend/src/main/resources/tax/taxCalculations.xml
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "fix(tax): restore flow.xml + wire Schedule C/SE from staging"
          git push
