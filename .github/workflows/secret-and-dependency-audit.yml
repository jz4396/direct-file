# Secret, PII, and dependency gate. See docs/security/secret-and-dependency-audit.md.
# The default workflow credential is read-only. This file does not reference repository secrets.
name: secret-and-dependency-audit

on:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pull request history
        # v7.0.1. Full history so --log-opts=base..head sees every commit in the
        # pull request. persist-credentials is false so the token is not written
        # into the workspace.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned gitleaks
        run: .github/scripts/install-pinned-scanners.sh gitleaks

      - name: Self-test SSN, EIN, and ITIN rules
        run: .github/scripts/gitleaks-pii-selftest.sh

      - name: gitleaks detect --log-opts=base..head
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: .github/scripts/gitleaks-pr-range.sh

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        # v7.1.0. Node is pinned to the version used to build the allowlists.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.23.4"

      - name: Install pinned osv-scanner
        run: .github/scripts/install-pinned-scanners.sh osv-scanner

      - name: Self-test the dependency gate
        run: node .github/scripts/dependency-audit.mjs self-test

      - name: Check scan targets against tracked lockfiles and poms
        run: node .github/scripts/dependency-audit.mjs verify-targets

      - name: npm ci --ignore-scripts
        run: node .github/scripts/dependency-audit.mjs npm-ci

      - name: npm audit --audit-level=high
        run: node .github/scripts/dependency-audit.mjs npm-audit

      - name: OSV-Scanner lockfiles and Maven poms
        run: node .github/scripts/dependency-audit.mjs osv
