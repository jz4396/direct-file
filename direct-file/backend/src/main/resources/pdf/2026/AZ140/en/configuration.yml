# #93 slice 5: Arizona Form 140. YEAR-BASED MAPPING: 2025 FORM AS THE INTERIM TAX YEAR 2026 TEMPLATE.
# The 2026 Form 140 is not the template. This 2025 fillable form stands in. Amounts are tax year 2026.
# Preprinted text that still says 2025, and the 2025 exemption and deduction dollars, are left as printed.
# The amount entered on line 43 is the 2026 standard deduction. Line 46 is line 45 times 2.5 percent.
# Source: https://azdor.gov/sites/default/files/document/FORMS_INDIVIDUAL_2025_140_f.pdf
# SHA-256 2acdda2a07ab46d7f6bd701618e63d1af8d45ac7921c38572a740940437edf84
# Included when /stateReturnIsAz. Stops in azPit refuse the package, so the zero lines below are the supported entry.
# Whole dollars, no commas, no decimals. Zero prints 0.
# Az140PdfForm fills the ~az140* pseudo-facts (name, address, filing-status export value, standard box).
includeWhen: /stateReturnIsAz
otherRequiredFacts:
  - /isFilingStatusMFJ
  - /filingStatus
  - /address
  - /phone
  - /primaryFiler/firstName
  - /primaryFiler/middleInitial
  - /primaryFiler/lastName
  - /primaryFiler/tin
  - /secondaryFiler/firstName
  - /secondaryFiler/middleInitial
  - /secondaryFiler/lastName
  - /secondaryFiler/tin
  - /azResidencyStatus
  - /azLine46
  - /azRefund
form:
  'Your First Name and Middle Initial': ~az140First
  'Your Last Name': ~az140Last
  'Your SSN': /primaryFiler/tin
  "Spouse's First Name and Middle Initial": ~az140SpouseFirst
  "Spouse's Last Name": ~az140SpouseLast
  "Spouse's SSN": ~az140SpouseSsn
  'Current Home Address - number and street, rural route': ~az140Street
  'Apartment Number': ~az140Apt
  'City, Town, Post Office': ~az140City
  'State': ~az140State
  'ZIP Code': ~az140Zip
  'Daytime Phone': ~az140Phone
  'Filing Status': ~az140FilingStatus
  'Itemized/Standard': ~az140Deduction
  'Age 65 or over': /azZero
  Blind: /azZero
  'Dependents Under age of 17': /azZero
  'Dependents Age 17 and over': /azZero
  'Qualifying parents and grandparents': /azZero
  '40E': /azZero
