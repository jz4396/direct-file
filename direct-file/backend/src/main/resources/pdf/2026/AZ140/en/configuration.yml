  'Deductions:  Check box and enter amount': /azLine43
  'If you checked box 43S and claim charitable contributions, check 44C. Complete page 3': /azLine44
  'Arizona taxable income:  Subtract lines 43 and 44 from line 42.  If less than zero, enter “0”': /azLine45
  'Tax:  Multiply line 45 by 2.5% (.025).  Enter the result': /azLine46
  'Tax from recapture of credits from Arizona Form 301, Part 2, line 30': /azZero
  'Subtotal of tax:  Add lines 46 and 47.  Enter the total': /azLine48
