  'Small Bussiness Income': /azZero
  'Modified federal adjusted gross income': /azLine14
  'Non-Arizona municipal interest': /azZero
  'Partnership Income adjustment': /azZero
  'Total federal depreciation': /azZero
  'Other Additions to Income:  Complete Other Additions to Arizona Gross Income schedule on page 5': /azZero
  'Subtotal:  Add lines 14 through 18 and enter the total': /azLine19
  'Subtract lines 24 through 34c from line 19': /azLine37
  'Subtract line 36 from line 35.  Enter the difference': /azLine37
  'Age 65 or over:  Multiply the number in box 8 by $2,100': /azZero
  'Blind:  Multiply the number in box 9 by $1,500': /azZero
  'Other Exemptions': /azZero
  'Qualifying parents and grandparents:  Multiply the number in box 11a by $10,000': /azZero
