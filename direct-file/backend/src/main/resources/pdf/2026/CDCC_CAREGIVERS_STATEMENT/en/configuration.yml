# REPO-BUILT STATEMENT. Not an IRS download: the SHA-256 pin is the ty2026-template-manifest.txt
# row, not draft-pdf-sha256.txt, final-pdf-sha256.txt, state-interim-pdf-sha256.txt, or
# continuous-use-pdf-sha256.txt.
# #124 SWAP: additional care providers for Form 2441. There is no IRS form for this attachment.
# Headings are Part I of the 2026 draft Form 2441 committed at pdf/2026/IRS2441/en/f2441--dft.pdf
# (https://www.irs.gov/pub/irs-dft/f2441--dft.pdf, SHA-256
# 67eca7567ce5ff06e72d40a07db487f406da33139e664c0c0d9c67a4e31e9385). Page 1 of that file is the
# draft cover sheet. Page 2 (Form 2441 page 1) says: "If you have more than three care providers,
# see the instructions and check this box". Rows on that part:
# "1a Care provider's name",
# "1b Address",
# "1c Identifying number (SSN or EIN)",
# "1d Was the care provider your household employee in 2026?",
# "1e Amount paid. See instructions."
# The statement lists every care provider when there are more than three, with the same facts as
# Part I in pdf/2026/IRS2441/en/configuration.yml. "No" / "Yes" is /cdccCareProviders/*/pdfIsHouseholdEmployee.
includeWhen: /cdccShouldIncludeMoreThanThreeCareProviders
table:
  rowsCollectionPath: /cdccCareProviders
  rowsPerPage: 15
  columns:
    - factExpression: ../displayName
      fieldName: 1 a Care providers nameRow
    - factExpression: ../pdfAddress
      fieldName: b AddressRow
    - factExpression: ../pdfTinEinColumn
      fieldName: c Identifying number SSN or EINRow
    - factExpression: ../pdfIsHouseholdEmployee
      fieldName: d Was the care provider your household employee in 2026Row
    - factExpression: ../amountPaidForCare
      fieldName: e Amount paidRow
  oncePerPage:
    - factExpression: /primaryFiler/fullName
      fieldName: Taxpayer's name
    - factExpression: /primaryFiler/tin
      fieldName: Taxpayer's TIN
