# REPO-BUILT STATEMENT. Not an IRS download: the SHA-256 pin is the ty2026-template-manifest.txt
# row, not draft-pdf-sha256.txt, final-pdf-sha256.txt, state-interim-pdf-sha256.txt, or
# continuous-use-pdf-sha256.txt.
# #124 SWAP: additional qualifying persons for Form 2441. There is no IRS form for this attachment.
# Headings are line 2 of the 2026 draft Form 2441 committed at pdf/2026/IRS2441/en/f2441--dft.pdf
# (https://www.irs.gov/pub/irs-dft/f2441--dft.pdf, SHA-256
# 67eca7567ce5ff06e72d40a07db487f406da33139e664c0c0d9c67a4e31e9385). Page 1 of that file is the
# draft cover sheet. Page 2 (Form 2441 page 1) says: "If you have more than three qualifying persons,
# see the instructions and check this box". Columns on that line:
# "(a) Qualifying person's name" (First and Last),
# "(b) Qualifying person's social security number (see instructions)",
# "(c) Check here if the qualifying person was over age 12 and was disabled. See instructions.",
# "(d) Qualified expenses you incurred and paid in 2026 for the person listed in column (a)".
# The first three qualifying people stay on Form 2441. This statement is the rest, in the same order,
# with the same facts as Table_Line2 in pdf/2026/IRS2441/en/configuration.yml. The statement does not
# print a dollar cap; Form 2441 line 3 applies the cap.
includeWhen: /cdccShouldIncludeQualifyingPersonsStatement
table:
  rowsCollectionPath: /~cdccAllQualifyingPeople
  rowsPerPage: 15
  itemsToSkip: 3
  columns:
    - factExpression: ../firstName
      fieldName: a Qualifying persons first nameRow
    - factExpression: ../lastName
      fieldName: a Qualifying persons last nameRow
    - factExpression: ../tin
      fieldName: b Qualifying persons social security numberRow
    - factExpression: ../unableToCareForSelfAndOverAge12
      fieldName: c Check here if the qualifying person was over age 12 and was disabledRow
    - factExpression: ../cdccQualifyingExpenseAmount
      fieldName: d Qualified expenses you incurred and paid in 2026 for the person listed in column aRow
  oncePerPage:
    - factExpression: /primaryFiler/fullName
      fieldName: Taxpayer's name
    - factExpression: /primaryFiler/tin
      fieldName: Taxpayer's TIN
otherRequiredFacts:
  - /cdccQualifyingPeople/*/firstName
  - /cdccQualifyingPeople/*/lastName
  - /cdccQualifyingPeople/*/tin
  - /cdccQualifyingPeople/*/unableToCareForSelfAndOverAge12
  - /cdccQualifyingPeople/*/cdccQualifyingExpenseAmount
  - /cdccQualifyingFilers/*/firstName
  - /cdccQualifyingFilers/*/lastName
  - /cdccQualifyingFilers/*/tin
  - /cdccQualifyingFilers/*/isDisabled
  - /cdccQualifyingFilers/*/cdccQualifyingExpenseAmount
