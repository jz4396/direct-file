# #93 slice 7: Idaho Form 40. YEAR-BASED MAPPING: 2025 FORM AS THE INTERIM TAX YEAR 2026 TEMPLATE.
# The 2026 Form 40 is not the template. This 2025 fillable form (EFO00089, rev. 03-02-2026) stands in.
# Amounts are tax year 2026. Preprinted text that still says 2025 is left as printed.
# The $10 on line 31 is preprinted. Line 32 includes it. The 2025 standard-deduction margin figures are not entered.
# Line 16 and the standard-deduction worksheet use the 2026 federal standard deduction.
# Source: https://tax.idaho.gov/wp-content/uploads/forms/EFO00089/EFO00089_03-02-2026.pdf
# SHA-256 1390489138a7df67095155aaf34e6e8f39a4fd36041594f95b766f5e33bb8a13
# Included when /stateReturnIsId. Stops in idPit refuse the package, so the zero lines below are the supported entry.
# Whole dollars, no commas, no decimals. Zero prints 0.
# Id40PdfForm fills the ~id40* pseudo-facts (name, address, phone, filing-status boxes, food-credit months).
