# #93 slice 3: Form IL-1040. YEAR-BASED MAPPING: 2025 FORM AS THE INTERIM TAX YEAR 2026 TEMPLATE.
# The 2026 vendor draft has no AcroForm:
# https://tax.illinois.gov/content/dam/soi/en/web/tax/taxprofessionals/draft-forms/documents/iit-draft-forms/2026-iit-vendor-forms-and-instructions/2026-il-1040-vendor.pdf
# The 2025 fillable IL-1040 has the same line numbers. Amounts are tax year 2026 ($2,925 / $5,850, rate 4.95%).
# Source: https://tax.illinois.gov/content/dam/soi/en/web/tax/forms/incometax/documents/currentyear/individual/il-1040.pdf
# SHA-256 7af662f99b31f6aa0d00df5ae93c2a50c4c15e01a0c1dcf5f722fc0bde0799cd
# Included when /stateReturnIsIl. Stops in ilPit refuse the package, so the zero lines below are the supported entry.
# Line 21 prints 0, not a blank. Whole dollars, comma grouping, no decimals.
# Il1040PdfForm fills the ~il1040* pseudo-facts (names, address, filing-status radio, 65/blind checkboxes, paper check).
includeWhen: /stateReturnIsIl
otherRequiredFacts:
  - /isMarried
  - /isFilingStatusMFJ
  - /filingStatus
  - /address
  - /phone
  - /primaryFiler/firstName
  - /primaryFiler/middleInitial
  - /primaryFiler/lastName
  - /primaryFiler/dateOfBirth
  - /primaryFiler/tin
  - /primaryFiler/age65OrOlder
  - /primaryFiler/isBlind
  - /secondaryFiler/firstName
  - /secondaryFiler/middleInitial
  - /secondaryFiler/lastName
  - /secondaryFiler/dateOfBirth
  - /secondaryFiler/tin
  - /secondaryFiler/age65OrOlder
  - /secondaryFiler/isBlind
  - /ilLine38
form:
  "step1-A-firstnamemi": ~il1040First
  "step1-A-lastname": ~il1040Last
  "Step1-A-dob": /primaryFiler/dateOfBirth
  "step1-A-ssn": /primaryFiler/tin
  "step1-A-spousefirstnamemi": ~il1040SpouseFirst
  "step1-A-spouselastname": ~il1040SpouseLast
  "step1-A-spousedob": ~il1040SpouseDob
  "step1-A-spousessn": ~il1040SpouseSsn
  "step1-A-mailingaddress": ~il1040Street
  "step1-A-aptno": ~il1040Apt
  "step1-A-city": ~il1040City
  "step1-A-state": ~il1040State
