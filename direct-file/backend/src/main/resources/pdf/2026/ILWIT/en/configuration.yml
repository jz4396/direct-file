# #93 slice 3: Schedule IL-WIT. YEAR-BASED MAPPING: 2025 FORM AS THE INTERIM TAX YEAR 2026 TEMPLATE.
# Source: https://tax.illinois.gov/content/dam/soi/en/web/tax/forms/incometax/documents/currentyear/individual/il-1040-schedule-il-wit.pdf
# SHA-256 4fd926e767d546d54047888f7064bc169641db485e830c6e730263e946248190
# Included when /stateReturnIsIl. Rows 1-5 are the primary filer's W-2s; rows 6-10 are the spouse's.
# Column A is W. Column D is box 16 (0 when blank). The total is IL-1040 Line 25.
# More than five W-2s for one person is /flowKnockoutIlWitTooManyRows.
includeWhen: /stateReturnIsIl
otherRequiredFacts:
  - /isMarried
  - /formW2s
  - /formW2s/*/filer
  - /formW2s/*/ein
  - /formW2s/*/wages
  - /formW2s/*/stateWages
  - /formW2s/*/stateWithholding
  - /primaryFiler
  - /primaryFiler/firstName
  - /primaryFiler/lastName
  - /primaryFiler/tin
  - /secondaryFiler/firstName
  - /secondaryFiler/lastName
  - /secondaryFiler/tin
  - /ilLine25
form:
  "Your name": ~ilwitYourName
  "Your SSN-3": ~ilwitYourSsn3
  "Your SSN-2": ~ilwitYourSsn2
  "Your SSN-4": ~ilwitYourSsn4
