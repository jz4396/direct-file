# Schedule EIC (Form 1040), PDFBox template for TY2026 print.
# DRAFT-BASED MAPPING (#208): source is the 2026 early-release draft https://www.irs.gov/pub/irs-dft/f1040sei--dft.pdf
# ("Schedule EIC (Form 1040) 2026", created 5/28/26, 3 pages, 281,944 bytes), committed byte-identical to irs.gov,
# SHA-256 fc9784fd1f64b2ea53e86d9a23a2b946f317c1bb92885e18f8a614252dcf7ef3 (pinned in ../../draft-pdf-sha256.txt and
# rechecked by DraftPdfHashManifestTest). When the final 2026 Schedule EIC is published, re-download, re-hash and
# re-verify every field below before swapping it in (#124).
# Page 1 of the file is the "Caution: DRAFT-NOT FOR FILING" cover sheet (skipLeadingPages drops it). Page 3 of the file
# is form page 2 (Purpose of Schedule and instructions); the 2024 template printed page 1 only, so skipTrailingPages
# drops it and the printed schedule stays one page.
# Field map read with pypdf from the committed draft (form page 1 = file page 2), not copied from the 2024 map:
# - The 2024 c1_1[0] (/receivingEitcWhileSeparatedCheckbox) is not on the 2026 form, so every checkbox index is one
#   lower than in 2024 (2024 c1_2 is 2026 c1_1). The header fields are zero-padded (f1_01, f1_02).
# - Line 3 tooltip: "If born after 2007 and the child is younger than you (or your spouse if filing jointly), skip
#   lines 4a and 4b; go to line 5."
# - Line 4b "No" (c1_4/c1_5/c1_6 outside Yes_ReadOrder, export /2) reads "No. The child is not a qualifying child." A
#   child listed here who is 19 or older and not a student under 24 is a qualifying child only if permanently and
#   totally disabled (26 U.S.C. 152(c)(3)(B), https://www.law.cornell.edu/uscode/text/26/152), so 4b "No" never
#   applies to a listed child and stays blank, as in 2024.
# - Line 6 tooltip: "If the child lived with you for more than half of 2026 but less than 7 months, enter "7."" and
#   "If the child was born or died in 2026 and your home was the child's home for more than half the time they were
#   alive during 2026, enter "12."" transformMonthsLived below matches.
# Instructions for Form 1040 (2025) (https://www.irs.gov/pub/irs-pdf/i1040gi.pdf), PDF p. 43, line 27a: "If you have a
# qualifying child, complete and attach Schedule EIC."
# 26 U.S.C. 32(c)(3)(D)(i) (https://www.law.cornell.edu/uscode/text/26/32): a qualifying child counts only if the
# return includes "the name, age, and TIN of the qualifying child".
includeWhen: /pdfIncludeScheduleEic
customMaps:
  template:
    skipLeadingPages: "1"
    skipTrailingPages: "1"
  transformMonthsLived:
    # Line 6: enter 7 for more than half of the year but less than 7 months
    six: 7
    seven: 7
    eight: 8
    nine: 9
    ten: 10
    eleven: 11
    twelve: 12
form:
  topmostSubform[0]:
    Page1[0]:
      f1_01[0]: /primaryFiler/fullName space space /pdfSecondaryFiler/fullName
      f1_02[0]: /primaryFiler/tin
      f1_03[0]: /scheduleEicDependents/[0]/fullName
      f1_04[0]: /scheduleEicDependents/[1]/fullName
      f1_05[0]: /scheduleEicDependents/[2]/fullName
      f1_06[0]: /scheduleEicDependents/[0]/tin
      f1_07[0]: /scheduleEicDependents/[1]/tin
      f1_08[0]: /scheduleEicDependents/[2]/tin
      Year1_ReadOrder[0]:
        f1_09[0]: /scheduleEicDependents/[0]/~birthMillennium
        f1_10[0]: /scheduleEicDependents/[0]/~birthCentury
        f1_11[0]: /scheduleEicDependents/[0]/~birthDecade
        f1_12[0]: /scheduleEicDependents/[0]/~birthYearOfDecade
      Year2_ReadOrder[0]:
        f1_13[0]: /scheduleEicDependents/[1]/~birthMillennium
        f1_14[0]: /scheduleEicDependents/[1]/~birthCentury
        f1_15[0]: /scheduleEicDependents/[1]/~birthDecade
        f1_16[0]: /scheduleEicDependents/[1]/~birthYearOfDecade
      f1_17[0]: /scheduleEicDependents/[2]/~birthMillennium
      f1_18[0]: /scheduleEicDependents/[2]/~birthCentury
      f1_19[0]: /scheduleEicDependents/[2]/~birthDecade
      f1_20[0]: /scheduleEicDependents/[2]/~birthYearOfDecade
      Line4a_Child1_ReadOrder[0]:
        Yes_ReadOrder[0]:
          c1_1[0]: /scheduleEicDependents/[0]/scheduleEicLine4aYes
        c1_1[0]: /scheduleEicDependents/[0]/scheduleEicLine4aNo
      Line4a_Child2_ReadOrder[0]:
        Yes_ReadOrder[0]:
          c1_2[0]: /scheduleEicDependents/[1]/scheduleEicLine4aYes
        c1_2[0]: /scheduleEicDependents/[1]/scheduleEicLine4aNo
      Line4a_Child3_Yes_ReadOrder[0]:
        c1_3[0]: /scheduleEicDependents/[2]/scheduleEicLine4aYes
      c1_3[0]: /scheduleEicDependents/[2]/scheduleEicLine4aNo
      Line4b_Child1_ReadOrder[0]:
        Yes_ReadOrder[0]:
          c1_4[0]: /scheduleEicDependents/[0]/scheduleEicLine4bYes
      Line4b_Child2_ReadOrder[0]:
        Yes_ReadOrder[0]:
          c1_5[0]: /scheduleEicDependents/[1]/scheduleEicLine4bYes
      Line4b_Child3_Yes_ReadOrder[0]:
        c1_6[0]: /scheduleEicDependents/[2]/scheduleEicLine4bYes
      f1_21[0]: /scheduleEicDependents/[0]/relationship
      f1_22[0]: /scheduleEicDependents/[1]/relationship
      f1_23[0]: /scheduleEicDependents/[2]/relationship
      Line6_Child1_ReadOrder[0]:
        f1_24[0]: /scheduleEicDependents/[0]/~transformMonthsLived
      Line6_Child2_ReadOrder[0]:
        f1_25[0]: /scheduleEicDependents/[1]/~transformMonthsLived
      f1_26[0]: /scheduleEicDependents/[2]/~transformMonthsLived
otherRequiredFacts:
  - /scheduleEicDependents/[0]/dateOfBirth
  - /scheduleEicDependents/[1]/dateOfBirth
  - /scheduleEicDependents/[2]/dateOfBirth
  - /scheduleEicDependents/[0]/monthsLivedWithTPInUS
  - /scheduleEicDependents/[1]/monthsLivedWithTPInUS
  - /scheduleEicDependents/[2]/monthsLivedWithTPInUS
