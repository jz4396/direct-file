# Schedule 8812 (Form 1040), PDFBox template for TY2026 print.
# DRAFT-BASED MAPPING (#120): source is the 2026 early-release draft https://www.irs.gov/pub/irs-dft/f1040s8--dft.pdf
# ("Version A, Cycle 4", created 4/24/26, 2 pages, 65,489 bytes), committed byte-identical to irs.gov,
# SHA-256 0638b2863bdaeadfd3fccee12a9145bf92a442d8de156584c5602cc7e3881422 (pinned in ../../draft-pdf-sha256.txt and
# rechecked by DraftPdfHashManifestTest). When the final 2026 Schedule 8812 is published, re-download, re-hash and
# re-verify every field below before swapping it in (#124).
# This draft has no "DRAFT-NOT FOR FILING" cover sheet (page 1 is the schedule), so no page is skipped.
# AcroForm field names and tooltips re-read with pypdf from the committed draft and diffed against the 2024 template:
# - Page 1: field names and order unchanged. Tooltip changes only: line 1 "line 11" -> "line 11b", line 5 "$2,000" ->
#   "$2,200", line 12 "No" wording.
# - Page 2: line 15 changed from a checkbox ("Check this box if you do not want to claim the additional child tax
#   credit") to "Reserved for future use" (text field f2_1, left blank; the 2024 map never printed line 15). Every later
#   page-2 text field moved up by one (2024 f2_n -> 2026 f2_(n+1)) and each checkbox down by one (c2_2 -> c2_1,
#   c2_3 -> c2_2), re-matched by tooltip and line number.
# Cites: Rev. Proc. 2025-32 §4.05 p. 14: "the maximum amount of the credit allowed under § 24(a) is $2,200" and
# refundable "§ 24(d)(1)(A) ... is $1,700" (already in the fact dictionary; /totalPotentialCtc, /maxActcAmount).
