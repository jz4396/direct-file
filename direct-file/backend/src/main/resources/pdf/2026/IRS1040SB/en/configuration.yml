# #17: 2026 Schedule B (Form 1040), Interest and Ordinary Dividends. DRAFT-BASED MAPPING.
# Source: https://www.irs.gov/pub/irs-dft/f1040sb--dft.pdf (early-release draft, "Created 4/7/26", 2 PDF pages,
# 244,683 bytes), committed byte-identical to irs.gov; SHA-256
# aa6272f6b3b8a8c6a2aa6ef9d1069f1edb88fb9df4df60278d198da89cdfd93f (pinned in pdf/2026/draft-pdf-sha256.txt and
# rechecked by DraftPdfHashManifestTest). Fields are keyed by their AcroForm tooltip (pypdf). Form page 1 = PDF p. 2.
# When the final 2026 Schedule B is released (#124), re-download it, re-hash it and re-verify every field below
# before swapping it in.
# Page 1 of the file is the "Caution: DRAFT—NOT FOR FILING" cover sheet; skipLeadingPages drops it after filling.
# No 2026 Spanish Schedule B draft is posted (irs.gov returns 404 for f1040sbs--dft.pdf, f1040sbsp--dft.pdf, and
# f1040sbs.pdf). Spanish returns print this English form. There is no es entry, and none pointing at the 2024 template.
#
# Included when /requiresScheduleB. Instructions for Schedule B (Form 1040) (2025) p. 1: "You had over $1,500 of
# taxable interest or ordinary dividends" or a foreign account or foreign trust. Schedule B (2026) draft Part III
# says the same. Line 4 is Form 1040 line 2b. Line 6 is Form 1040 line 3b. 26 U.S.C. 61(a)(4).
#
# Not mapped, left blank. A supported return never has an amount for these lines. A yes refuses the print
# (interest /flowKnockoutInterestScheduleBSubtraction):
#   3    Excludable interest on series EE and I U.S. savings bonds issued after 1989 (f1_32). Form 8815 is not
#        computed. Line 4 is line 2 because line 3 is not claimed.
# Line 7a question 1 Yes prints. Question 2 (c1_2) prints Yes or No. Line 7b (f1_65, f1_66) prints the country
# names when FinCEN Form 114 is required. 2026 draft Instructions PDF pp. 3–4. Line 8 Yes and "required to file
# Form 8938?" Yes refuse the print (/flowPrintRefuseScheduleBPartIII). An unanswered question 2 does too.
# FinCEN Form 114 is not attached (instructions: file it with FinCEN). Form 3520 and Form 8938 are not produced.
# Nominee interest, accrued interest, and U.S. savings bond interest previously reported are subtracted below a
# subtotal on line 1 (Instructions for Schedule B). This map puts the full taxable interest on line 1, so a yes
# refuses the print instead of omitting the subtraction. $0 amounts print blank (FactGraphService zero suppression).
includeWhen: /requiresScheduleB
