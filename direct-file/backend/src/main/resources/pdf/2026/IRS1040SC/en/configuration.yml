# #239: 2026 Schedule C (Form 1040), Profit or Loss From Business. DRAFT-BASED MAPPING.
# Source: https://www.irs.gov/pub/irs-dft/f1040sc--dft.pdf (early-release draft, "Created 5/15/26", 3 PDF pages),
# committed byte-identical to irs.gov; SHA-256
# 287b4510dd847c11f6cbbcc98fee05ac5ff187cc18e1413f8759a4a7cd802224 (pinned in pdf/2026/draft-pdf-sha256.txt and
# rechecked by DraftPdfHashManifestTest). Fields are keyed by their AcroForm tooltip, and each field's position was
# checked against the printed line number beside it. Form page 1 = PDF p. 2, form page 2 = PDF p. 3. When the final
# 2026 Schedule C is released (#124), re-download it, re-hash it and re-verify every field below before swapping it in.
# Page 1 of the file is the "Caution: DRAFT—NOT FOR FILING" cover sheet; skipLeadingPages drops it after filling.
# No 2026 Spanish Schedule C exists, so Spanish returns print this English form.
#
# One Schedule C per business, per filer (includeForEach /scheduleCBusinesses). Instructions for Schedule C (2025),
# PDF p. 2: "Use Schedule C (Form 1040) to report income or (loss) from a business you operated or a profession you
# practiced as a sole proprietor." 2026 draft Schedule C, line 31: "If a profit, enter on both Schedule 1 (Form 1040),
# line 3, and on Schedule SE, line 2." Net earnings from self-employment: 26 U.S.C. 1402(a).
#
# Supported lines (26 U.S.C. 61, 162, and 274(n) for meals): 1-8, 10, 11, 14-16a, 16c, 17-19, 20b, 21-26, 27b, 28,
# 29, 31, 32, and the first three Part V lines plus line 48. A single stored expense total still prints on line 28,
# with lines 2, 4, and 6 at zero so lines 3, 5, and 7 equal line 1.
# Not mapped, left blank (the return stops instead of printing a zero):
#   A principal business, B code, D EIN, E business address, F accounting method, H started or acquired this year,
#   I/J Forms 1099, the line 1 statutory-employee checkbox.
#   Line 9 and line 16b (vehicle, Form 4562), line 12 depletion, line 13 depreciation and section 179 (Form 4562),
#   line 20a equipment rent, line 27a (Form 7205), line 30 (Form 8829 or the simplified method),
#   Part IV, and Part V lines 4-9.
# Part III (PDF p. 3) is mapped for cost or lower of cost or market: line 36 is purchases less personal-use
# withdrawals, line 40 adds lines 35 through 39, and line 42 (line 40 minus line 41) is line 4.
# Line 33c, line 34 yes, a 3-prior-year average over $32,000,000, a tax shelter, line 42 below zero, line 35
# different from last year's closing inventory, and an inconsistent no-inventory method stop the return
# instead of printing those lines as zero. 26 U.S.C. 448(c), 448(d)(3), 471(c), 263A(i); Rev. Proc. 2025-32 §4.30.
# $0 amounts print blank. Line 30 is blank on a supported return, so lines 29 and 31 equal line 7 minus line 28.
includeForEach: /scheduleCBusinesses
customMaps:
  template:
    skipLeadingPages: "1"
form:
  topmostSubform[0]:
    Page1[0]:
      f1_1[0]: /scheduleCBusinesses/*/filer/fullName # "Name of proprietor"
      f1_2[0]: /scheduleCBusinesses/*/filer/tin # "Social security number (SSN)"
      f1_5[0]: /scheduleCBusinesses/*/businessName # C "Business name. If no separate business name, leave blank."
      c1_2[0]: /scheduleCBusinesses/*/materiallyParticipates # G "Did you materially participate ... ? Yes"
      c1_2[1]: /scheduleCBusinesses/*/doesNotMateriallyParticipate # G "No"
      f1_13[0]: /scheduleCBusinesses/*/line1GrossReceipts # 1 "Gross receipts or sales" (26 U.S.C. 61)
      f1_14[0]: /scheduleCBusinesses/*/line2ReturnsAndAllowances # 2 "Returns and allowances"
      f1_15[0]: /scheduleCBusinesses/*/line3 # 3 "Subtract line 2 from line 1"
      f1_16[0]: /scheduleCBusinesses/*/line4CostOfGoodsSold # 4 "Cost of goods sold (from line 42)"; zero when there is no inventory
      f1_17[0]: /scheduleCBusinesses/*/line5GrossProfit # 5 "Gross profit. Subtract line 4 from line 3"
      f1_18[0]: /scheduleCBusinesses/*/line6OtherIncome # 6 "Other income"
      f1_19[0]: /scheduleCBusinesses/*/line7GrossIncome # 7 "Gross income. Add lines 5 and 6"
      Lines8-16c_ReadOrder[0]:
        f1_20[0]: /scheduleCBusinesses/*/line8Advertising # 8 Advertising (26 U.S.C. 162)
        f1_22[0]: /scheduleCBusinesses/*/line10CommissionsAndFees # 10
        f1_23[0]: /scheduleCBusinesses/*/line11ContractLabor # 11
        f1_26[0]: /scheduleCBusinesses/*/line14EmployeeBenefitPrograms # 14
        f1_27[0]: /scheduleCBusinesses/*/line15Insurance # 15
        f1_28[0]: /scheduleCBusinesses/*/line16aMortgageInterest # 16a
        f1_31[0]: /scheduleCBusinesses/*/line16cOtherInterest # 16c
        f1_32[0]: /scheduleCBusinesses/*/line17LegalAndProfessional # 17
      f1_33[0]: /scheduleCBusinesses/*/line18OfficeExpense # 18
      f1_34[0]: /scheduleCBusinesses/*/line19PensionAndProfitSharing # 19
      f1_36[0]: /scheduleCBusinesses/*/line20bRentOtherProperty # 20b
      f1_37[0]: /scheduleCBusinesses/*/line21RepairsAndMaintenance # 21
      f1_38[0]: /scheduleCBusinesses/*/line22Supplies # 22
      f1_39[0]: /scheduleCBusinesses/*/line23TaxesAndLicenses # 23
      f1_40[0]: /scheduleCBusinesses/*/line24aTravel # 24a
      f1_41[0]: /scheduleCBusinesses/*/line24bDeductibleMeals # 24b half of meals (26 U.S.C. 274(n))
      f1_42[0]: /scheduleCBusinesses/*/line25Utilities # 25
      f1_43[0]: /scheduleCBusinesses/*/line26Wages # 26
      f1_45[0]: /scheduleCBusinesses/*/line27bOtherExpenses # 27b from Part V line 48
      f1_46[0]: /scheduleCBusinesses/*/totalExpenses # 28 "Total expenses before expenses for business use of home"
      f1_47[0]: /scheduleCBusinesses/*/netProfitOrLoss # 29 "Tentative profit or (loss). Subtract line 28 from line 7"
      c1_7[0]: /scheduleCBusinesses/*/line32aAllInvestmentAtRisk # 32a all investment at risk (26 U.S.C. 465)
      c1_7[1]: /scheduleCBusinesses/*/line32bSomeInvestmentNotAtRisk # 32b
      f1_51[0]: /scheduleCBusinesses/*/netProfitOrLoss # 31 "Net profit or (loss). Subtract line 30 from line 29"
    Page2[0]:
      c2_1[0]: /scheduleCBusinesses/*/line33aCost # 33a Cost
      c2_2[0]: /scheduleCBusinesses/*/line33bLowerOfCostOrMarket # 33b Lower of cost or market
      c2_3[0]: /scheduleCBusinesses/*/line33cOther # 33c Other (the return stops)
      c2_4[0]: /scheduleCBusinesses/*/line34ChangeYes # 34 Yes (the return stops)
      c2_4[1]: /scheduleCBusinesses/*/line34ChangeNo # 34 No
      f2_1[0]: /scheduleCBusinesses/*/line35InventoryAtBeginning # 35 Inventory at beginning of year
      f2_2[0]: /scheduleCBusinesses/*/line36PurchasesLessPersonalUse # 36 Purchases less personal use
      f2_3[0]: /scheduleCBusinesses/*/line37InventoryLabor # 37 Cost of labor
      f2_4[0]: /scheduleCBusinesses/*/line38InventoryMaterials # 38 Materials and supplies
      f2_5[0]: /scheduleCBusinesses/*/line39InventoryOtherCosts # 39 Other costs
      f2_6[0]: /scheduleCBusinesses/*/line40GoodsAvailable # 40 Add lines 35 through 39
      f2_7[0]: /scheduleCBusinesses/*/line41InventoryAtEnd # 41 Inventory at end of year
      f2_8[0]: /scheduleCBusinesses/*/line42CostOfGoodsSold # 42 Cost of goods sold, also line 4
      f2_15[0]: /scheduleCBusinesses/*/partV1Description # Part V line 1 description
      f2_16[0]: /scheduleCBusinesses/*/partV1Amount # Part V line 1 amount
      f2_17[0]: /scheduleCBusinesses/*/partV2Description
      f2_18[0]: /scheduleCBusinesses/*/partV2Amount
      f2_19[0]: /scheduleCBusinesses/*/partV3Description
      f2_20[0]: /scheduleCBusinesses/*/partV3Amount
      f2_33[0]: /scheduleCBusinesses/*/line27bOtherExpenses # 48 "Total other expenses. Enter here and on line 27b"
