# Schedule D (Form 1040), PDFBox template for TY2026 print.
# DRAFT-BASED MAPPING (#35): source is the 2026 early-release draft https://www.irs.gov/pub/irs-dft/f1040sd--dft.pdf
# ("Created 4/1/26", 3 pages, 212,300 bytes), committed byte-identical to irs.gov,
# SHA-256 0df9af0711964b3198ea04bb0037b29d6afa85578a671553daed46251630b5f1 (pinned in ../../draft-pdf-sha256.txt and
# rechecked by DraftPdfHashManifestTest). When the final 2026 Schedule D is published, re-download, re-hash and
# re-verify every field below before swapping it in (#124).
# Page 1 of the file is the "Caution: DRAFT-NOT FOR FILING" cover sheet; customMaps.template.skipLeadingPages drops it
# after filling (PdfForm.skipLeadingPages). The draft's AcroForm field names, widget rectangles and line captions match
# the 2025 form this map was first written against (#19), so the field map itself is unchanged.
# AcroForm field names and tooltips re-read with pypdf from the committed 2026 draft.
# Column (h) only for lines 1b/2/3/8b/9/10; line 13 capital gain distributions; lines 6/14 carryover; Part III lines 16 and 21.
# Draft cites (file page = PDF page incl. cover): p. 2 line 7 "Net short-term capital gain or (loss). Combine lines 1a
# through 6 in column (h)"; p. 2 line 15 "Net long-term capital gain or (loss). Combine lines 8a through 14 in column (h)";
# p. 3 line 16 "Combine lines 7 and 15 and enter the result"; p. 3 line 21 "If line 16 is a loss, enter here and on
# Form 1040, 1040-SR, or 1040-NR, line 7a, the smaller of: The loss on line 16; or ($3,000), or if married filing
# separately, ($1,500)".
# Cites: Schedule D instr. (2025) p.3 (§1211(b) $3,000); p.10 (lines 6/14); p.14 (line 21).
includeWhen: /requiresScheduleD
customMaps:
  template:
    skipLeadingPages: "1"
form:
  topmostSubform[0]:
    Page1[0]:
      f1_1[0]: /primaryFiler/fullName space space /pdfSecondaryFiler/fullName
      f1_2[0]: /primaryFiler/tin
      Table_PartI[0]:
        Row1b[0]:
          f1_10[0]: /scheduleDLine1b
        Row2[0]:
          f1_14[0]: /scheduleDLine2
        Row3[0]:
          f1_18[0]: /scheduleDLine3
      f1_21[0]: /scheduleDLine6
      f1_22[0]: /scheduleDLine7
      Table_PartII[0]:
        Row8b[0]:
          f1_30[0]: /scheduleDLine8b
        Row9[0]:
          f1_34[0]: /scheduleDLine9
        Row10[0]:
          f1_38[0]: /scheduleDLine10
      f1_41[0]: /scheduleDLine13 # line 13 capital gain distributions (#86b); f1_39/f1_40 are lines 11/12
      f1_42[0]: /scheduleDLine14
      f1_43[0]: /scheduleDLine15
    Page2[0]:
      # Line 16 = f2_1; line 21 (positive) = f2_4. Lines 18/19 (f2_2/f2_3) are knocked out by #21.
      f2_1[0]: /scheduleDLine16
      f2_4[0]: /scheduleDLine21
