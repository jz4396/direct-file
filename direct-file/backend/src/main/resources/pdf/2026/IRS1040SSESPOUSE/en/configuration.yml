# Spouse's 2026 Schedule SE (Form 1040). Same draft bytes as IRS1040SSE
# (pdf/2026/IRS1040SSE/en/f1040sse--dft.pdf, SHA-256
# a59fa5dcf2f0a8a5a71c46aa3837e9e8e605eeecc0a666bcb784a368900d141c). A second template name is required
# because the field map is static. 2026 Instructions for Schedule SE
# (https://www.irs.gov/instructions/i1040sse, SHA-256 prefix 7054fa6c86d89301), p. 2: "If both spouses have
# self-employment income, each must file a separate Schedule SE."
#
# Included when /secondaryFilerSeTaxApplies. Line 8a is only this spouse's W-2 boxes 3 and 7
# (/secondaryFilerScheduleSELine8a). 26 U.S.C. 1402(b)(1). The primary filer's wages stay on IRS1040SSE.
# Church employee income (lines 5a and 5b) is not mapped: the spouse's church employee income stops the
# return (scheduleSE /hadSecondaryFilerChurchEmployeeIncome). Lines 8b and 8c stay blank for the same
# reasons as the primary filer's Schedule SE.
# $0 amounts print blank. With line 8a at or above $184,500, lines 8d, 9, and 10 are $0 and print blank.
includeWhen: /secondaryFilerSeTaxApplies
# Read for the line 3 dotted-line stamp. Not mapped to an AcroForm field. 26 U.S.C. 1402(c)(1).
otherRequiredFacts:
  - /scheduleCSecondaryFilerNotaryNetProfit
  - /secondaryFilerNonfarmOptionalMethodApplies
customMaps:
  template:
    skipLeadingPages: "1"
form:
  topmostSubform[0]:
    Page1[0]:
      f1_1[0]: /secondaryFiler/fullName # "Name of person with self-employment income"
      f1_2[0]: /secondaryFiler/tin # "Social security number of person with self-employment income"
      f1_5[0]: /secondaryFilerSeReportedNetProfit # 2 "Net profit or (loss) from Schedule C, line 31"
      f1_6[0]: /secondaryFilerSeReportedLine3 # 3 "Combine lines 1a, 1b, and 2" minus notary net profit
      f1_7[0]: /secondaryFilerSeReportedLine4a # 4a "If line 3 is more than zero, multiply line 3 by 92.35% (0.9235)"
      f1_8[0]: /secondaryFilerSeLine4b # 4b optional methods
      f1_9[0]: /secondaryFilerSeLine4c # 4c "Combine lines 4a and 4b"
      f1_12[0]: /secondaryFilerSeIncome # 6 "Add lines 4c and 5b"
      f1_14[0]: /secondaryFilerScheduleSELine8a # 8a this spouse's boxes 3 and 7 only. 26 U.S.C. 1402(b)(1)
      f1_17[0]: /secondaryFilerScheduleSELine8d # 8d
      f1_18[0]: /secondaryFilerSeRemainingSocialSecurityWageBase # 9 "Subtract line 8d from line 7"
      f1_19[0]: /secondaryFilerSeSocialSecurityTax # 10 "Multiply the smaller of line 6 or line 9 by 12.4% (0.124)"
      f1_20[0]: /secondaryFilerSeMedicareTax # 11 "Multiply line 6 by 2.9% (0.029)"
      f1_21[0]: /secondaryFilerSelfEmploymentTax # 12 "Self-employment tax. Add lines 10 and 11"
      f1_22[0]: /secondaryFilerDeductibleSelfEmploymentTax # 13 "Deduction for one-half of self-employment tax"
    Page2[0]:
      f2_3[0]: /secondaryFilerSeLine16 # 16 "Subtract line 15 from line 14"
      f2_4[0]: /secondaryFilerSeLine17 # 17 nonfarm optional method
