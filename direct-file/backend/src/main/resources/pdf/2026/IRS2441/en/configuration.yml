# Form 2441, PDFBox template for TY2026 print.
# DRAFT-BASED MAPPING (#120): source is the 2026 early-release draft https://www.irs.gov/pub/irs-dft/f2441--dft.pdf
# (created 4/30/26, 3 pages, 296,519 bytes), committed byte-identical to irs.gov,
# SHA-256 67eca7567ce5ff06e72d40a07db487f406da33139e664c0c0d9c67a4e31e9385 (pinned in ../../draft-pdf-sha256.txt and
# rechecked by DraftPdfHashManifestTest). When the final 2026 Form 2441 is published, re-download, re-hash and
# re-verify every field below before swapping it in (#124).
# Page 1 of the file is the "Caution: DRAFT-NOT FOR FILING" cover sheet; skipLeadingPages drops it.
# AcroForm field names, tooltips and widget rectangles re-read with pypdf from the committed draft. The 2024 template
# has no tooltips, so it was matched by widget position and the printed line captions.
# - Part I (line 1) is redesigned. 2024: one row per provider with columns (a) name, (b) address (two fields),
#   (c) identifying number, (d) household employee Yes/No, (e) amount paid. 2026: one column per provider ("Provider 1"
#   to "Provider 3") with rows 1a name, 1b address (one multi-line field), 1c identifying number, 1d "Was the care
#   provider your household employee in 2026?" Yes/No, 1e amount paid. Each fact keeps its meaning; only the field
#   moves (see the per-field comments). The second 2024 address field (ColB f1_5/f1_10/f1_15, always blank) has no
#   2026 counterpart.
# - Line 2 and lines 3-11: same lines and order; field numbers shift down by 3 (2024 f1_18..f1_40 -> 2026
#   f1_15..f1_37) because Part I lost the three blank address fields.
# - Page 2 (Part III, lines 12-31): field names unchanged. Line 21 now reads "Enter $7,500 ($3,750 if married filing
#   separately ...)", which matches /cdccMaximumExclusion (IRC §129(a)(2)(A) as amended by P.L. 119-21, cited in
#   cdcc.xml).
# Line 8 decimal: IRC §21(a)(2) as amended by P.L. 119-21 (50% reduced to 35%, then to 20%) is already in the fact
# dictionary (/cdccCareExpensesDecimalAmount, cdcc.xml); this map prints that fact as before.
includeWhen: /shouldSubmitForm2441
customMaps:
  template:
    skipLeadingPages: "1"
form:
  topmostSubform[0]:
    Page1[0]:
      f1_1[0]: /primaryFiler/fullName
