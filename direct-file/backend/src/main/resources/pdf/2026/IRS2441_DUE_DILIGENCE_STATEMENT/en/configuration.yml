# REPO-BUILT STATEMENT. Not an IRS download: the SHA-256 pin is the ty2026-template-manifest.txt
# row, not draft-pdf-sha256.txt, final-pdf-sha256.txt, state-interim-pdf-sha256.txt, or
# continuous-use-pdf-sha256.txt.
# #124 SWAP: Form 2441 line 1c due diligence. There is no IRS form for this attachment.
# pdf/2026/IRS2441/en/f2441--dft.pdf page 2 (Form 2441 page 1; page 1 of the file is the draft cover
# sheet), line 1c: "Identifying number (SSN or EIN)". SHA-256
# 67eca7567ce5ff06e72d40a07db487f406da33139e664c0c0d9c67a4e31e9385
# (https://www.irs.gov/pub/irs-dft/f2441--dft.pdf). When that number is missing,
# /cdccCareProviders/*/pdfTinEinColumn in cdcc.xml prints "See Attached Statement". This statement
# is that attachment. Heading: "I can't get the identifying number (EIN/SSN) for the care provider(s)
# listed in this table." Columns: "Care provider's name" and "Reasons why taxpayer can't get the
# care provider's identifying number". Reason text is written by Irs2441DueDiligencePdfTable from
# /cdccDueDiligenceOptions. The statement prints no dollar amount.
includeWhen: /pdfNeedDueDiligenceStatement
table:
  rowsCollectionPath: /cdccCareProvidersWithDueDiligenceReasons
  rowsPerPage: 13
  columns:
    - factExpression: /cdccCareProviders/*/displayName
      fieldName: Care providers nameRow
    - factExpression: /cdccCareProviders/*/~dueDiligence
      fieldName: Reasons why taxpayer cant get the care providers identifying numberRow
otherRequiredFacts:
  - /cdccCareProviders/*/dueDiligence
