# #122(a): 2026 Form 6251, Alternative Minimum Tax—Individuals. DRAFT-BASED MAPPING.
# Source: https://www.irs.gov/pub/irs-dft/f6251--dft.pdf (early-release draft, "Created 5/26/26"), committed
# byte-identical to irs.gov; SHA-256 a547fc9d629e1f04bdc30e088214c716667b88cb1b45447c580c0ae33095b5cc
# (pinned in pdf/2026/draft-pdf-sha256.txt and rechecked by DraftPdfHashManifestTest). Every field name and line
# caption below comes from this draft's AcroForm tooltips (pypdf). When the final 2026 Form 6251 is released, re-download
# it, re-hash it, and re-verify every field name and line number here before swapping it in (#124).
# Page 1 of the file is the "Caution: DRAFT—NOT FOR FILING" cover sheet; skipLeadingPages drops it after filling.
#
# Included when /form6251Required: Instructions for Form 6251 (2025), p. 1, "Who Must File", item 1 (line 7 is greater
# than line 10). Items 2-4 cannot apply in scope (no Form 3800, 8834, 8911 or 8801; lines 2c-3 are a stop).
#
# Part III (lines 12-40) prints only when line 7 requires it (/form6251UsesPartIII); Irs6251PdfForm fills the
# ~form6251PartIIILineNN pseudo-facts from /form6251LineNN in that case and leaves them blank otherwise.
#
# Not mapped, left blank (never a silent 0), because a nonzero amount is a stop that blocks submission:
#   2b  Schedule 1 line 1 / 8z tax refund: Form 1099-G box 2 refunds and 8z income are unsupported income sources
#       (/incomeSourcesSupported = false is part of /flowIsKnockedOut); the app has no Schedule 1 line 1 or 8z input.
#   2c-2t, 3  AMT adjustments and preferences: /flowKnockoutAmtPreferenceItems (/hasAmtPreferenceItems). Line 2g
#       (private activity bond interest, 1099-INT box 9) is also /flowKnockoutHasBonds.
#   8   AMT foreign tax credit: 1099-INT foreign tax /flowKnockoutHasForeignTaxPaid; 1099-DIV foreign tax
#       /flowKnockoutDividendForeignTaxPaid whenever line 7 > $0 (always true when this form prints).
#   14  Schedule D line 19 (unrecaptured §1250 gain): /flowKnockoutUnrecaptured1250Gain.
#   35-37  "If line 14 is zero or blank, skip lines 35 through 37" (line 37 is 0 in line 38).
#   33-34  blank when "lines 32 and 12 are the same, skip lines 33 through 37" (Irs6251PdfForm).
# $0 amounts print blank (FactGraphService zero suppression) except where the form says "enter -0-": lines 6, 7, 9,
# 10, 11, 21 (and 26 = 21) and 29, whose facts carry <ExportZero />.
includeWhen: /form6251Required
customMaps:
  template:
    skipLeadingPages: "1"
