# #89: Form 8862 (Rev. December 2025), Information To Claim Certain Credits After Disallowance.
# YEAR-BASED MAPPING: continuous-use final form for tax year 2026 returns (26 U.S.C. 32(k)(2) / 24(g)
# recertification after disallowance; Form 8862 Rev. 12-2025 p. 1).
# Source: https://www.irs.gov/pub/irs-pdf/f8862.pdf (Rev. December 2025, Cat. No. 25145E, Created 1/8/26,
# 3 PDF pages, 153,254 bytes), committed byte-identical to irs.gov; SHA-256
# fd783d1f46f1f286cd1d7a2cca8812fc2ec05760478359873e22ba9d05d5f3b5 (pinned in
# ../../continuous-use-pdf-sha256.txt and rechecked by ContinuousUsePdfHashManifestTest).
# All 128 AcroForm field names match pdf/2024/IRS8862/en/f8862_accessible.pdf (Rev. October 2024), so this
# 36-fact field map carries over. Line captions below were checked against the Rev. 12-2025 face text (no
# /TU tooltips on the final). No 2026 Spanish Form 8862 is posted; es stays on the 2024 template and is
# refused for TY2026 (26 U.S.C. 6011(a)). CTC/ODC statement attachments stay on pdf/2024.
#
# Included when /pdfIncludeForm8862 (EITC and/or CTC/ODC recertification). Part IV (AOTC) stays out of scope.
includeWhen: /pdfIncludeForm8862
