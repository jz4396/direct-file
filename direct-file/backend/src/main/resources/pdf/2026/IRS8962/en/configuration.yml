# #88: 2026 Form 8962, Premium Tax Credit (PTC). DRAFT-BASED MAPPING.
# Source: https://www.irs.gov/pub/irs-dft/f8962--dft.pdf (early-release draft, "Created 4/21/26"), committed
# byte-identical to irs.gov; SHA-256 5b692171ee43a4596eabfcaad83bea920e6356c492656a1648f2aaf018cd1d35
# (pinned in pdf/2026/draft-pdf-sha256.txt and rechecked by DraftPdfHashManifestTest). Field names and line captions
# come from this draft's AcroForm tooltips (pypdf). They are not the 2024 field names: the 2026 draft inserts line 2b
# and line 6 checkboxes, so the annual row starts at f1_12 (2024: f1_13) and lines 24-27 are f1_90-f1_93 (2024:
# f1_91-f1_94). When the final 2026 Form 8962 is released, re-download it, re-hash it and re-verify every field name
# and line number here before swapping it in.
# Page 1 of the file is the "Caution: DRAFT—NOT FOR FILING" cover sheet; skipLeadingPages drops it after filling.
# No 2026 Instructions for Form 8962 are posted (irs.gov/pub/irs-dft/i8962--dft.pdf is still the 2025 instructions).
# No 2026 Spanish Form 8962 draft (f8962sp--dft.pdf is 404); this English draft is the template.
#
# Included when /needsToFileForm8962. Part IV (shared policy allocation) and Part V (alternative calculation for year
# of marriage) are not computed: /flowKnockoutPtcAllocationOfPolicyAmounts and
# /flowKnockoutPtcAlternativeCalculationForYearOfMarriage. Line 9 Yes is that case, so a printed form checks line 9 No.
#
# Not mapped, left blank (never a silent 0):
#   2b  dependents' modified AGI. Household income here is the filer's MAGI (/householdIncome = /ptcMagi). No
#       dependents' MAGI fact, so line 2b is not entered as $0.
#   9 Yes  allocating policy amounts or the alternative calculation for year of marriage. Those returns are knocked
#       out, so a printed form does not check Yes.
#   28, 29  "Reserved for future use" (Rev. Proc. 2025-32 sec. 2.04: the 26 U.S.C. 36B(f)(2)(B) repayment limitation
#       is removed). The 2024 map put the excess repayment on the old line 29. On this draft that amount is line 27
#       (/netPtcAmountWhenNegative) and Schedule 2 line 1a (/lesserOfNetPtcAmountAndRepaymentLimitation). Do not
#       write it on lines 28-29.
#   Part IV lines 30-34 and Part V lines 35-36. The two knockouts above refuse the print, so those lines are not $0.
# $0 amounts print blank (FactGraphService zero suppression) except where the form says "enter -0-": line 26
# (/netPtcAmountWhenZeroOrPositive has <ExportZero />). Lines 12-23 stay blank when line 10 is Yes
# (/ptcCanReportAnnualTotals); line 11 stays blank when line 10 is No.
includeWhen: /needsToFileForm8962
customMaps:
  template:
    skipLeadingPages: "1"
