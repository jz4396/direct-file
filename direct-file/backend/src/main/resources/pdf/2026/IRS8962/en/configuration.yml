      c1_1[0]: /claimingMfsException # A "married filing separately" exception
      f1_3[0]: /taxFamilySize # 1 "Tax family size"
      f1_4[0]: /ptcMagi # 2a "Modified AGI"
      # f1_5[0]: 2b dependents' modified AGI. Not computed; leave blank.
