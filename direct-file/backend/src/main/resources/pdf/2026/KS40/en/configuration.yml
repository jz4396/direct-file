# #93 slice 8: Kansas Form K-40. YEAR-BASED MAPPING: 2025 FORM AS THE INTERIM TAX YEAR 2026 TEMPLATE.
# The 2026 Form K-40 is not posted. This 2025 fillable form (rev. 8-5-25) stands in.
# Amounts are the 2025 booklet figures K.S.A. 79-32,110b, 79-32,119, and 79-32,121 still state for later years.
# Preprinted text that still says 2025 is left as printed.
# Source: https://ksrevenue.gov/pdf/k-4025.pdf
# SHA-256 dfff7caae33d2527ae9655f562a3469835556cc6ec6ab40297641caf10379fdb
# Included when /stateReturnIsKs. Stops in ksPit refuse the package, so the zero lines below are the supported entry.
# Whole dollars, no commas, no decimals. Zero prints 0. Lines 9 and 10 stay blank because a resident skips them.
# Ks40PdfForm fills the ~ks40* pseudo-facts (name, address, phone, filing status, residency, exemption boxes).
includeWhen: /stateReturnIsKs
otherRequiredFacts:
  - /isFilingStatusMFJ
  - /filingStatus
  - /address
  - /phone
  - /primaryFiler/firstName
  - /primaryFiler/middleInitial
  - /primaryFiler/lastName
  - /primaryFiler/tin
  - /secondaryFiler/firstName
  - /secondaryFiler/middleInitial
  - /secondaryFiler/lastName
  - /secondaryFiler/tin
  - /ksResidencyStatus
  - /ksLine1
  - /ksLine3
  - /ksLine4
  - /ksLine5
  - /ksLine6
  - /ksLine7
  - /ksLine8
  - /ksLine12
  - /ksLine16
  - /ksLine18
  - /ksLine19
  - /ksLine27
  - /ksLine28
  - /ksLine32
  - /ksLine33
  - /ksLine43
