# #93 slice 6: Massachusetts Form 1. YEAR-BASED MAPPING: 2025 FORM AS THE INTERIM TAX YEAR 2026 TEMPLATE.
# The 2026 Form 1 is not the template. This 2025 fillable form stands in. Amounts are tax year 2026.
# Preprinted text that still says 2025 is left as printed. Line 22 is line 21 times 5 percent, rounded once.
# Source: https://www.mass.gov/doc/2025-form-1-massachusetts-resident-income-tax-return/download
# SHA-256 0bb62498fda14b515084b83fb4467f379f17d08a712f6390b1cd2fceecb04a07
# Included when /stateReturnIsMa. Stops in maPit refuse the package, so the zero lines below are the supported entry.
# Whole dollars, no commas, no decimals. Zero prints 0.
# Ma1PdfForm fills the ~ma1* pseudo-facts (name, address, phone, email, filing-status export value).
includeWhen: /stateReturnIsMa
otherRequiredFacts:
  - /isFilingStatusMFJ
  - /filingStatus
  - /address
  - /phone
  - /email
  - /primaryFiler/firstName
  - /primaryFiler/middleInitial
  - /primaryFiler/lastName
  - /primaryFiler/tin
  - /secondaryFiler/firstName
  - /secondaryFiler/middleInitial
  - /secondaryFiler/lastName
  - /secondaryFiler/tin
  - /maResidencyStatus
  - /maLine22
  - /maLine54
  - /maElectsOptionalRate
  - /totalIncome
  - /agi
form:
  'taxpayer''s first name': ~ma1First
  'taxpayer''s middle initial': ~ma1Middle
  'taxpayer''s last name': ~ma1Last
  'taxpayer''s social security number': /primaryFiler/tin
  'Spouse''s first name': ~ma1SpouseFirst
  'Spouse''s middle initial': ~ma1SpouseMiddle
  'spouse''s last name': ~ma1SpouseLast
  'spouse''s social security number': ~ma1SpouseSsn
  'Mailing address (no. & street; apt./suite/postal box). If you have a foreign address, also complete line below': ~ma1Street
  'city or town': ~ma1City
  'state': ~ma1State
  'zip': ~ma1Zip
  'taxpayer phone number': ~ma1Phone
  'taxpayer email address': ~ma1Email
  'line 1 filing status': ~ma1FilingStatus
  'line 22 oval. Note: If choosing the optional 5.85% tax rate, fill in oval and see instructions': /maElectsOptionalRate
  'a Total federal income from U.S. Form 1040, line 9': /totalIncome
  'b Total federal income from U.S. Form 1040, line 11a': /agi
  'line 2a Personal exemptions. Single/Married filing separately ($4,400), Head of household ($6,800), Married filing jointly ($8,800)': /maLine2a
  'line 2g. Total exemptions. Add lines 2a through 2f. Enter here and on line 18': /maLine2g
  'line 3. Wages, salaries, tips and other employee compensation (from all Forms W-2)': /maLine3
  'line 10. Total 5.0% income. Add lines 3 through 9. Be sure to subtract any losses in lines 6 or 7': /maLine10
