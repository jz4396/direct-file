# #93 slice 4: Form D-400. YEAR-BASED MAPPING: 2025 WEB-FILL AS THE INTERIM TAX YEAR 2026 TEMPLATE.
# The 2026 D-400 is not posted. This 2025 web-fill is fillable. Amounts are tax year 2026 (rate 3.99%).
# The preprinted line 15 sentence still says "Multiply Line 14 by 4.25% (0.0425)." The filled amount is the 2026 tax.
# Source: https://www.ncdor.gov/2025-d-400-web-filled-version/open
# SHA-256 2bf6e0b44e628a05cc401d22f7cf6f8c7b39db529d345f4bcf7d93ccfe170d63
# Included when /stateReturnIsNc. Stops in ncPit refuse the package, so the zero lines below are the supported entry.
# Whole dollars, no commas, no decimals. Zero prints 0. Line 13 (part-year percentage) stays blank.
# NcD400PdfForm fills the ~ncD400* pseudo-facts (names, address, county, circles).
includeWhen: /stateReturnIsNc
otherRequiredFacts:
  - /isFilingStatusMFJ
  - /filingStatus
  - /address
  - /phone
  - /primaryFiler/firstName
  - /primaryFiler/middleInitial
  - /primaryFiler/lastName
  - /primaryFiler/tin
  - /secondaryFiler/firstName
  - /secondaryFiler/middleInitial
  - /secondaryFiler/lastName
  - /secondaryFiler/tin
  - /ncResidencyStatus
  - /ncCounty
  - /ncIsVeteran
  - /ncSpouseIsVeteran
  - /ncItemizes
  - /ncHasUseTax
  - /ncLine34
form:
  y_d400wf_fname1: ~ncD400First
  y_d400wf_mi1: ~ncD400Mi
  y_d400wf_lname1: ~ncD400Last
  y_d400wf_ssn1: /primaryFiler/tin
  y_d400wf_fname2: ~ncD400SpouseFirst
  y_d400wf_mi2: ~ncD400SpouseMi
  y_d400wf_lname2: ~ncD400SpouseLast
  y_d400wf_ssn2: ~ncD400SpouseSsn
  y_d400wf_sname2: ~ncD400MfsSpouseName
  y_d400wf_sssn2: ~ncD400MfsSpouseSsn
  y_d400wf_add: ~ncD400Street
  "y_d400wf_apartment number": ~ncD400Apt
  y_d400wf_city: ~ncD400City
  y_d400wf_state: ~ncD400State
