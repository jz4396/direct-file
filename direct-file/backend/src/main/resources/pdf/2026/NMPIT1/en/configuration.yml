# #93 slice 9: New Mexico PIT-1. YEAR-BASED MAPPING: 2025 FORM AS THE INTERIM TAX YEAR 2026 TEMPLATE.
# The 2026 PIT-1 is not posted. This 2025 form stands in. The published PDF has no fillable fields;
# the fields below were added on that form. Preprinted text that still says 2025 is left as printed.
# Source: https://realfile.tax.newmexico.gov/2025pit-1.pdf
# SHA-256 70a37142468c02661f871cb53030a86fa3666492bfb94a09ea8fa801f2a08e03
# Included when /stateReturnIsNm. Stops in nmPit refuse the package, so the zero lines below are the supported entry.
# Whole dollars, no commas, no decimals. Zero prints 0.
# NmPit1PdfForm fills the ~nm* pseudo-facts (name, address, filing status, residency, rate-table indicator).
includeWhen: /stateReturnIsNm
otherRequiredFacts:
  - /isFilingStatusMFJ
  - /filingStatus
  - /address
  - /primaryFiler/firstName
  - /primaryFiler/middleInitial
  - /primaryFiler/lastName
  - /primaryFiler/tin
  - /secondaryFiler/firstName
  - /secondaryFiler/middleInitial
  - /secondaryFiler/lastName
  - /secondaryFiler/tin
  - /nmResidencyStatus
  - /nmPit1Line9
  - /nmPit1Line10
  - /nmPit1Line11
  - /nmPit1Line12
  - /nmPit1Line13
  - /nmPit1Line14
  - /nmPit1Line15
  - /nmPit1Line17
  - /nmPit1Line18
  - /nmPit1Line19
  - /nmPit1Line20
