# #123: PA-40, Pennsylvania Personal Income Tax Return. YEAR-BASED MAPPING: 2025 FORM AS THE INTERIM TAX YEAR 2026
# TEMPLATE. The PA Department of Revenue has not published the 2026 PA-40 yet, so the 2025 form stands in (#124 swaps it).
# Source: https://www.pa.gov/content/dam/copapwp-pagov/en/revenue/documents/formsandpublications/formsforindividuals/pit/documents/2025/2025_pa-40.pdf
# committed byte-identical as 2025_pa-40.pdf; SHA-256 fcd7648601f3ce5a7a258be49c54aa1c604e1c61c1fe9175351451ac6087d8b3
# (pinned in pdf/2026/state-interim-pdf-sha256.txt). When the 2026 form is published: download it, hash it, re-check
# every field name, export value and line number below against it, then replace the file and the manifest row.
#
# Field names are the PDF's own fully qualified AcroForm names (PDFBox). Each mapped box was checked against the printed
# line caption beside it, and the filled pages were rendered. Page cites ("p.") are to the PA-40 IN (2025) booklet,
# https://www.pa.gov/content/dam/copapwp-pagov/en/revenue/documents/formsandpublications/formsforindividuals/pit/documents/2025/2025_pa-40in.pdf
# Pa40PdfForm fills the ~pa40* pseudo-facts (upper case, ovals, part-year dates, line 4–6 loss ovals, lines 19a-20).
# Amounts: whole dollars rounded half-up (p. 4), written as the form shows them (1,234.00); $0 prints blank.
#
# Included when stateReturn /stateReturnPaFiled (full-year resident, #78, or PA/FL part-year resident, #80).
#
# Line 4 is mapped (~pa40Line4 and the loss oval). Full-year federally supported Schedule C net is /paLine4 (federal
# line 31 plus the PA 100% meals add-back). Tax Reform Code of 1971 §303(a)(2). PA-40 IN (2025) p. 17, LINE 4. PA-40 C
# (EX) 03-26 line 39 / meals 100%. $0 prints blank. This package does not include a PA Schedule C PDF; the federal
# Schedule C (IRS1040SC) is not the PA schedule and is not claimed as one. A PA/FL part-year resident with Schedule C,
# inventory/COGS until #277, a joint Schedule C loss, or other unclassified income is
# /flowKnockoutPaUnsupportedIncome and does not print.
#
# Line 6 is mapped (~pa40Line6 and the loss oval). Full-year federal Schedule E Part I net is /paLine6. Tax Reform
# Code of 1971 §303(a)(4): "Net gains or income derived from or in the form of rents, royalties, patents and
# copyrights." PA-40 IN (2025) p. 18, LINE 6: "You may use federal Schedule E, if using only Part I, and with the
# following adjustments". $0 prints blank. A Schedule K-1, or Schedule E Part I income of a PA/FL part-year resident,
# is /flowKnockoutPaUnsupportedIncome and does not print.
#
# Not mapped, left blank. Each is either never entered on a supported return or is a stop that keeps the return
# from reaching print. The stops below are BlockSubmissionOnTrue facts in stateReturn /flowKnockoutStateReturn
# (and therefore /flowIsKnockedOut) and are listed in PrintRefusingKnockouts.FACT_PATHS. PdfService builds no PDF
# unless every listed path is complete and false, so a yes or an unanswered screener refuses the package instead of
# printing the unmodeled line blank:
#   1b                  unreimbursed employee business expenses: /flowKnockoutPaUnreimbursedEmployeeExpenses (#102).
#   7, 8                estate/trust, gambling/lottery: /flowKnockoutPaUnsupportedItems.
#   10 and Code         other deductions (Schedule O, 529, ABLE, MSA/HSA): /flowKnockoutPaUnsupportedItems.
#   14, 16, REV-459B    prior-year credit, extension payment, and Form REV-459B (consent to transfer estimated
#                       payments): /flowKnockoutPaUnsupportedItems. The REV-459B oval stays blank.
#   17                  nonresident tax withheld (PA Schedule NRK-1, from partnership, S corporation, or estate/trust
#                       income) stays stopped.
# Mapped through ~pa40Line15 and ~pa40Line18 (otherRequiredFacts /paLine15 and /paLine18). PA-40 IN (2025).
#   15                  p. 21, LINE 15: "Enter your total 2025 estimated payments." 72 P.S. §7325. Pennsylvania payments
#                       only. Not Form 2210 and not federal estimated tax. $0 prints blank.
#   18                  p. 22, LINE 18: "Add only Lines 14, 15, 16, and 17." On a return that reaches print, lines 14, 16,
#                       and 17 are not claimed, so line 18 equals line 15. $0 prints blank.
#   22, 23              resident credit (Schedule G-L) and other credits: /flowKnockoutPaUnsupportedItems. A PA/FL
#                       part-year return has no G-L credit (Florida levies no income tax), so part-year printing needs
#                       only the Residency Status oval and the from/to dates below.
#   25                  use tax: /flowKnockoutPaUnsupportedItems.
#   PA Schedules A, B, D are not produced. A return that needs one stops: /flowKnockoutPaScheduleA (p. 31: any amount
#                       on Schedule A lines 2-15, e.g. 1099-INT box 3 or box 8 interest, or part-year interest),
#                       /flowKnockoutPaScheduleB (p. 32: any amount on Schedule B lines 2-10)
#                       and /flowKnockoutPaScheduleD (any sale, gain or loss; Schedule D instructions: "even if the only
#                       transaction is to report a loss"). So line 5 and its loss oval stay mapped but are blank on any
#                       return that reaches print.
#   27, Code, REV-1630  penalties and interest: not computed; p. 23 says to enter penalties owed, which the department
#                       otherwise bills. Line 28 therefore equals line 26.
#   31-36               credit forward and refund donations: not offered; p. 24, "If you do not enter amounts on Lines
#                       30 through 36 ... you will receive a refund check", and line 30 = line 29.
#   N (Nonresident), Extension, Amended, Final Return (F), Deceased, Farmers, dates of death, Country Code, signature
#   date, preparer and E-File Opt Out boxes: not collected or out of scope.
includeWhen: /stateReturnPaFiled
customMaps:
  template:
    # p. 5 asks for the district name; the box has an automatic font size, which cuts off long names (PdfForm).
    fitTextToWidth: "Name of School District"
otherRequiredFacts:
  - /isMarried
  - /isFilingStatusMFJ
  - /address
  - /primaryFiler/firstName
  - /primaryFiler/lastName
  - /primaryFiler/middleInitial
  - /primaryFiler/suffix
  - /primaryFiler/fullName
  - /primaryFiler/occupation
  - /secondaryFiler/firstName
  - /secondaryFiler/lastName
  - /secondaryFiler/middleInitial
  - /secondaryFiler/suffix
  - /secondaryFiler/fullName
  - /secondaryFiler/occupation
  - /secondaryFiler/tin
  - /paResidencyStatusPartYear
  - /paPartYearMovedOut
  - /paSchoolCode
  - /paPartYearMoveDate
  - /paLine4
  - /paLine5
  - /paLine6
  - /paLine15
  - /paLine18
  - /paSpLine11
  - /paSpLine16
  - /paSpDependentChildCount
form:
  # Header, page 1 (pp. 5-7).
  "Enter SSN shown first without dashes or spaces": /primaryFiler/tin # also prints in the page 2 SSN box (same field)
  "Enter SSN of spouse without dashes or spaces": ~pa40SpouseSsn # p. 7, required even if filing separately
  "Use all caps to enter taxpayer's last name": ~pa40LastName
  "Use all caps to enter suffixes such as JR, SR, III": ~pa40Suffix
  "Use all caps to enter taxpayer's first name": ~pa40FirstName
  "Use Cap For Your Middle Initial": ~pa40MiddleInitial
  "Use all caps to enter spouse's first name": ~pa40SpouseFirstName
  "Use Cap For Your Spouse's Middle Initial": ~pa40SpouseMiddleInitial
  "Use all caps to enter spouse's last name if different from above": ~pa40SpouseLastName
  "Use all caps to enter spouse's suffixes such as JR, SR, III": ~pa40SpouseSuffix
  "Use all caps to enter First Line of Address": ~pa40Address1
  "Use all caps to enter Second Line of Address": ~pa40Address2
  "Use all caps to enter City or Post Office": ~pa40City
  "Use all caps to enter two character State abbreviation": ~pa40State
  "Enter five digit Zip Code": ~pa40Zip
  "Enter Daytime Telephone Number without parenthesis, dashes or spaces": /phone # p. 5
  "Enter five digit School Code from list on pags 42 & 43": ~pa40SchoolCode # p. 5 (/paSchoolCode); 99999 for a PA-to-FL mover (p. 6)
  "Name of School District": ~pa40SchoolDistrict # p. 5, name for the code from pp. 46-47 (PaSchoolDistricts); blank for 99999
  "Residency Status": ~pa40Residency # p. 6: 1 = R, 3 = P
  "Part Year Resident from": ~pa40PartYearFrom # P oval "from MM/DD"
  "Part year resident to": ~pa40PartYearTo # "to MM/DD"
  "Filing Status": ~pa40FilingStatus # pp. 6-7: 1 = S, 2 = J, 3 = M
  "Your Occupation": ~pa40Occupation
  "Spouse's occupation": ~pa40SpouseOccupation
  # Lines 1a-11, page 1.
  "1a. Gross Compensation": /paLine1a # p. 10, LINE 1a (W-2 box 16)
  "1c. Net Compensation": /paLine1c # 1a minus 1b
  "2. Interest Income": /paLine2 # p. 14, LINE 2; prints only when PA Schedule A is not required (/flowKnockoutPaScheduleA, p. 31)
  "3. Dividend  and Capital Gains Distributions Income": /paLine3 # p. 15, LINE 3; federal ordinary dividends (Form 1040 line 3b) when PA Schedule B lines 2-10 are $0; $0 prints blank. Schedule B stop /flowKnockoutPaScheduleB (p. 32)
  "4. Loss": ~pa40Line4Loss # p. 15, same loss oval; p. 17, LINE 4
  "4. Net Income or Loss from the Operation of a Business, etc": ~pa40Line4 # p. 17, LINE 4 (federal Sch C line 31 + PA meals add-back; $0 blank). No PA Schedule C PDF in this package.
  "5. Loss": ~pa40Line5Loss # p. 15, "If entering a loss, fill in the oval next to the line"
  "5. Net Gain or Loss from Sale, etc. of Property": ~pa40Line5 # p. 17, LINE 5 (size of a loss; see the oval)
  "6. Loss": ~pa40Line6Loss # p. 15, same loss oval; p. 18, LINE 6
  "6. Net Income or Loss from Rents, etc": ~pa40Line6 # p. 18, LINE 6 (federal Schedule E Part I net; $0 blank)
  "9. Total PA Taxable Income": /paLine9 # p. 20, LINE 9 (losses are not added)
  "11. Adjusted PA Taxable Income": /paLine11 # p. 21, LINE 11 (9 minus 10)
  # Lines 12-30, page 2.
  "Name(s)": ~pa40Names
  "12. PA Tax Liability. Multiply Line 11 by 3.07%": /paLine12 # p. 21, LINE 12 (72 P.S. §7302 rate)
  "13. Total PA Tax Withheld": /paLine13 # p. 21, LINE 13 (W-2 box 17)
  "15. Estimated Installment Payments": ~pa40Line15 # p. 21, LINE 15 (72 P.S. §7325; PA estimated installment payments; $0 blank). Not Form 2210.
  "18.Total Estimated Payments and Credits": ~pa40Line18 # p. 22, LINE 18 (14 + 15 + 16 + 17; 14, 16, 17 stopped)
  "Tax Forgiveness": ~pa40TaxForgivenessStatus # p. 22, LINE 19a: 1 = Unmarried or Separated, 2 = Married
  "Dependents": ~pa40DependentChildren # p. 22, LINE 19b (Schedule SP Section II line 2)
  "20. Total Eligibility Income": ~pa40EligibilityIncome # p. 22, LINE 20 (Schedule SP line 11)
  "21. Tax Forgiveness Credit": /paLine21 # p. 22, LINE 21 (Schedule SP line 16, 72 P.S. §7304)
  "24. Total Payments and Credits": /paLine24 # p. 23, LINE 24 (13 + 18 + 21 + 22 + 23)
  "26. TAX DUE": /paLine26 # p. 23, LINE 26
  "28. TOTAL PAYMENT": /paLine26 # p. 24, LINE 28 "Add Lines 26 and 27" (27 not computed)
  "29. OVERPAYMENT": /paLine29 # p. 24, LINE 29
  "30. Refund": /paLine29 # p. 24, LINE 30 (all of line 29; lines 31-36 not offered)
