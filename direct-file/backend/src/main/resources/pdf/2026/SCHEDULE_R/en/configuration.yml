# #89: 2026 Schedule R (Form 1040), Credit for the Elderly or the Disabled. DRAFT-BASED MAPPING.
# Source: https://www.irs.gov/pub/irs-dft/f1040sr--dft.pdf (early-release draft, PDF metadata CreationDate
# 2026-04-21, title "2026 Schedule R (Form 1040)", 3 PDF pages, 208,960 bytes), committed byte-identical to
# irs.gov; SHA-256 0fcbd9fe296b470b2a0ceadc497380159f7d872f7aa11d86ae856bbd2234f5b6 (pinned in
# ../../draft-pdf-sha256.txt and rechecked by DraftPdfHashManifestTest). Field names match the prior-year
# Schedule R map. Captions below are this draft's AcroForm tooltips.
# When the final 2026 Schedule R is released (#124), re-download it, re-hash it and re-verify every field
# name and line number here before swapping it in.
# Page 1 of the file is the "Caution: DRAFT—NOT FOR FILING" cover sheet; skipLeadingPages drops it after filling.
# The draft is two form pages (Part I and Part II, then Part III). Attachment Sequence No. 16.
# No 2026 Spanish Schedule R draft is posted. irs.gov/pub/irs-dft/f1040srsp--dft.pdf and f1040srs.pdf are 404.
# f1040srs--dft.pdf is the 2026 Spanish Form 1040-SR, not Schedule R. Spanish returns print this English form.
# There is no es entry, and none pointing at the 2024 template.
#
# Included when /isReceivingEdc (a positive credit). 26 U.S.C. 22(a): "an amount equal to 15 percent of such
# individual's section 22 amount". Line 22 of this draft: "Credit for the elderly or the disabled. Enter the
# smaller of line 20 or line 21. Also enter this amount on Schedule 3 (Form 1040), line 6d." That amount is
# /totalEdc, the same fact as Schedule 3 line 6d.
# Initial amounts and the AGI / nontaxable ceilings are IRC §22(c)(2) and §22(d). Instructions for Schedule R
# (2026) draft, https://www.irs.gov/pub/irs-dft/i1040sr--dft.pdf, SHA-256
# 6f30613aacd956f145fea666527ad68bea5d5f8a87072270f9a17e14f41ae661, PDF p. 7, Table 1. Income Limits.
#
# Not a separate fill-in: Part II is the physician's statement checkbox only. The statement itself is kept for
# the filer's records (2026 draft instructions, Part II); it is not a field on this form. $0 amounts print blank
# (FactGraphService zero suppression) except line 13c, which says "enter -0-" and whose fact has <ExportZero />.
includeWhen: /isReceivingEdc
