# CreationDate 2026-10-29 09:14:51-05:00, published Oct 29 2026 ET, 2 PDF pages, 90,881 bytes), committed
# byte-identical to irs.gov; SHA-256 945275e6be3cc7353a3faf165ddd7ccb79e3c8a43abe6678d4c47f8207594cb5 (pinned in
# ../../final-pdf-sha256.txt and rechecked by FinalPdfHashManifestTest).
# 32 AcroForm fields, the same names as the 2026 early-release draft (#275). The final has no cover page and no
# /TU tooltips; line captions below were checked against the face text. The face still reads "Created 4/21/26".
# Attachment Sequence No. 16.
# No 2026 Spanish Schedule R is posted. irs.gov/pub/irs-pdf/f1040srs.pdf is Form 1040-SR (Spanish), not Schedule R.
# Spanish returns print this English form. There is no es entry, and none pointing at the 2024 template.
#
# Included when /isReceivingEdc (a positive credit). 26 U.S.C. 22(a): "an amount equal to 15 percent of such
# individual's section 22 amount". Line 22: "Credit for the elderly or the disabled. Enter the smaller of line 20
# or line 21. Also enter this amount on Schedule 3 (Form 1040), line 6d." That amount is /totalEdc, the same fact
# as Schedule 3 line 6d.
# Initial amounts and the AGI / nontaxable ceilings are IRC §22(c)(2) and §22(d). Instructions for Schedule R
# (2026) draft, https://www.irs.gov/pub/irs-dft/i1040sr--dft.pdf, SHA-256
# 6f30613aacd956f145fea666527ad68bea5d5f8a87072270f9a17e14f41ae661, PDF p. 7, Table 1. Income Limits.
#
# Not a separate fill-in: Part II is the physician's statement checkbox only. The statement itself is kept for
# the filer's records (2026 draft instructions, Part II); it is not a field on this form. $0 amounts print blank
# (FactGraphService zero suppression) except line 13c, which says "enter -0-" and whose fact has <ExportZero />.
includeWhen: /isReceivingEdc
