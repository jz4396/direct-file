headings:
  /heading/your-taxes/amount/ma-residency: Which of these describes your Massachusetts return?
  /heading/your-taxes/amount/ma-use-tax: Do you owe Massachusetts use tax?
  /heading/your-taxes/amount/ma-rent: How much qualified rent did you pay in Massachusetts?
  /heading/your-taxes/amount/ma-optional-rate: Do you want to pay Massachusetts tax at 5.85%?
  /heading/your-taxes/amount/ma-mcc: Did you have minimum creditable coverage for all 12 months?
  /heading/your-taxes/amount/ma-spouse-mcc: Did your spouse have minimum creditable coverage for all 12 months?
  /heading/your-taxes/amount/ma-retirement: Does any W-2 box 14 include a Massachusetts retirement contribution?
  /heading/your-taxes/amount/ma-insurer: What is the name of your health insurer?
  /heading/your-taxes/amount/ma-subscriber: What is your subscriber or member number?
  /heading/your-taxes/amount/ma-spouse-insurer: What is the name of your spouse's health insurer?
  /heading/your-taxes/amount/ma-spouse-subscriber: What is your spouse's subscriber or member number?
