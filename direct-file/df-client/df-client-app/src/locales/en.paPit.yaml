info:
  /info/your-taxes/amount/pa-exempt-obligation-dividends:
    body:
      Pennsylvania doesn’t tax dividends that a mutual fund or money market fund pays from direct obligations of the
      U.S. government (Treasury bonds, notes, bills, and savings bonds), Pennsylvania, or Pennsylvania local
      governments. Your fund’s year-end statement shows this. Answer yes if any part of your dividends is from these.
  /info/knockout/pa-dividends:
    alertText:
      body:
        - p:
            Your Pennsylvania dividends need an adjustment on PA Schedule B, such as dividends from U.S. or Pennsylvania
            obligations or dividends received while you lived outside Pennsylvania. This tool doesn’t figure those yet.
        - p: You can still file your federal return here.
        - p: <Link1>Find other ways to file your Pennsylvania return.</Link1>
      urls:
        Link1: https://www.pa.gov/agencies/revenue/forms-and-publications/pa-personal-income-tax-guide.html
  /info/your-taxes/amount/pa-unreimbursed-employee-expenses:
    body:
      These are costs you paid to do your job that your employer didn’t pay you back for, claimed on PA Schedule UE.
      Pennsylvania allows only expenses required to do your job. Answer no if your employer reimbursed you exactly or
      gave you an allowance it didn’t include in your wages.
  /info/knockout/pa-unreimbursed-employee-expenses:
    alertText:
      body:
        - p: You can still file your federal return here.
        - p: <Link1>Find other ways to file your Pennsylvania return.</Link1>
      urls:
        Link1: https://www.pa.gov/agencies/revenue/forms-and-publications/pa-personal-income-tax-guide.html
  /info/your-taxes/amount/pa-unsupported-items:
    body:
      - p:
          "Medical savings account, health savings account, 529 or ABLE contributions, or student loan interest you want
          to deduct; income from an estate or trust; gambling or lottery winnings; Pennsylvania estimated or extension
          payments, or a refund from last year applied to this year; credit for tax paid to another state; other
          Pennsylvania credits (Schedules OC or DC); or use tax you owe."
      - p: This tool doesn’t figure local earned income tax. File that with your local tax collector.
  /info/knockout/pa-unsupported-items:
    alertText:
      body:
        - p: You can still file your federal return here.
        - p: <Link1>Find other ways to file your Pennsylvania return.</Link1>
      urls:
        Link1: https://www.pa.gov/agencies/revenue/forms-and-publications/pa-personal-income-tax-guide.html
  /info/knockout/pa-unsupported-income:
    alertText:
      body:
        - p:
            This includes business or rental income, retirement distributions, Form 1099-MISC income, tax-exempt
            interest, a Form W-2 without Pennsylvania wages in box 16, or sales of property on a joint return.
        - p: <Link1>Find other ways to file your Pennsylvania return.</Link1>
      urls:
        Link1: https://www.pa.gov/agencies/revenue/forms-and-publications/pa-personal-income-tax-guide.html
  /info/your-taxes/amount/pa-sp-nontaxable-income:
    body:
      This includes alimony, life insurance proceeds or inheritances, gifts, awards or prizes, nontaxable military pay,
      gain you excluded on the sale of your home, nontaxable scholarships or grants, cash or support from people outside
      your household, nontaxable sickness, disability or strike benefits from a cafeteria plan, foster care payments,
      and unemployment compensation. Don’t include Social Security or eligible retirement benefits.
  /info/knockout/pa-sp-unsupported:
    alertText:
      body:
        - p:
            You may qualify for Tax Forgiveness (Schedule SP), but this tool can’t figure it if you’re separated or
            filing separately, someone can claim you as a dependent, you have more than 9 dependent children, you
            received unemployment compensation, you had a net loss from sales while you lived outside Pennsylvania, or
            you have other nontaxable income that counts toward eligibility.
        - p: <Link1>Find other ways to file your Pennsylvania return.</Link1>
      urls:
        Link1: https://www.pa.gov/agencies/revenue/forms-and-publications/pa-personal-income-tax-guide.html
  /info/you-and-your-family/about-you/pa-part-year-move:
    body:
      - p:
          If you moved between Pennsylvania and Florida, you can file a Pennsylvania part-year resident return here.
          Pennsylvania taxes all of your income from the time you lived there, plus income from Pennsylvania sources
          (such as pay for work in Pennsylvania) from the rest of the year.
      - p: Florida doesn’t have a state income tax, so there’s no Florida return to file.
  /info/you-and-your-family/about-you/pa-part-year-move-date:
    body:
      - p:
          Enter the date you started living in Florida (if you moved out of Pennsylvania) or in Pennsylvania (if you
          moved in). The move must be after January 1 and in {{/taxYear}}.
  /info/income/jobs/w2-pa-part-year-resident-wages:
    body:
      - p:
          This W-2 doesn’t list Pennsylvania wages. Enter the part of your pay that you earned while you lived in
          Pennsylvania. Pennsylvania taxes this pay even though it was from a Florida employer.
      - p:
          Pennsylvania doesn’t let you subtract retirement plan contributions (like 401(k) contributions) from your pay,
          so include those amounts. Enter 0 if you earned all of this pay while you lived in Florida.
  /info/your-taxes/amount/pa-part-year-interest:
    body:
      - p:
          Pennsylvania taxes interest you received while you lived there. It doesn’t tax interest you received while you
          lived in Florida. Don’t include interest from U.S. savings bonds or Treasury obligations.
  /info/knockout/pa-part-year:
    alertText:
      body:
        - p:
            "This includes: a joint return, a move date that isn’t after January 1 and in {{/taxYear}}, a W-2 from a
            state other than Pennsylvania or Florida, or a Florida W-2 with state income tax withheld in box 17."
        - p: You can still file your federal return here.
        - p: <Link1>Find other ways to file your Pennsylvania return.</Link1>
      urls:
        Link1: https://www.pa.gov/agencies/revenue/forms-and-publications/pa-personal-income-tax-guide.html
  /info/your-taxes/amount/pa-school-district:
    body:
      - p:
          Pennsylvania asks for the 5-digit code of the school district where you lived on December 31, even if you
          moved after that date. Use the district for your home address, which may not match your mailing address.
      - p: <Link1>Find your school district code in the PA-40 instructions (pages 46 and 47).</Link1>
    urls:
      Link1: https://www.pa.gov/content/dam/copapwp-pagov/en/revenue/documents/formsandpublications/formsforindividuals/pit/documents/2025/2025_pa-40in.pdf
  /info/knockout/pa-schedule-a:
    alertText:
      body:
        - p:
            "Your Pennsylvania return needs PA Schedule A, and this tool can’t fill it out yet. This includes interest
            from U.S. savings bonds or Treasury obligations, tax-exempt interest, interest when you lived in
            Pennsylvania for only part of the year, or more than $2,500 of interest."
        - p: You can still file your federal return here.
        - p: <Link1>Find other ways to file your Pennsylvania return.</Link1>
      urls:
        Link1: https://www.pa.gov/agencies/revenue/forms-and-publications/pa-personal-income-tax-guide.html
  /info/knockout/pa-schedule-b:
    alertText:
      body:
        - p:
            Your Pennsylvania return needs PA Schedule B, and this tool can’t fill it out yet. This includes more than
            $2,500 of dividends, or dividends when you lived in Pennsylvania for only part of the year.
        - p: You can still file your federal return here.
        - p: <Link1>Find other ways to file your Pennsylvania return.</Link1>
      urls:
        Link1: https://www.pa.gov/agencies/revenue/forms-and-publications/pa-personal-income-tax-guide.html
  /info/knockout/pa-schedule-d:
    alertText:
      body:
        - p:
            Your Pennsylvania return needs PA Schedule D for any sale of stocks, bonds or other property, even one with
            a loss, and this tool can’t fill it out yet.
        - p: You can still file your federal return here.
        - p: <Link1>Find other ways to file your Pennsylvania return.</Link1>
      urls:
        Link1: https://www.pa.gov/agencies/revenue/forms-and-publications/pa-personal-income-tax-guide.html
