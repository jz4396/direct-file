info:
  /info/your-taxes/amount/schedule-3a-line-7:
    body:
      - p:
          Schedule 3-A (Form 1040), line 7. If you say no, the amount on line 6 is entered on Form 1040, line 32b, and
          line 8 is left blank.
  /info/your-taxes/amount/schedule-3a-line-8:
    body:
      - p:
          Schedule 3-A (Form 1040), Part II, line 8. "Qualified alien" is defined in 8 U.S.C. 1641(b). If you say yes,
          line 8 and Form 1040, line 32b, are -0-. If you say no, the amount on line 6 is entered on line 8 and on Form
          1040, line 32b.
