# Schedule 1-A Part II, No Tax on Tips (#51). Overlay merged by locales/featureLocales.ts.
subsubcategories:
  /flow/credits-and-deductions/deductions:
    tips-deduction: "Deduction for tips"
headings:
  /heading/credits-and-deductions/deductions/tips-self-employed: "Did you receive tips in your own business?"
  /heading/credits-and-deductions/deductions/tips-occupation: "Did you receive your tips in an occupation that customarily received tips?"
  /heading/credits-and-deductions/deductions/tips-sstb: "Is your employer in a specified service trade or business?"
  /heading/knockout/tips-self-employed: "This tool doesn’t yet support the tips deduction for self-employed people"
  /heading/knockout/tips-sstb: "This tool doesn’t yet support tips from a specified service trade or business"
  /heading/credits-and-deductions/deductions/overtime-1099: "Was any of this overtime paid to you as an independent contractor and reported on Form 1099-NEC or 1099-MISC?"
  /heading/credits-and-deductions/deductions/overtime-special-rule: "Does your employer use a special FLSA overtime rule instead of the usual 40-hour workweek?"
  /heading/credits-and-deductions/deductions/overtime-method: "What do your pay records show about your overtime?"
  /heading/credits-and-deductions/deductions/overtime-amount: "Enter the overtime amount from your records"
info:
  /info/credits-and-deductions/deductions/tips-self-employed:
    body: "For example, tips a self-employed hair stylist or rideshare driver received from customers."
  /info/credits-and-deductions/deductions/tips-occupation:
    body: "Only tips received in an occupation on the Treasury list of occupations that customarily and regularly received tips on or before December 31, 2024, qualify. Your Form W-2, box 14b, shows the Treasury Tipped Occupation Code. Only voluntary tips count: service charges, automatic gratuities, and other mandatory amounts added to a bill don’t qualify unless the customer could freely remove or change them (Form 1040 instructions, Schedule 1-A, Part II)."
  /info/credits-and-deductions/deductions/tips-sstb:
    body: "Specified service fields include health, law, accounting, performing arts, consulting, athletics, financial services and brokerage services."
  /info/knockout/tips-self-employed:
    alertText:
      body:
        - p: <Link1>Find other ways to file your federal taxes.</Link1>
      urls:
        Link1: https://www.irs.gov/filing/individuals/how-to-file
  /info/knockout/tips-sstb:
    alertText:
      body:
        - p: <Link1>Find other ways to file your federal taxes.</Link1>
      urls:
        Link1: https://www.irs.gov/filing/individuals/how-to-file
  /info/credits-and-deductions/deductions/overtime-1099:
    body: "Answer yes if a business you worked for (not your employer) reported the overtime on Form 1099-NEC or 1099-MISC."
  /info/credits-and-deductions/deductions/overtime-special-rule:
    body: "For example, public-sector fire protection or law enforcement work periods, or getting compensatory time off instead of cash overtime."
  /info/credits-and-deductions/deductions/overtime-method:
    body: "Use your employer’s statement, your pay stubs, or payroll records. Only overtime from your job as an employee counts here. Keep the records you use."
  /info/credits-and-deductions/deductions/overtime-amount:
    body: "Enter the amount for the choice you picked. We’ll figure the deductible part: all of an FLSA overtime premium, 1/3 of total time-and-a-half pay, 1/2 of a double-time premium, 1/4 of total double-time pay, or 1/2 of your regular pay for hours over 40."
