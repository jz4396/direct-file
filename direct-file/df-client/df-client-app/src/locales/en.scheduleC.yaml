info:
  /info/income/schedule-c/intro:
    body: >-
      This includes income from a sole proprietorship, gig work, or freelance work reported on Schedule C. It also
      includes farm income, church employee income, notary fees, and income from the ministry. Answer yes if any of
      those apply. Answer no only if none of them apply.
  /info/income/schedule-c/qbi-carryforward:
    body: >-
      We use your business income to figure the qualified business income deduction (Form 8995). Answer yes if your
      prior-year Form 8995 or 8995-A showed a qualified business loss carryforward or a qualified REIT dividend and
      publicly traded partnership loss carryforward.
  /info/income/schedule-c/qbi-cooperative:
    body: >-
      Answer yes if you sell products to, or buy supplies through, a farm or garden cooperative and get patronage
      dividends or other qualified payments from it.
  /info/income/schedule-c/material-participation:
    body: >-
      You materially participate if you work in the business on a regular, continuous, and substantial basis. For
      example, you worked more than 500 hours in it this year, or you did almost all the work in it.
  /info/income/schedule-c/loop-intro:
    body: Add one entry for each business or gig activity. We’ll calculate net profit and self-employment tax.
  /info/income/schedule-c/amounts:
    body: >-
      Gross receipts are your total business income before expenses. Expenses are ordinary and necessary costs
      of running the business (Internal Revenue Code section 162).
  /info/income/schedule-c/farm:
    body: >-
      Schedule SE lines 1a and 1b are farm profit and Conservation Reserve Program payments. Answer yes if either
      applies. This tool cannot figure those lines.
  /info/income/schedule-c/church-employee:
    body: >-
      Church employee income goes on Schedule SE lines 5a and 5b. It is figured separately from other
      self-employment income. Answer yes if you have it.
  /info/income/schedule-c/optional-method:
    body: >-
      The optional methods are Schedule SE line 4b and Part II. Answer yes if you want to use a farm or nonfarm
      optional method. This tool figures only the regular method.
  /info/income/schedule-c/minister:
    body: >-
      Answer yes if you are a minister, a member of a religious order, or a Christian Science practitioner, or if
      you have an approved Form 4361 or Form 4029 exemption. Housing and the exemption are not figured here.
  /info/income/schedule-c/notary:
    body: >-
      Notary fees for a public office are excluded from self-employment tax. Answer yes if you need that exclusion.
      This tool cannot subtract those fees.
  /info/income/schedule-c/form-8919:
    body: >-
      Form 8919 wages go on Schedule SE line 8c. Answer yes if you have them. Unreported tips on Form 4137 are a
      separate stop.
  /info/knockout/schedule-se-out-of-scope:
    alertText:
      body:
        - p: >-
            This return needs a Schedule SE line this tool does not figure. That includes farm income, Conservation
            Reserve Program payments, church employee income, an optional method, ministry or a Form 4361 or Form 4029
            exemption, notary fees, or Form 8919 wages. You will need another way to file this return.
  /info/knockout/schedule-c-qbi:
    alertText:
      body:
        - p: >-
            This tool figures the qualified business income deduction only with the simplified Form 8995. It can’t
            handle a prior-year loss carryforward, cooperative payments, taxable income above the Form 8995 limit, or
            some businesses you materially participate in and some you don’t. You’ll need another way to file this
            return.
  /info/income/schedule-c/part-i:
    body: "Gross receipts are line 1. Returns and allowances are line 2, entered as a positive amount. Other income is line 6 (for example, scrap sales). Leave a line at zero if it does not apply."
  /info/income/schedule-c/other-income-form:
    body: "Answer yes if this amount is a fuel tax credit or a Form 4797 recapture. This tool cannot figure those."
  /info/income/schedule-c/inventory:
    body: "Answer yes if you need Part III, cost of goods sold. This tool cannot figure inventory."
  /info/income/schedule-c/vehicle:
    body: "Answer yes for car and truck expenses (line 9) or vehicle loan interest (line 16b). Those need Form 4562 or Part IV."
  /info/income/schedule-c/depreciation:
    body: "Answer yes if line 13 applies. Depreciation and the section 179 deduction need Form 4562."
  /info/income/schedule-c/depletion:
    body: "Answer yes if you claim depletion on line 12."
  /info/income/schedule-c/equipment-rent:
    body: "Answer yes for rent of vehicles, machinery, and equipment (line 20a)."
  /info/income/schedule-c/home-office:
    body: "Answer yes if you claim expenses for business use of your home on line 30, including the simplified method. That needs Form 8829 or the simplified worksheet."
  /info/income/schedule-c/energy:
    body: "Answer yes if you claim the line 27a deduction. It needs Form 7205."
  /info/income/schedule-c/has-expenses:
    body: "These are ordinary and necessary costs of carrying on the business (Internal Revenue Code section 162). Do not include the items asked about above."
  /info/income/schedule-c/which-expenses:
    body: "Select every line that applies. Meals are cut to 50 percent on the next screen unless a different limit applies."
  /info/income/schedule-c/expense-amounts:
    body: "Enter the amount for each line you selected. For meals, enter the full amount before the 50 percent limit."
  /info/income/schedule-c/meals-limit:
    body: "In most cases you can deduct 50 percent of business meals. Answer no if the 80 percent transportation-worker exception or a 100 percent meal applies."
  /info/income/schedule-c/wage-credits:
    body: "Line 26 is wages minus employment credits. Answer yes if you reduce wages by Form 5884, 8932, or 8994."
  /info/income/schedule-c/interest-allocation:
    body: "Answer yes if mortgage interest (line 16a) or other interest (line 16c) is partly personal or otherwise has to be allocated. Vehicle loan interest is line 16b and was asked earlier."
  /info/income/schedule-c/amortization:
    body: "Answer yes if any other expense is amortization that begins in 2026. That is reported on Form 4562-B."
  /info/income/schedule-c/part-v:
    body: "List each other expense and its amount. The total is line 48 and line 27b."
  /info/income/schedule-c/part-v-more:
    body: "This tool can list three other expenses. Answer yes if you have a fourth. The form allows more, and you will need another way to file."
  /info/income/schedule-c/at-risk:
    body: "Answer this only because this business has a loss. If all of your investment was at risk and you materially participated, the loss can be reported. If some was not at risk, Form 6198 is required."
  /info/knockout/schedule-c-out-of-scope:
    alertText:
      body:
        - p: "This business needs a form or a loss limit this tool does not figure. That includes inventory, vehicle expenses, depreciation, depletion, equipment rent, a home office, Form 7205, meals that are not limited to 50 percent, employment credits, interest that must be allocated, new amortization, more than three other expenses, line 6 income from another form, a loss you did not materially participate in, or a loss that is not fully at risk. You will need another way to file this return."
