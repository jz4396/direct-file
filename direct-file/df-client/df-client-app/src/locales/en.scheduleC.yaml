info:
  /info/income/schedule-c/intro:
    body: >-
      This includes income from a sole proprietorship, gig work, or freelance work reported on Schedule C. It also
      includes farm income, church employee income, notary fees, and income from the ministry. Answer yes if any of
      those apply. Answer no only if none of them apply.
  /info/income/schedule-c/qbi-carryforward:
    body: >-
      We use your business income to figure the qualified business income deduction (Form 8995). Answer yes if your
      prior-year Form 8995 or 8995-A showed a qualified business loss carryforward or a qualified REIT dividend and
      publicly traded partnership loss carryforward.
  /info/income/schedule-c/qbi-cooperative:
    body: >-
      Answer yes if you sell products to, or buy supplies through, a farm or garden cooperative and get patronage
      dividends or other qualified payments from it.
  /info/income/schedule-c/material-participation:
    body: >-
      You materially participate if you work in the business on a regular, continuous, and substantial basis. For
      example, you worked more than 500 hours in it this year, or you did almost all the work in it.
  /info/income/schedule-c/loop-intro:
    body: Add one entry for each business or gig activity. We’ll calculate net profit and self-employment tax.
  /info/income/schedule-c/amounts:
    body: >-
      Gross receipts are your total business income before expenses. Expenses are ordinary and necessary costs of
      running the business (Internal Revenue Code section 162).
  /info/income/schedule-c/farm:
    body: >-
      Schedule SE lines 1a and 1b are farm profit and Conservation Reserve Program payments. Part II line 15 is the farm
      optional method. Answer yes if any of those apply. This tool cannot figure those lines.
  /info/income/schedule-c/church-employee:
    body: >-
      Church employee income goes on Schedule SE lines 5a and 5b. It is figured separately from other self-employment
      income. Answer yes if you have it.
  /info/income/schedule-c/optional-method:
    body: >-
      The nonfarm optional method is Schedule SE line 4b and Part II lines 16 and 17. You may use it only when your net
      nonfarm profits are less than $8,186 and less than 72.189% of your gross nonfarm income, your net earnings from
      self-employment were at least $400 in 2 of the prior 3 years, and you have used this method fewer than 5 earlier
      years. The amount cannot be less than your actual net earnings or more than $7,560. Answer yes if you want to use
      it. The farm optional method is a separate question.
  /info/income/schedule-c/nonfarm-prior-years:
    body: >-
      The nonfarm optional method requires actual net earnings of $400 or more in 2 of the 3 years immediately before
      this year. Answer no if that is not true.
  /info/income/schedule-c/nonfarm-prior-uses:
    body: >-
      You may use the nonfarm optional method no more than five times. The years do not have to be consecutive. Answer
      yes if you have used it fewer than five earlier years. Answer no if this year would be the sixth or later use.
  /info/income/schedule-c/minister:
    body: >-
      Answer yes if you are a minister, a member of a religious order, or a Christian Science practitioner, or if you
      have an approved Form 4361 or Form 4029 exemption. Housing and the exemption are not figured here.
  /info/income/schedule-c/notary:
    body: >-
      Notary fees for a public office are excluded from self-employment tax. Answer yes if you need that exclusion. This
      tool cannot subtract those fees.
  /info/income/schedule-c/form-8919:
    body: >-
      Form 8919 wages go on Schedule SE line 8c. Answer yes if you have them. Unreported tips on Form 4137 are a
      separate stop.
  /info/knockout/schedule-se-out-of-scope:
    alertText:
      body:
        - p: >-
            This return needs a Schedule SE line this tool does not figure. That includes farm income, Conservation
            Reserve Program payments, the farm optional method, church employee income, ministry or a Form 4361 or Form
            4029 exemption, notary fees, or Form 8919 wages. You will need another way to file this return.
  /info/knockout/schedule-se-nonfarm-optional-method:
    alertText:
      body:
        - p: >-
            The nonfarm optional method cannot be used on this return. That can be because the dollar tests are not met,
            the amount on line 17 would be less than your actual net earnings, net earnings were not at least $400 in 2
            of the prior 3 years, this would be the sixth or later use, Schedule K-1 (Form 1065) box 14 code A is more
            than zero, or you are claiming the earned income credit or the additional child tax credit. Line 4b is not
            included in earned income for those credits. You will need another way to file this return.
  /info/knockout/schedule-c-qbi:
    alertText:
      body:
        - p: >-
            This tool figures the qualified business income deduction only with the simplified Form 8995. It can’t
            handle a prior-year loss carryforward, cooperative payments, taxable income above the Form 8995 limit, or
            some businesses you materially participate in and some you don’t. You’ll need another way to file this
            return.
  /info/income/schedule-c/part-i:
    body:
      "Gross receipts are line 1. Returns and allowances are line 2, entered as a positive amount. Other income is line
      6 (for example, scrap sales). Leave a line at zero if it does not apply."
  /info/income/schedule-c/other-income-form:
    body: "Answer yes if this amount is a fuel tax credit or a Form 4797 recapture. This tool cannot figure those."
  /info/income/schedule-c/inventory:
    body:
      "Answer yes if you need Schedule C line 4 and Part III. Cost and lower of cost or market can be figured here.
      Any other method cannot."
  /info/income/schedule-c/inventory-method:
    body:
      "Line 33a is cost. Line 33b is lower of cost or market. Line 33c, any other method, cannot be figured here.
      Choose nonincidental materials and supplies only if you do not keep an inventory. That method does not use
      Part III."
  /info/income/schedule-c/inventory-change:
    body:
      "Line 34 asks whether quantities, costs, or valuations changed between opening and closing inventory. Answer
      yes if they changed. This tool cannot figure that change."
  /info/income/schedule-c/small-business:
    body:
      "You qualify as a small business taxpayer if your average annual gross receipts for the 3 prior tax years are
      $32 million or less and you are not a tax shelter. Enter that average. Include a predecessor business, and
      annualize a short year, before you enter it. Use 0 if the business did not exist in those years. This year's
      receipts are not the average. Answer yes if you are a tax shelter. If the average is over $32,000,000, or you
      are a tax shelter, this tool cannot figure Part III."
  /info/income/schedule-c/line-35:
    body:
      "Line 35 is inventory at the beginning of the year. If it is different from last year's closing inventory, the
      form says to attach an explanation. This tool cannot file that explanation. Answer yes if the amounts differ.
      Answer no if line 35 is the same as last year's closing inventory, including zero when the business is new."
  /info/income/schedule-c/inventory-amounts:
    body:
      "Line 35 is inventory at the beginning of the year. Line 36 is purchases minus items withdrawn for personal use.
      Line 37 is labor, not including amounts paid to yourself. Line 38 is materials and supplies. Line 39 is other
      costs. Line 41 is inventory at the end of the year. Line 42, which is also line 4, is line 35 plus line 36 plus
      lines 37 through 39, minus line 41. If that result is below zero, this tool cannot complete the return."
  /info/income/schedule-c/vehicle:
    body:
      "Answer yes for car and truck expenses (line 9) or vehicle loan interest (line 16b). Those need Form 4562 or Part
      IV."
  /info/income/schedule-c/depreciation:
    body: "Answer yes if line 13 applies. Depreciation and the section 179 deduction need Form 4562."
  /info/income/schedule-c/depletion:
    body: "Answer yes if you claim depletion on line 12."
  /info/income/schedule-c/equipment-rent:
    body: "Answer yes for rent of vehicles, machinery, and equipment (line 20a)."
  /info/income/schedule-c/home-office:
    body:
      "Answer yes if you claim expenses for business use of your home on line 30, including the simplified method. That
      needs Form 8829 or the simplified worksheet."
  /info/income/schedule-c/energy:
    body: "Answer yes if you claim the line 27a deduction. It needs Form 7205."
  /info/income/schedule-c/has-expenses:
    body:
      "These are ordinary and necessary costs of carrying on the business (Internal Revenue Code section 162). Do not
      include the items asked about above."
  /info/income/schedule-c/which-expenses:
    body:
      "Select every line that applies. Meals are cut to 50 percent on the next screen unless a different limit applies."
  /info/income/schedule-c/expense-amounts:
    body: "Enter the amount for each line you selected. For meals, enter the full amount before the 50 percent limit."
  /info/income/schedule-c/meals-limit:
    body:
      "In most cases you can deduct 50 percent of business meals. Answer no if the 80 percent transportation-worker
      exception or a 100 percent meal applies."
  /info/income/schedule-c/wage-credits:
    body: "Line 26 is wages minus employment credits. Answer yes if you reduce wages by Form 5884, 8932, or 8994."
  /info/income/schedule-c/interest-allocation:
    body:
      "Answer yes if mortgage interest (line 16a) or other interest (line 16c) is partly personal or otherwise has to be
      allocated. Vehicle loan interest is line 16b and was asked earlier."
  /info/income/schedule-c/amortization:
    body: "Answer yes if any other expense is amortization that begins in 2026. That is reported on Form 4562-B."
  /info/income/schedule-c/part-v:
    body: "List each other expense and its amount. The total is line 48 and line 27b."
  /info/income/schedule-c/part-v-more:
    body:
      "This tool can list three other expenses. Answer yes if you have a fourth. The form allows more, and you will need
      another way to file."
  /info/income/schedule-c/at-risk:
    body:
      "Answer this only because this business has a loss. If all of your investment was at risk and you materially
      participated, the loss can be reported. If some was not at risk, Form 6198 is required."
  /info/knockout/schedule-c-out-of-scope:
    alertText:
      body:
        - p:
            "This business needs a form or a loss limit this tool does not figure. That includes an inventory method
            other than cost or lower of cost or market, a change in how inventory was valued, average annual gross
            receipts for the 3 prior tax years over $32,000,000, a tax shelter, cost of goods sold below zero,
            beginning inventory different from last year's closing inventory, a claim that you do not keep
            inventory while Part III is still filled in, vehicle expenses,
            depreciation, depletion, equipment rent, a home office, Form 7205, meals that are not limited to 50
            percent, employment credits, interest that must be allocated, new amortization, more than three other
            expenses, line 6 income from another form, a loss you did not materially participate in, or a loss that is
            not fully at risk. You will need another way to file this return."
