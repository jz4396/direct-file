  /heading/income/schedule-e/estate-other: Does this Schedule K-1 report anything besides boxes 5, 6, 7, and 8?
  /heading/income/schedule-e/estate-limits: Do any loss limits apply to this estate or trust?
  /heading/income/schedule-e/part-iv: Do you have a residual interest in a REMIC (Schedule Q, Form 1066)?
  /heading/income/schedule-e/k1-intro: Add each partnership and S corporation
  /heading/income/schedule-e/k1-name: What is the name of the partnership or S corporation?
  /heading/income/schedule-e/k1-scope:
    Is this a foreign partnership, a publicly traded partnership, or a trading business?
  /heading/income/schedule-e/k1-box1: Enter ordinary business income and whether you materially participated
  /heading/income/schedule-e/k1-box14: Enter self-employment earnings from Schedule K-1 (Form 1065), box 14, code A
