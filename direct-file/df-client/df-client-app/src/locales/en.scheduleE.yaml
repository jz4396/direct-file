  /heading/knockout/schedule-e-substantial-services:
    This tool doesn’t yet support rentals where you provide substantial services
  /heading/income/schedule-e/part-ii-line-27:
    Are you reporting a prior-year unallowed loss or unreimbursed partnership expenses?
  /heading/income/schedule-e/part-iii: Did you receive a Schedule K-1 from an estate or trust?
  /heading/income/schedule-e/estate-intro: Add each estate or trust
  /heading/income/schedule-e/estate-name: What is the name of the estate or trust?
  /heading/income/schedule-e/estate-scope: Is this a foreign beneficiary, a foreign trust, or an inconsistent treatment?
  /heading/income/schedule-e/estate-interest-dividends: Enter interest and dividends from Schedule K-1 (Form 1041)
  /heading/income/schedule-e/estate-capital-gains: Enter capital gain or loss from Schedule K-1 (Form 1041)
  /heading/income/schedule-e/estate-boxes: Enter the income from Schedule K-1 (Form 1041)
  /heading/income/schedule-e/estate-box12: Enter Schedule K-1 (Form 1041) box 12, code A
  /heading/income/schedule-e/estate-other: Does this Schedule K-1 report anything besides boxes 1, 2a, 2b, 3, 4a, 5, 6, 7, 8, and box 12 codes A through J?
  /heading/income/schedule-e/estate-limits: Do any loss limits apply to this estate or trust?
  /heading/income/schedule-e/part-iv: Do you have a residual interest in a REMIC (Schedule Q, Form 1066)?
  /heading/income/schedule-e/k1-intro: Add each partnership and S corporation
  /heading/income/schedule-e/k1-name: What is the name of the partnership or S corporation?
  /heading/income/schedule-e/k1-scope:
    Is this a foreign partnership, a publicly traded partnership, or a trading business?
  /heading/income/schedule-e/k1-box1: Enter ordinary business income and whether you materially participated
  /heading/income/schedule-e/k1-box14: Enter self-employment earnings from Schedule K-1 (Form 1065), box 14, code A
  /heading/income/schedule-e/k1-box14-scope: Is this the amount that belongs on Schedule SE?
  /heading/income/schedule-e/k1-portfolio-partnership: Enter interest and dividends from Schedule K-1 (Form 1065)
  /heading/income/schedule-e/k1-portfolio-s-corp: Enter interest and dividends from Schedule K-1 (Form 1120-S)
  /heading/income/schedule-e/k1-other: Does this Schedule K-1 report anything else?
  /heading/income/schedule-e/k1-columns: Do you have to check column (e) or column (f) on Schedule E line 28?
