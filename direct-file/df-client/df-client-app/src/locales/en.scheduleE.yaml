    This tool doesn’t support a safe harbor statement, an aggregation, or a suspended loss for this rental
  /heading/knockout/schedule-e-qbi-limit: This tool can’t figure this qualified business income deduction
  /heading/knockout/schedule-e-eitc:
    This tool can’t yet check the Earned Income Tax Credit with rental or royalty income
info:
  /info/income/schedule-e/intro:
    body: >-
      This includes rent from a house, apartment, room, or other real estate you rented out, and royalties from oil,
      gas, or mineral properties, copyrights, or patents. It’s reported on Schedule E.
  /info/income/schedule-e/part-ii:
    body: >-
      Answer yes if you were a partner, an S corporation shareholder, or a beneficiary of an estate or trust, even if
      you had no rental or royalty income and even if you did not actually receive the money. A partnership or S
      corporation can be reported when you materially participated. Interest and ordinary and qualified dividends from
      that Schedule K-1 can be reported on Form 1040. Previously taxed earnings and profits stop this return. Other
      Schedule K-1 situations stop this return. A residual interest in a REMIC is a separate question. Do not answer yes
      here only because you received Schedule Q (Form 1066).
  /info/income/schedule-e/part-ii-line-27:
    body: >-
      Answer yes if you are reporting a loss that was not allowed in a prior year because of the at-risk or basis
      limits, a prior-year unallowed passive loss, or unreimbursed partnership expenses.
  /info/income/schedule-e/part-iii:
    body: >-
      Answer yes if you are a beneficiary of an estate or trust, even if you did not receive the income. You should have
      a Schedule K-1 (Form 1041). Interest and dividends from boxes 1, 2a, and 2b can be reported. Ordinary business
      income can be reported when you materially participated. Other portfolio and nonbusiness income in box 5 can be
      reported when it is not a loss. Other rental income stops this return.
  /info/income/schedule-e/estate-intro:
    body: >-
      Add one entry for each estate or trust. Use the name and the amounts from Schedule K-1 (Form 1041). If you have
      only an estate or trust, you can finish the partnership list without adding one.
  /info/income/schedule-e/estate-name:
    body: This is line 33, column (a), of Schedule E.
  /info/income/schedule-e/estate-scope:
    body: >-
      Answer yes to foreign beneficiary if Schedule K-1 (Form 1041) item H says foreign beneficiary. Answer yes if the
      trust is a foreign trust, or if you are treating an item differently from the estate or trust.
  /info/income/schedule-e/estate-capital-gains:
    body: >-
      Box 3 is net short-term capital gain or loss. It goes on Schedule D, line 5. Box 4a is net long-term capital
      gain or loss. It goes on Schedule D, line 12. Enter a loss as a negative amount. Enter 0 if a box is blank.
      Box 4b (28% rate gain) and box 4c (unrecaptured section 1250 gain) are not these boxes. Answer yes on the later
      screen if box 4b, box 4c, or box 11 code C or D has an amount.
  /info/income/schedule-e/estate-interest-dividends:
    body: >-
      Enter box 1 (interest), box 2a (ordinary dividends), and box 2b (qualified dividends). Enter 0 if a box is blank.
      Box 2b cannot be larger than box 2a. These amounts go on Form 1040, not on Schedule E line 33. Interest goes on
      line 2b. Ordinary dividends go on line 3b. Qualified dividends go on line 3a.
  /info/income/schedule-e/estate-boxes:
    body: >-
      Enter boxes 5, 6, 7, and 8. Enter 0 if a box is blank. A nonnegative box 5 goes in column (f). A loss in box 5
      stops this return. Answer yes to material participation if you were involved on a regular, continuous, and
      substantial basis. Box 6 goes in column (f) when you materially participate. Box 7 is net rental real estate
      income. An amount greater than zero goes in column (d). A loss stops this return. Box 8 is other rental income
      and stops this return.
  /info/income/schedule-e/estate-box12:
    body: >-
      Code A is the adjustment for minimum tax purposes. It goes on Form 6251, line 2j. Enter 0 if code A is blank.
      Enter a negative amount if the adjustment is negative. Answer yes if box 12 has an amount for code B, C, D, E, F,
      G, H, or I. Those codes are not entered on line 2j. Code J is exclusion items for Form 8801. Answer yes if code J
      has an amount. Code J is not line 2j and does not stop this return.
  /info/income/schedule-e/estate-other:
    body: >-
      Answer yes for boxes 4b and 4c, and for boxes 9, 10, 11, 13, and 14, including the 28% rate gain, unrecaptured
      section 1250 gain, capital loss carryovers (box 11 codes C and D), deductions, and credits. Boxes 3 and 4a are
      the capital gain screen. Box 12 codes A through J are the previous screen. Do not answer yes only because of
      box 3, box 4a, or code J.
  /info/income/schedule-e/estate-limits:
    body: >-
      Answer yes to the first question if a basis limit applies. Answer yes to the second if any amount is not at risk.
      Answer yes to the third if you have a passive deduction or loss. Answer yes to the last question if you have a
      prior-year unallowed passive activity loss. That loss is reported on Form 8582, which this return does not file.
  /info/income/schedule-e/part-iv:
    body: >-
      Answer yes if you hold a residual interest in a real estate mortgage investment conduit (REMIC), even if you have
      no partnership, S corporation, estate, or trust. You should have a Schedule Q (Form 1066).
  /info/income/schedule-e/k1-intro:
    body: >-
      Add one entry for each partnership or S corporation. Use the name and the ordinary business income from Schedule
      K-1.
  /info/income/schedule-e/k1-name:
    body: >-
      Choose Partnership if Schedule K-1 is Form 1065. Choose S corporation if it is Form 1120-S. On Schedule E this is
      column (b): P or S.
  /info/income/schedule-e/k1-scope:
    body: >-
      Answer yes to foreign partnership if column (c) on Schedule E line 28 would be checked. Answer yes to a publicly
      traded partnership, or to a business that trades in financial instruments or commodities.
  /info/income/schedule-e/k1-box1:
    body: >-
      Enter box 1, ordinary business income or loss. Answer yes to material participation if you were involved in the
      operations on a regular, continuous, and substantial basis. That income goes in column (k), nonpassive income.
  /info/income/schedule-e/k1-box14:
    body: >-
      Enter the amount from box 14, code A. Enter 0 if that box is blank. An S corporation’s ordinary income is not
      self-employment earnings; enter 0 for an S corporation. For a partnership, a later screen asks whether this amount
      goes on Schedule SE line 2.
  /info/income/schedule-e/k1-box14-scope:
    body: >-
      Schedule SE line 2 includes this amount when it is not from farming, you did not reduce it, and it is the right
      amount for a limited partner. A reduction needs an attached explanation. Farming and box 14 code B go on line 1a.
      A limited partner includes only guaranteed payments for services.
  /info/income/schedule-e/k1-portfolio-partnership:
    body: >-
      Enter box 5 (interest), box 6a (ordinary dividends), and box 6b (qualified dividends). Enter 0 if a box is blank.
      Box 6b cannot be larger than box 6a. These amounts go on Form 1040, not on Schedule E line 28. Interest goes on
      line 2b. Ordinary dividends go on line 3b. Qualified dividends go on line 3a. Answer yes if box 5 includes
      interest from the credit for holders of clean renewable energy bonds. The partnership attaches a statement, and
      the basis of the partnership interest must be reduced by that interest. This return does not figure that
      reduction. Answer yes to the last question if any of those dividends are previously taxed earnings and profits.
      That amount is not included on lines 3b or 3a, and this return does not figure the exclusion.
  /info/income/schedule-e/k1-portfolio-s-corp:
    body: >-
      Enter box 4 (interest), box 5a (ordinary dividends), and box 5b (qualified dividends). Enter 0 if a box is blank.
      Box 5b cannot be larger than box 5a. These amounts go on Form 1040, not on Schedule E line 28. Interest goes on
      line 2b. Ordinary dividends go on line 3b. Qualified dividends go on line 3a. Answer yes to the last question if
      any of those dividends are previously taxed earnings and profits. That amount is not included on lines 3b or 3a,
      and this return does not figure the exclusion.
  /info/income/schedule-e/k1-other:
    body: >-
      Answer yes to the first question if the K-1 includes a statement for box 20, code Z (Form 1065) or box 17, code V
      (Form 1120-S). Answer yes to the second question if any box other than box 1, box 14 code A, and the interest and
      dividend boxes has an amount. Those boxes are Form 1065 boxes 5, 6a, and 6b, or Form 1120-S boxes 4, 5a, and 5b.
      Box 4 guaranteed payments are a yes even when that amount is also included in box 14 code A. Box 6c dividend
      equivalents are a yes. They are not reported on Form 1040. The statement for clean renewable energy bond interest
      in box 5 is the earlier partnership question, not this one.
  /info/income/schedule-e/k1-columns:
    body: >-
      Answer yes to the first question if you received a distribution, disposed of stock, or received a loan repayment
      from an S corporation. Answer yes to the second question if any amount is not at risk.
  /info/income/schedule-e/personal-use:
    body: >-
      Answer yes if, on any day, you, a co-owner, or a family member used a rental home, apartment, condo, or boat for
      personal purposes.
  /info/income/schedule-e/depreciation:
    body: >-
      This includes depreciation of a building or equipment, depletion of a mineral property, and any car or truck
      expenses (actual costs or the standard mileage rate). These need Form 4562.
  /info/income/schedule-e/amounts:
    body: >-
      Add up all your properties. Enter total rents received, total royalties received, and total expenses such as
      advertising, insurance, mortgage interest, repairs, supplies, taxes, and utilities. Don’t include depreciation.
  /info/income/schedule-e/any-loss:
    body: Answer yes if expenses were more than income for any one property, even if your total is a profit.
  /info/income/schedule-e/substantial-services:
    body: >-
      Don’t count heat and light, cleaning of shared areas, trash collection, or similar services. Short-term rentals
      with cleaning and linen changes between guests usually count.
  /info/knockout/schedule-e-substantial-services:
    alertText:
      body:
        - p: >-
            When you provide services like regular cleaning, changing linens, or maid service, the rental goes on
            Schedule C and may be subject to self-employment tax. This tool doesn’t support that yet. You’ll need
            another way to file this return.
  /info/knockout/schedule-e-part-ii:
    alertText:
      body:
        - p: >-
            This tool can report a domestic partnership or S corporation with ordinary business income when you
            materially participated, including interest and dividends from that Schedule K-1 and Schedule K-1 (Form
            1065) box 14 code A that is not from farming. A loss, a passive activity, a foreign partnership, a publicly
            traded partnership, a distribution or other basis computation, farming, a reduction of that self-employment
            amount, a limited partner amount that is not only guaranteed payments for services, a joint return with that
            amount, previously taxed earnings and profits, interest from the credit for holders of clean renewable
            energy bonds, or any other K-1 amount needs forms this tool doesn’t support yet. You’ll need another way to
            file this return.
  /info/knockout/schedule-c-k1-box14:
    alertText:
      body:
        - p: >-
            The deductible part of self-employment tax has to be split between Schedule C and a partnership when both
            have self-employment earnings. This tool doesn’t split that deduction yet. You’ll need another way to file
            this return.
  /info/knockout/schedule-e-part-ii-line-27:
    alertText:
      body:
        - p: >-
            A prior-year unallowed loss or unreimbursed partnership expenses can be limited by the passive activity,
            at-risk, and basis rules. This tool doesn’t support that yet. You’ll need another way to file this return.
  /info/knockout/schedule-e-part-iii:
    alertText:
      body:
        - p: >-
            This tool can report ordinary business income from a domestic estate or trust when you materially
            participated and that amount is not a loss. Box 12, code A, goes on Form 6251, line 2j. Box 12, code J,
            exclusion items, does not stop this return. Codes B through I on box 12, other rental income, rental real
            estate income, a loss, a passive activity, another K-1 amount, a foreign trust, or a basis, at-risk, or
            passive-loss limit needs forms this tool doesn’t support yet. You’ll need another way to file this return.
  /info/knockout/schedule-e-part-iv:
    alertText:
      body:
        - p: >-
            A residual interest in a REMIC is reported in Part IV of Schedule E from Schedule Q (Form 1066). This tool
            doesn’t support that yet. You’ll need another way to file this return.
  /info/knockout/schedule-e-personal-use:
    alertText:
      body:
        - p: >-
            When you also use a rental for personal purposes, your expenses have to be split and may be limited. This
            tool doesn’t do that yet. You’ll need another way to file this return.
  /info/knockout/schedule-e-depreciation:
    alertText:
      body:
        - p: >-
            Depreciation, depletion, and car or truck expenses are figured on Form 4562, which this tool doesn’t support
            yet. You’ll need another way to file this return.
  /info/knockout/schedule-e-loss:
    alertText:
      body:
        - p: >-
            Rental and royalty losses can be limited by the passive activity, at-risk, and excess business loss rules
            (Forms 8582, 6198, and 461), which this tool doesn’t support yet. You’ll need another way to file this
            return.
  /info/knockout/schedule-e-eitc:
    alertText:
      body:
        - p: >-
            Rental and royalty income counts toward the investment income limit for the Earned Income Tax Credit. This
            tool doesn’t include it in that test yet. You’ll need another way to file this return.
  /info/income/schedule-e/trade-or-business:
    body: >-
      Answer yes if a rental is a section 162 trade or business, including property you rent to a trade or business that
      you commonly control. You will enter each property. The qualified business income deduction is figured on Form
      8995. A Rev. Proc. 2019-38 safe harbor, an aggregation, a loss suspended this year, or property amounts above the
      Schedule E totals stop the return.
  /info/income/schedule-e/properties:
    body: >-
      Add one entry for each rental you treat as a section 162 trade or business. The name and the net income or loss go
      on Form 8995, line 1. The Schedule E totals are entered on a later screen.
  /info/income/schedule-e/property-name:
    body: >-
      This name is Form 8995, line 1, column (a). Column (b) is your SSN or ITIN. It is left blank only if this rental
      is aggregated.
  /info/income/schedule-e/property-amounts:
    body: >-
      Rents, royalties, and expenses for this property only. Net income or loss is Form 8995, line 1, column (c). It is
      not reduced by self-employment tax. The return stops if these amounts, added across properties, are more than the
      Schedule E totals, or if column (c) is more than Schedule E line 26.
  /info/income/schedule-e/property-participation:
    body: >-
      Material participation matters for the $400 minimum deduction on Form 8995, line 16. It is not required for the
      rest of the qualified business income deduction.
  /info/income/schedule-e/property-safe-harbor:
    body: >-
      Answer yes if you are relying on the safe harbor in Rev. Proc. 2019-38. That safe harbor needs a statement this
      tool does not attach.
  /info/income/schedule-e/property-aggregation:
    body: >-
      Answer yes if this rental is part of an aggregated trade or business. An aggregation has to be reported on
      Schedule B (Form 8995-A), which this tool does not attach.
  /info/income/schedule-e/property-suspended:
    body: >-
      Answer yes if a loss or deduction from this rental is suspended this year, including under the passive activity
      rules. A suspended loss is not qualified business income this year.
  /info/income/schedule-e/qbi-carryforward:
    body: >-
      Answer yes if you have a qualified business net loss carryforward from a prior year. Form 8995, line 3, is not
      figured here.
  /info/income/schedule-e/qbi-cooperative:
    body: >-
      Answer yes if you are a patron of an agricultural or horticultural cooperative. A patron uses Form 8995-A, which
      this tool does not figure.
  /info/knockout/schedule-e-trade-or-business:
    alertText:
      body:
        - p: >-
            Rev. Proc. 2019-38 requires a statement this tool does not attach. An aggregation has to be reported on
            Schedule B (Form 8995-A). A loss suspended under section 469 or another limitation is not qualified business
            income this year. The return also stops if the section 162 rents, royalties, or expenses are more than the
            Schedule E totals, or if Form 8995, line 1, column (c) is more than Schedule E line 26. You’ll need another
            way to file this return.
  /info/knockout/schedule-e-qbi-limit:
    alertText:
      body:
        - p: >-
            This tool figures the qualified business income deduction only with the simplified Form 8995. It can’t
            handle a prior-year loss carryforward, cooperative payments, taxable income above the Form 8995 limit, a mix
            of trades you materially participate in and trades you don’t, or more than five trades or businesses. You’ll
            need another way to file this return.
fields:
  /hadScheduleEIncome:
    boolean:
      "yes": Yes, I had rental or royalty income
      "no": No, I didn’t have rental or royalty income
  /scheduleEHasPartIIIncome:
    boolean:
      "yes": Yes, I got Schedule K-1 income
      "no": "No"
  /scheduleEProvidesSubstantialServices:
    boolean:
      "yes": Yes, I provided substantial services
      "no": No, I didn’t provide services like these
  /scheduleEHasPersonalUse:
    boolean:
      "yes": Yes, there was personal use
      "no": No, it was only rented out
  /scheduleEHasDepreciation:
    boolean:
      "yes": "Yes"
      "no": "No"
  /scheduleEAnyPropertyLoss:
    boolean:
      "yes": Yes, at least one property had a loss
      "no": No, every property had a profit or broke even
  /scheduleERentalIsTradeOrBusiness:
    boolean:
      "yes": Yes, at least one rental is a section 162 trade or business
      "no": "No"
  /scheduleEProperties/*/propertyName:
    name: Property name
  /scheduleEProperties/*/writableRents:
    name: Rents received for this property
  /scheduleEProperties/*/writableRoyalties:
    name: Royalties received for this property
  /scheduleEProperties/*/writableExpenses:
    name: Expenses for this property (not including depreciation)
  /scheduleEProperties/*/materiallyParticipates:
    boolean:
      "yes": Yes, I materially participated
      "no": No, I did not materially participate
  /scheduleEProperties/*/reliesOnRp201938SafeHarbor:
    boolean:
      "yes": Yes, I am relying on the safe harbor
      "no": "No"
  /scheduleEProperties/*/isAggregated:
    boolean:
      "yes": Yes, this rental is aggregated
      "no": "No"
  /scheduleEProperties/*/hasSuspendedPassiveLoss:
    boolean:
      "yes": Yes, a loss is suspended this year
      "no": "No"
  /scheduleEProperties:
    controls:
      add: Add another rental
      complete_zero: I don’t have one to add
      complete: I’m done adding rentals
      back: Go to the list
    collectionListing:
      itemHeading1: "{{/scheduleEProperties/*/propertyName}}"
      itemHeading2: Incomplete rental
      label2: Rental
    deleteControl:
      text: <LinkModal1>Remove this rental</LinkModal1>
      LinkModal1:
        header: Are you sure you want to remove this rental?
        body:
          - p: This can’t be undone.
        controls:
          confirm: Remove this rental
          cancel: Cancel
  /scheduleEWritableRents:
    name: Total rents received
  /scheduleEWritableRoyalties:
    name: Total royalties received
  /scheduleEWritableExpenses:
    name: Total expenses (not including depreciation)
  /scheduleEPartIILine27:
    boolean:
      "yes": Yes
      "no": "No"
  /scheduleEHasPartIIIIncome:
    boolean:
      "yes": Yes, I received a Schedule K-1 from an estate or trust
      "no": "No"
  /scheduleEHasPartIVIncome:
    boolean:
      "yes": Yes, I have a residual interest in a REMIC (Schedule Q)
      "no": "No"
  /scheduleEEstates/*/entityName:
    name: Name
  /scheduleEEstates/*/isForeignBeneficiary:
    boolean:
      "yes": Yes, I am a foreign beneficiary
      "no": "No"
  /scheduleEEstates/*/isForeignTrust:
    boolean:
      "yes": Yes, it is a foreign trust
      "no": "No"
  /scheduleEEstates/*/inconsistentTreatment:
    boolean:
      "yes": Yes, I am treating an item differently
      "no": "No"
  /scheduleEEstates/*/box1:
    name: Box 1, interest income
  /scheduleEEstates/*/box2a:
    name: Box 2a, ordinary dividends
  /scheduleEEstates/*/box2b:
    name: Box 2b, qualified dividends
  /scheduleEEstates/*/box3:
    name: Box 3, net short-term capital gain
  /scheduleEEstates/*/box4a:
    name: Box 4a, net long-term capital gain
  /scheduleEEstates/*/box5:
    name: Box 5, other portfolio and nonbusiness income
  /scheduleEEstates/*/box6:
    name: Box 6, ordinary business income
  /scheduleEEstates/*/box7:
    name: Box 7, net rental real estate income
  /scheduleEEstates/*/box8:
    name: Box 8, other rental income
  /scheduleEEstates/*/materiallyParticipates:
    boolean:
      "yes": Yes, I materially participated
