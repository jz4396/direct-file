  /heading/knockout/schedule-e-part-ii-line-27:
    This tool doesn’t yet support a prior-year unallowed loss or unreimbursed partnership expenses
  /heading/knockout/schedule-e-part-iii: This tool doesn’t yet support this estate or trust situation
  /heading/knockout/schedule-e-part-iv: This tool doesn’t yet support a residual interest in a REMIC
  /heading/knockout/schedule-e-personal-use: This tool doesn’t yet support rentals you also used personally
  /heading/knockout/schedule-e-depreciation: This tool doesn’t yet support depreciation or vehicle expenses
  /heading/knockout/schedule-e-loss: This tool doesn’t yet support rental or royalty losses
