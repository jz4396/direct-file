# Schedule EIC shared qualifying child (#17). Overlay merged by locales/featureLocales.ts.
# 26 U.S.C. 152(c)(4). 2025 Instructions for Form 1040, p. 44, "Qualifying child of more than one person."
# 2026 Schedule EIC draft, page 2: special rules apply when the child is a qualifying child of another person.
headings:
  /heading/knockout/schedule-eic-without-ty2026-template:
    This tool can’t yet file a return that claims the Earned Income Credit for a child who is also another person’s
    qualifying child
info:
  /info/knockout/schedule-eic-without-ty2026-template:
    alertText:
      body:
        - p:
            Schedule EIC is attached when you claim the earned income credit for a qualifying child. If that child is
            also the qualifying child of another person, special rules decide who may claim the child. This tool doesn’t
            apply those rules yet.
        - p: <Link1>Find other ways to file your federal taxes.</Link1>
      urls:
        Link1: https://www.irs.gov/filing/individuals/how-to-file
