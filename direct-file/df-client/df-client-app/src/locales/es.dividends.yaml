        body:
          - p:
              Esto no se puede deshacer. Si cambia de opinión más tarde, tendrá que volver a ingresar toda la
              información.
        controls:
          confirm: Eliminar este Formulario 1099-DIV de mi declaración de impuestos
          cancel: Cancelar
