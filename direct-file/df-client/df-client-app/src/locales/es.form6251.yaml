# Cadenas del Formulario 6251 (AMT) (#77). Se combinan en locales/featureLocales.ts.
headings:
  /heading/income/income-sources/amt-preference-items: "En {{/taxYear}}, ¿ejerció opciones de compra de acciones de incentivo o tuvo algún otro ajuste del impuesto mínimo alternativo distinto de la línea 2g del Formulario 6251?"
  /heading/knockout/amt-preference-items: Esta herramienta todavía no admite estas partidas del impuesto mínimo alternativo
  /heading/knockout/amt-mfs-add-back: Esta herramienta todavía no admite el impuesto mínimo alternativo para sus ingresos si es casado que presenta la declaración por separado
info:
  /info/income/income-sources/amt-preference-items:
    body: Responda sí por las opciones de compra de acciones de incentivo que ejerció y conservó (Formulario 3921), las diferencias de depreciación u otras diferencias de negocio para el impuesto mínimo alternativo, las pérdidas netas de operación y el crédito por impuestos extranjeros del impuesto mínimo alternativo. Los intereses de bonos de actividad privada especificados (casilla 9 del Formulario 1099-INT y casilla 13 del Formulario 1099-DIV) son la línea 2g del Formulario 6251 y ya están incluidos. No responda sí por esos intereses.
  /info/knockout/amt-preference-items:
    alertText:
      body:
        - p: <Link1>Encuentre otras maneras de presentar sus impuestos federales.</Link1>
      urls:
        Link1: https://www.irs.gov/filing/individuals/how-to-file
  /info/knockout/amt-mfs-add-back:
    alertText:
      body:
        - p: <Link1>Encuentre otras maneras de presentar sus impuestos federales.</Link1>
      urls:
        Link1: https://www.irs.gov/filing/individuals/how-to-file
