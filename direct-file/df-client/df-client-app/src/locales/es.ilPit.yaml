    /ilClaimsIlEitcOrCtc: Crédito por ingreso del trabajo o crédito tributario por hijos de Illinois
    /ilHasNonrefundableCredits: Anexo ICR, 1299-C, CR o 4255 de Illinois
    /ilHasUseTax: Impuesto de uso de Illinois
