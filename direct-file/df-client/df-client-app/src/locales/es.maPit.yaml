  /heading/knockout/ma-part-year: Esta herramienta todavía no admite una declaración de Massachusetts de residente parcial o no residente
  /heading/knockout/ma-w2: Esta herramienta todavía no admite un W-2 de un estado que no sea Massachusetts
  /heading/knockout/ma-other-income: Esta herramienta todavía no admite declaraciones de Massachusetts con ingresos distintos de los salarios del W-2
  /heading/knockout/ma-dependents: Esta herramienta todavía no admite dependientes en una declaración de Massachusetts
  /heading/knockout/ma-age-blind: Esta herramienta todavía no admite una declaración de Massachusetts de alguien de 65 años o más, o con ceguera
  /heading/knockout/ma-filing-status: Esta herramienta todavía no admite este estado civil en Massachusetts
  /heading/knockout/ma-itemized: Esta herramienta todavía no admite declaraciones de Massachusetts que detallan deducciones
  /heading/knockout/ma-use-tax: Esta herramienta todavía no admite el impuesto de uso de Massachusetts
  /heading/knockout/ma-mcc: Esta herramienta todavía no admite una declaración de Massachusetts sin cobertura de salud de todo el año
  /heading/knockout/ma-retirement: Esta herramienta todavía no admite una aportación de jubilación de Massachusetts en la casilla 14
  /heading/knockout/ma-tax-table: Esta herramienta todavía no admite este impuesto de Massachusetts
  /heading/knockout/ma-surtax: Esta herramienta todavía no admite el recargo del 4% de Massachusetts
