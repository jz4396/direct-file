info:
  /info/your-taxes/amount/ma-residency:
    body:
      Un año completo significa que usted, y su cónyuge si presentan en conjunto, vivieron en Massachusetts todo el año.
      Esa es la Forma 1. Los residentes parciales y los no residentes usan la Forma 1-NR/PY.
  /info/your-taxes/amount/ma-use-tax:
    body: La línea 34 es el impuesto de uso sobre compras por internet, por correo y de otros estados. Si debe alguno, esta herramienta no puede preparar la declaración.
  /info/your-taxes/amount/ma-rent:
    body:
      Esta es la línea 14a. La deducción es la mitad de ese alquiler, hasta $4,000. Escriba 0 si no pagó alquiler
      calificado por su residencia principal en Massachusetts.
  /info/your-taxes/amount/ma-optional-rate:
    body:
      La Forma 1 permite elegir pagar 5.85% en lugar de 5% sobre el ingreso gravado al 5%. No es la respuesta habitual.
      Sí marca el óvalo de la línea 22.
  /info/your-taxes/amount/ma-mcc:
    body:
      El Anexo HC pregunta si tuvo cobertura acreditable mínima durante cada uno de los 12 meses. Use el Formulario MA
      1099-HC de su aseguradora.
  /info/your-taxes/amount/ma-spouse-mcc:
    body: Una declaración conjunta hace la misma pregunta sobre su cónyuge.
  /info/your-taxes/amount/ma-retirement:
    body:
      Las líneas 11a y 11b usan el impuesto del Seguro Social y de Medicare de las casillas 4 y 6, hasta $2,000. Una
      aportación de jubilación de Massachusetts en la casilla 14 cambia esa deducción.
  /info/your-taxes/amount/ma-insurer:
    body: El Anexo HC imprime el nombre de la aseguradora de la casilla 1 del Formulario MA 1099-HC.
  /info/your-taxes/amount/ma-subscriber:
    body: El Anexo HC imprime el número de suscriptor del Formulario MA 1099-HC, o el número de su tarjeta del seguro.
  /info/your-taxes/amount/ma-spouse-insurer:
    body: Una declaración conjunta imprime la aseguradora de su cónyuge en el Anexo HC.
  /info/your-taxes/amount/ma-spouse-subscriber:
    body: Una declaración conjunta imprime el número de suscriptor de su cónyuge en el Anexo HC.
  /info/knockout/ma-part-year:
    alertText: Las declaraciones de residente parcial y de no residente de Massachusetts todavía no están admitidas
    body: Esas declaraciones usan la Forma 1-NR/PY, que esta herramienta no calcula.
  /info/knockout/ma-w2:
    alertText: Un W-2 de otro estado no está admitido en esta declaración de Massachusetts
    body: La casilla 15 tiene que ser Massachusetts, o estar en blanco. La retención cuenta solo cuando la casilla 15 es Massachusetts.
  /info/knockout/ma-other-income:
    alertText: Esta declaración de Massachusetts solo puede incluir salarios del W-2
    body: Los intereses bancarios de Massachusetts, el Anexo B, la jubilación, el Seguro Social, el negocio, el alquiler y otros ingresos no están admitidos.
  /info/knockout/ma-dependents:
    alertText: Los dependientes no están admitidos en esta declaración de Massachusetts
    body: La exención por dependientes y los créditos que dependen de ella no se calculan.
  /info/knockout/ma-age-blind:
    alertText: La edad de 65 años o la ceguera no está admitida en esta declaración de Massachusetts
    body: Las exenciones de las líneas 2c y 2d no se calculan.
  /info/knockout/ma-filing-status:
    alertText: Este estado civil todavía no está admitido en una declaración de Massachusetts
    body: Esta herramienta prepara la Forma 1 para solteros y para una declaración conjunta cuando ambos cónyuges vivieron en Massachusetts todo el año.
  /info/knockout/ma-itemized:
    alertText: Las deducciones detalladas no están admitidas en esta declaración de Massachusetts
    body: La línea 2e, el monto médico y dental del Anexo A federal, no se calcula.
  /info/knockout/ma-use-tax:
    alertText: El impuesto de uso de Massachusetts todavía no está admitido
    body: La línea 34 no se calcula.
  /info/knockout/ma-mcc:
    alertText: Una declaración sin cobertura de salud de todo el año todavía no está admitida
    body: La hoja de la penalidad del Anexo HC no se calcula.
  /info/knockout/ma-retirement:
    alertText: Una aportación de jubilación de Massachusetts en la casilla 14 todavía no está admitida
    body: Ese monto cambia la deducción de las líneas 11a y 11b.
  /info/knockout/ma-tax-table:
    alertText: Este impuesto de Massachusetts todavía no está admitido
    body:
      Cuando la línea 21 es menor de $24,000, el impuesto sale de la tabla. El estado sin impuesto y el crédito por
      ingreso limitado están en ese rango, y no se calculan.
  /info/knockout/ma-surtax:
    alertText: El recargo del 4% de Massachusetts todavía no está admitido
    body: El recargo aplica al ingreso gravable que pasa de $1,000,000, ajustado por inflación. Esta declaración se detiene por encima de $1,000,000.
  /info/knockout/ma-eitc:
    alertText: El crédito por ingreso del trabajo de Massachusetts todavía no está admitido
    body: Un crédito federal por ingreso del trabajo mayor que cero no se calcula en la Forma 1.
