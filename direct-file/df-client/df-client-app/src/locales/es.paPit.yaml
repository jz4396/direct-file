info:
  /info/your-taxes/amount/pa-exempt-obligation-dividends:
    body:
      Pensilvania no grava los dividendos que un fondo mutuo o fondo del mercado monetario paga de obligaciones directas
      del gobierno de EE. UU. (bonos, pagarés, letras y bonos de ahorro del Tesoro), de Pensilvania o de los gobiernos
      locales de Pensilvania. El estado de cuenta de fin de año de su fondo lo indica. Responda sí si alguna parte de
      sus dividendos proviene de estas obligaciones.
  /info/knockout/pa-dividends:
    alertText:
      body:
        - p:
            Sus dividendos de Pensilvania necesitan un ajuste en el Anexo B de Pensilvania, como dividendos de
            obligaciones de EE. UU. o de Pensilvania o dividendos recibidos mientras vivía fuera de Pensilvania. Esta
            herramienta aún no calcula esos ajustes.
        - p: Aún puede presentar su declaración federal aquí.
        - p: <Link1>Encuentre otras maneras de presentar su declaración de Pensilvania.</Link1>
      urls:
        Link1: https://www.pa.gov/agencies/revenue/forms-and-publications/pa-personal-income-tax-guide.html
  /info/your-taxes/amount/pa-unreimbursed-employee-expenses:
    body:
      Son gastos que pagó para realizar su trabajo y que su empleador no le reembolsó, y se declaran en el Anexo UE de
      PA. Pensilvania solo permite gastos necesarios para realizar su trabajo. Responda no si su empleador le reembolsó
      la cantidad exacta o le dio una asignación que no incluyó en su salario.
  /info/knockout/pa-unreimbursed-employee-expenses:
    alertText:
      body:
        - p: Aún puede presentar su declaración federal aquí.
        - p: <Link1>Encuentre otras maneras de presentar su declaración de Pensilvania.</Link1>
      urls:
        Link1: https://www.pa.gov/agencies/revenue/forms-and-publications/pa-personal-income-tax-guide.html
  /info/your-taxes/amount/pa-unsupported-items:
    body:
      - p:
          "Aportaciones a una cuenta de ahorros médicos, cuenta de ahorros para la salud, plan 529 o ABLE, o intereses
          de préstamos estudiantiles que desea deducir; ingresos de un caudal hereditario o fideicomiso; ganancias de
          juegos de azar o lotería; pagos estimados o de prórroga de Pensilvania, o un reembolso del año pasado aplicado
          a este año; crédito por impuestos pagados a otro estado; otros créditos de Pensilvania (Anexos OC o DC); o
          impuesto sobre el uso que adeuda."
      - p:
          Esta herramienta no calcula el impuesto local sobre ingresos del trabajo. Preséntelo ante su recaudador de
          impuestos local.
  /info/knockout/pa-unsupported-items:
    alertText:
      body:
        - p: Aún puede presentar su declaración federal aquí.
        - p: <Link1>Encuentre otras maneras de presentar su declaración de Pensilvania.</Link1>
      urls:
        Link1: https://www.pa.gov/agencies/revenue/forms-and-publications/pa-personal-income-tax-guide.html
  /info/your-taxes/amount/pa-schedule-c-tax-shelter:
    body:
      El Anexo C de Pensilvania pregunta sobre transacciones de refugios fiscales y el Formulario 8271. Responda sí si
      algún negocio del Anexo C tuvo transacciones de refugios fiscales. Pensilvania no las permite en el Anexo C de PA.
  /info/knockout/pa-unsupported-income:
    alertText:
      body:
        - p:
            Esto incluye ingresos de negocio como residente parte del año, transacciones de refugios fiscales en un
            Anexo C, una pérdida de negocio en una declaración conjunta, ingresos de alquiler o regalías de un Anexo
            K-1, ingresos de alquiler o regalías como residente parte del año, distribuciones de jubilación, ingresos
            del Formulario 1099-MISC, intereses exentos de impuestos, un Formulario W-2 sin salarios de Pensilvania
            en el encasillado 16 o ventas de bienes en una declaración conjunta.
        - p: <Link1>Encuentre otras maneras de presentar su declaración de Pensilvania.</Link1>
      urls:
        Link1: https://www.pa.gov/agencies/revenue/forms-and-publications/pa-personal-income-tax-guide.html
  /info/your-taxes/amount/pa-sp-nontaxable-income:
    body:
      Esto incluye pensión alimenticia, pagos de seguros de vida o herencias, regalos, premios o galardones, paga
      militar no tributable, ganancia excluida por la venta de su vivienda, becas o subvenciones no tributables, dinero
      o manutención de personas fuera de su hogar, beneficios no tributables por enfermedad, discapacidad o huelga de un
      plan cafetería, pagos por cuidado de crianza y compensación por desempleo. No incluya el Seguro Social ni los
      beneficios de jubilación elegibles.
  /info/knockout/pa-sp-unsupported:
    alertText:
      body:
        - p:
            Es posible que reúna los requisitos para la Condonación de Impuestos (Anexo SP), pero esta herramienta no
            puede calcularla si está separado o presenta por separado, alguien puede reclamarlo como dependiente, tiene
            más de 9 hijos dependientes, recibió compensación por desempleo, tuvo una pérdida neta por ventas mientras
            vivía fuera de Pensilvania o tiene otros ingresos no tributables que cuentan para la elegibilidad.
        - p: <Link1>Encuentre otras maneras de presentar su declaración de Pensilvania.</Link1>
      urls:
        Link1: https://www.pa.gov/agencies/revenue/forms-and-publications/pa-personal-income-tax-guide.html
  /info/you-and-your-family/about-you/pa-part-year-move:
    body:
      - p:
          Si se mudó entre Pensilvania y Florida, puede presentar aquí una declaración de Pensilvania como residente
          parte del año. Pensilvania grava todos sus ingresos del tiempo en que vivió allí, más los ingresos de fuentes
          de Pensilvania (como el pago por trabajo en Pensilvania) del resto del año.
      - p:
          Florida no tiene impuesto estatal sobre los ingresos, así que no hay una declaración de Florida que presentar.
  /info/you-and-your-family/about-you/pa-part-year-move-date:
    body:
      - p:
          Ingrese la fecha en que comenzó a vivir en Florida (si se mudó de Pensilvania) o en Pensilvania (si se mudó
          allí). La mudanza debe ser posterior al 1 de enero y en {{/taxYear}}.
  /info/income/jobs/w2-pa-part-year-resident-wages:
    body:
      - p:
          Este Formulario W-2 no indica salarios de Pensilvania. Ingrese la parte de su pago que ganó mientras vivía en
          Pensilvania. Pensilvania grava este pago aunque sea de un empleador de Florida.
      - p:
          Pensilvania no le permite restar de su pago las aportaciones a planes de jubilación (como las aportaciones a
          un plan 401(k)), así que incluya esas cantidades. Ingrese 0 si ganó todo este pago mientras vivía en Florida.
  /info/your-taxes/amount/pa-part-year-interest:
    body:
      - p:
          Pensilvania grava los intereses que recibió mientras vivía allí. No grava los intereses que recibió mientras
          vivía en Florida. No incluya intereses de bonos de ahorro de EE. UU. ni de obligaciones del Tesoro.
  /info/your-taxes/amount/pa-part-year-dividends:
    body:
      - p:
          Pensilvania grava los dividendos ordinarios que recibió mientras vivía allí. No grava los dividendos
          ordinarios que recibió mientras vivía en Florida. Ingrese el monto de la casilla 1a del Formulario 1099-DIV
          del tiempo que vivió en Pensilvania. Si los recibió todos mientras vivía en Pensilvania, ingrese el monto
          total.
      - p:
          Los dividendos que recibió mientras vivía en Florida van en el Anexo B de PA, que esta herramienta aún no
          completa.
  /info/knockout/pa-part-year:
    alertText:
      body:
        - p:
            "Esto incluye: una declaración conjunta, una fecha de mudanza que no sea posterior al 1 de enero y en
            {{/taxYear}}, un Formulario W-2 de un estado que no sea Pensilvania ni Florida, o un Formulario W-2 de
            Florida con impuesto estatal sobre los ingresos retenido en el encasillado 17."
        - p: Aún puede presentar su declaración federal aquí.
        - p: <Link1>Encuentre otras maneras de presentar su declaración de Pensilvania.</Link1>
      urls:
        Link1: https://www.pa.gov/agencies/revenue/forms-and-publications/pa-personal-income-tax-guide.html
  /info/your-taxes/amount/pa-part-year-nonresident-pa-pay:
    body:
      - p:
          Pensilvania grava el pago por trabajo que hace en Pensilvania, aunque viva en otro estado. Responda sí si,
          después de mudarse a Florida (o antes de mudarse a Pensilvania), trabajó en Pensilvania y ese pago no está
          incluido en el encasillado 16 de un Formulario W-2 de Pensilvania. Por ejemplo, un empleador de Florida le
          pagó por días que trabajó en Pensilvania.
  /info/knockout/pa-part-year-nonresident-pa-pay:
    alertText:
      body:
        - p:
            Pensilvania requiere el Anexo NRH de PA para calcular el pago por trabajo que hizo en Pensilvania mientras
            vivía en otro estado, y esta herramienta aún no admite ese anexo.
        - p: Aún puede presentar su declaración federal aquí.
        - p: <Link1>Encuentre otras maneras de presentar su declaración de Pensilvania.</Link1>
      urls:
        Link1: https://www.pa.gov/agencies/revenue/forms-and-publications/pa-personal-income-tax-guide.html
  /info/your-taxes/amount/pa-school-district:
    body:
      - p:
          Pensilvania pide el código de 5 dígitos del distrito escolar donde vivía el 31 de diciembre, aunque se haya
          mudado después de esa fecha. Use el distrito de la dirección de su vivienda, que puede ser distinta de su
          dirección postal.
      - p: <Link1>Busque el código de su distrito escolar en las instrucciones del PA-40 (páginas 46 y 47).</Link1>
    urls:
      # 2026 PA-40 instructions are not published. This is the 2025 booklet, the latest posted school-district list.
      Link1: https://www.pa.gov/content/dam/copapwp-pagov/en/revenue/documents/formsandpublications/formsforindividuals/pit/documents/2025/2025_pa-40in.pdf
  /info/knockout/pa-schedule-a:
    alertText:
      body:
        - p:
            Su declaración de Pensilvania necesita el Anexo A de PA, y esta herramienta aún no puede completarlo. Esto
            incluye intereses de bonos de ahorro de EE. UU. u obligaciones del Tesoro, intereses exentos de impuestos, o
            intereses cuando vivió en Pensilvania solo parte del año.
        - p: Aún puede presentar su declaración federal aquí.
        - p: <Link1>Encuentre otras maneras de presentar su declaración de Pensilvania.</Link1>
      urls:
        Link1: https://www.pa.gov/agencies/revenue/forms-and-publications/pa-personal-income-tax-guide.html
  /info/knockout/pa-schedule-c:
    alertText:
      body:
        - p:
            Su declaración de Pensilvania necesita el Anexo C de PA para ingresos de negocio, y esta herramienta aún no
            puede completarlo. Pensilvania no acepta el Anexo C federal en lugar del Anexo C de PA.
        - p: Aún puede presentar su declaración federal aquí.
        - p: <Link1>Encuentre otras maneras de presentar su declaración de Pensilvania.</Link1>
      urls:
        Link1: https://www.pa.gov/agencies/revenue/forms-and-publications/pa-personal-income-tax-guide.html
  /info/knockout/pa-schedule-b:
    alertText:
      body:
        - p:
            Su declaración de Pensilvania necesita el Anexo B de PA, y esta herramienta aún no puede completarlo. Esto
            incluye distribuciones de ganancias de capital (casilla 2a del Formulario 1099-DIV), dividendos de fondos
            provenientes de obligaciones de EE. UU. o de Pensilvania, dividendos que recibió como nominatario, o
            dividendos ordinarios que recibió mientras vivía fuera de Pensilvania.
        - p: Aún puede presentar su declaración federal aquí.
        - p: <Link1>Encuentre otras maneras de presentar su declaración de Pensilvania.</Link1>
      urls:
        Link1: https://www.pa.gov/agencies/revenue/forms-and-publications/pa-personal-income-tax-guide.html
  /info/knockout/pa-schedule-d:
    alertText:
      body:
        - p:
            Su declaración de Pensilvania necesita el Anexo D de PA para cualquier venta de acciones, bonos u otros
            bienes, incluso con pérdida, y esta herramienta aún no puede completarlo.
        - p: Aún puede presentar su declaración federal aquí.
        - p: <Link1>Encuentre otras maneras de presentar su declaración de Pensilvania.</Link1>
      urls:
        Link1: https://www.pa.gov/agencies/revenue/forms-and-publications/pa-personal-income-tax-guide.html
