# Anexo 3-A, líneas 7 y 8 (borrador de 2026). Overlay merged by locales/featureLocales.ts.
dataviews:
  /flow/your-taxes/amount:
    /schedule3AWantsFederalPublicBenefit: ¿Quiere recibir su beneficio público federal?
    /schedule3AIsCitizenNationalOrQualifiedAlien:
      ¿Usted o su cónyuge es ciudadano de los EE. UU., nacional de los EE. UU. o extranjero calificado?
headings:
  /heading/your-taxes/amount/schedule-3a-line-7: ¿Quiere recibir su beneficio público federal?
  /heading/your-taxes/amount/schedule-3a-line-8:
    ¿Usted o su cónyuge es ciudadano de los EE. UU., nacional de los EE. UU. o extranjero calificado?
info:
  /info/your-taxes/amount/schedule-3a-line-7:
    body:
      - p:
          Anexo 3-A (Formulario 1040), línea 7. Si responde no, la cantidad de la línea 6 se anota en el Formulario
          1040, línea 32b, y la línea 8 se deja en blanco.
  /info/your-taxes/amount/schedule-3a-line-8:
    body:
      - p:
          Anexo 3-A (Formulario 1040), Parte II, línea 8. “Extranjero calificado” se define en 8 U.S.C. 1641(b). Si
          responde sí, la línea 8 y la línea 32b del Formulario 1040 son -0-. Si responde no, la cantidad de la línea 6
          se anota en la línea 8 y en el Formulario 1040, línea 32b.
