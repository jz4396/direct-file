# Anexo 1-A Parte II, deducción por propinas (#51). Overlay merged by locales/featureLocales.ts.
subsubcategories:
  /flow/credits-and-deductions/deductions:
    tips-deduction: "Deducción por propinas"
headings:
  /heading/credits-and-deductions/deductions/tips-self-employed: "¿Recibiste propinas en tu propio negocio?"
  /heading/credits-and-deductions/deductions/tips-occupation: "¿Recibiste tus propinas en una ocupación que habitualmente recibía propinas?"
  /heading/credits-and-deductions/deductions/tips-sstb: "¿Está tu empleador en una ocupación o negocio de servicios especificados?"
  /heading/knockout/tips-self-employed: "Esta herramienta todavía no admite la deducción por propinas para trabajadores por cuenta propia"
  /heading/knockout/tips-sstb: "Esta herramienta todavía no admite propinas de una ocupación o negocio de servicios especificados"
  /heading/credits-and-deductions/deductions/overtime-1099: "¿Se te pagó alguna de estas horas extras como contratista independiente y se declaró en el Formulario 1099-NEC o 1099-MISC?"
  /heading/credits-and-deductions/deductions/overtime-special-rule: "¿Tu empleador usa una regla especial de horas extras de la FLSA en lugar de la semana laboral habitual de 40 horas?"
  /heading/credits-and-deductions/deductions/overtime-method: "¿Qué muestran tus registros de pago sobre tus horas extras?"
  /heading/credits-and-deductions/deductions/overtime-amount: "Ingresa la cantidad de horas extras de tus registros"
info:
  /info/credits-and-deductions/deductions/tips-self-employed:
    body: "Por ejemplo, propinas que recibió de clientes un estilista o conductor de transporte por cuenta propia."
  /info/credits-and-deductions/deductions/tips-occupation:
    body: "Solo califican las propinas recibidas en una ocupación de la lista del Tesoro de ocupaciones que habitual y regularmente recibían propinas el 31 de diciembre de 2024 o antes. El Formulario W-2, casilla 14b, muestra el código de ocupación con propinas del Tesoro. Solo cuentan las propinas voluntarias: los cargos por servicio, las propinas automáticas y otras cantidades obligatorias añadidas a una cuenta no califican, a menos que el cliente pudiera eliminarlas o cambiarlas libremente (Instrucciones del Formulario 1040, Anexo 1-A, Parte II)."
  /info/credits-and-deductions/deductions/tips-sstb:
    body: "Los campos de servicios especificados incluyen salud, derecho, contabilidad, artes escénicas, consultoría, atletismo, servicios financieros y de corretaje."
  /info/knockout/tips-self-employed:
    alertText:
      body:
        - p: <Link1>Encuentra otras maneras de presentar tus impuestos federales.</Link1>
      urls:
        Link1: https://www.irs.gov/es/filing/individuals/how-to-file
  /info/knockout/tips-sstb:
    alertText:
      body:
        - p: <Link1>Encuentra otras maneras de presentar tus impuestos federales.</Link1>
      urls:
        Link1: https://www.irs.gov/es/filing/individuals/how-to-file
  /info/credits-and-deductions/deductions/overtime-1099:
    body: "Contesta que sí si un negocio para el que trabajaste (no tu empleador) declaró las horas extras en el Formulario 1099-NEC o 1099-MISC."
  /info/credits-and-deductions/deductions/overtime-special-rule:
    body: "Por ejemplo, periodos de trabajo de protección contra incendios o de agentes del orden público en el sector público, o recibir tiempo libre compensatorio en lugar de pago en efectivo por horas extras."
  /info/credits-and-deductions/deductions/overtime-method:
    body: "Usa la declaración de tu empleador, tus talones de pago o registros de nómina. Aquí solo cuentan las horas extras de tu trabajo como empleado. Guarda los registros que uses."
  /info/credits-and-deductions/deductions/overtime-amount:
    body: "Ingresa la cantidad para la opción que elegiste. Calcularemos la parte deducible: toda la prima de horas extras de la FLSA, 1/3 del pago total a tiempo y medio, 1/2 de una prima de pago doble, 1/4 del pago total doble, o 1/2 de tu pago regular por las horas que pasan de 40."
