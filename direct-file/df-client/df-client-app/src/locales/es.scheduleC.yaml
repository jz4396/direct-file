info:
  /info/income/schedule-c/intro:
    body: >-
      Esto incluye los ingresos de un negocio por cuenta propia, trabajos esporádicos o trabajo independiente que se
      declaran en el Anexo C. También incluye ingresos de agricultura, ingresos como empleado de una iglesia, honorarios
      de notario e ingresos del ministerio. Conteste que sí si alguno corresponde. Conteste que no solo si ninguno
      corresponde.
  /info/income/schedule-c/qbi-carryforward:
    body: >-
      Usamos los ingresos de su negocio para calcular la deducción por ingreso calificado de negocios (Formulario 8995).
      Conteste que sí si su Formulario 8995 u 8995-A del año anterior mostró una pérdida de negocio calificada que se
      traslada o una pérdida que se traslada de dividendos calificados de REIT y de sociedades que cotizan en bolsa.
  /info/income/schedule-c/qbi-cooperative:
    body: >-
      Conteste que sí si vende productos a una cooperativa agrícola o de jardinería, o compra suministros por medio de
      ella, y recibe de ella dividendos de patrocinio u otros pagos calificados.
  /info/income/schedule-c/material-participation:
    body: >-
      Usted participa materialmente si trabaja en el negocio de forma regular, continua y considerable. Por ejemplo,
      trabajó más de 500 horas en él este año o hizo casi todo el trabajo.
  /info/income/schedule-c/loop-intro:
    body: >-
      Agregue una entrada por cada negocio o actividad esporádica. Calcularemos la ganancia neta y el impuesto sobre el
      trabajo por cuenta propia.
  /info/income/schedule-c/amounts:
    body: >-
      Los ingresos brutos son el total de los ingresos del negocio antes de los gastos. Los gastos son los costos
      ordinarios y necesarios para operar el negocio (sección 162 del Código de Impuestos Internos).
  /info/income/schedule-c/farm:
    body: >-
      Las líneas 1a y 1b del Anexo SE son la ganancia de agricultura y los pagos del Programa de Reservas para la
      Conservación. Conteste que sí si alguna corresponde. Esta herramienta no puede calcular esas líneas.
  /info/income/schedule-c/church-employee:
    body: >-
      Los ingresos como empleado de una iglesia van en las líneas 5a y 5b del Anexo SE. Se calculan por separado de los
      otros ingresos del trabajo por cuenta propia. Conteste que sí si los tiene.
  /info/income/schedule-c/optional-method:
    body: >-
      Los métodos opcionales son la línea 4b y la Parte II del Anexo SE. Conteste que sí si quiere usar un método
      opcional de agricultura o que no es de agricultura. Esta herramienta calcula solo el método regular.
  /info/income/schedule-c/minister:
    body: >-
      Conteste que sí si es ministro, miembro de una orden religiosa o practicante de la Ciencia Cristiana, o si tiene
      una exención aprobada del Formulario 4361 o 4029. La vivienda y la exención no se calculan aquí.
  /info/income/schedule-c/notary:
    body: >-
      Los honorarios de notario por un cargo público están excluidos del impuesto sobre el trabajo por cuenta propia.
      Conteste que sí si necesita esa exclusión. Esta herramienta no puede restar esos honorarios.
  /info/income/schedule-c/form-8919:
    body: >-
      Los salarios del Formulario 8919 van en la línea 8c del Anexo SE. Conteste que sí si los tiene. Las propinas no
      declaradas del Formulario 4137 detienen la declaración por separado.
  /info/knockout/schedule-se-out-of-scope:
    alertText:
      body:
        - p: >-
            Esta declaración necesita una línea del Anexo SE que esta herramienta no calcula. Eso incluye ingresos de
            agricultura, pagos del Programa de Reservas para la Conservación, ingresos como empleado de una iglesia, un
            método opcional, el ministerio o una exención del Formulario 4361 o 4029, honorarios de notario o salarios
            del Formulario 8919. Tendrá que usar otra manera de presentar esta declaración.
  /info/knockout/schedule-c-qbi:
    alertText:
      body:
        - p: >-
            Esta herramienta calcula la deducción por ingreso calificado de negocios solo con el Formulario 8995
            simplificado. No acepta una pérdida que se traslada de un año anterior, pagos de cooperativas, ingreso
            tributable por encima del límite del Formulario 8995, ni algunos negocios en los que participa materialmente
            y otros en los que no. Tendrá que usar otra manera de presentar esta declaración.
  /info/income/schedule-c/part-i:
    body:
      "Los ingresos brutos son la línea 1. Las devoluciones y rebajas son la línea 2 y se ingresan como un monto
      positivo. Los otros ingresos son la línea 6 (por ejemplo, ventas de desecho). Deje una línea en cero si no
      corresponde."
  /info/income/schedule-c/other-income-form:
    body:
      "Conteste que sí si este monto es un crédito por impuesto sobre combustibles o una recuperación del Formulario
      4797. Esta herramienta no puede calcularlos."
  /info/income/schedule-c/inventory:
    body:
      "Conteste que sí si necesita la Parte III, costo de mercancías vendidas. Esta herramienta no puede calcular el
      inventario."
  /info/income/schedule-c/vehicle:
    body:
      "Conteste que sí si tuvo gastos de automóvil y camión (línea 9) o intereses de un préstamo de vehículo (línea
      16b). Esos necesitan el Formulario 4562 o la Parte IV."
  /info/income/schedule-c/depreciation:
    body:
      "Conteste que sí si corresponde la línea 13. La depreciación y la deducción de la sección 179 necesitan el
      Formulario 4562."
  /info/income/schedule-c/depletion:
    body: "Conteste que sí si reclama agotamiento en la línea 12."
  /info/income/schedule-c/equipment-rent:
    body: "Conteste que sí si alquiló vehículos, maquinaria y equipo (línea 20a)."
  /info/income/schedule-c/home-office:
    body:
      "Conteste que sí si reclama gastos por el uso comercial de su hogar en la línea 30, incluido el método
      simplificado. Eso necesita el Formulario 8829 o la hoja de trabajo simplificada."
  /info/income/schedule-c/energy:
    body: "Conteste que sí si reclama la deducción de la línea 27a. Necesita el Formulario 7205."
  /info/income/schedule-c/has-expenses:
    body:
      "Estos son los costos ordinarios y necesarios para llevar a cabo el negocio (sección 162 del Código de Impuestos
      Internos). No incluya los conceptos preguntados arriba."
  /info/income/schedule-c/which-expenses:
    body:
      "Seleccione cada línea que corresponda. Las comidas se reducen al 50 por ciento en la pantalla siguiente, salvo
      que corresponda otro límite."
  /info/income/schedule-c/expense-amounts:
    body:
      "Ingrese el monto de cada línea que seleccionó. Para las comidas, ingrese el monto total antes del límite del 50
      por ciento."
  /info/income/schedule-c/meals-limit:
    body:
      "En la mayoría de los casos puede deducir el 50 por ciento de las comidas del negocio. Conteste que no si
      corresponde la excepción del 80 por ciento para trabajadores del transporte o una comida del 100 por ciento."
  /info/income/schedule-c/wage-credits:
    body:
      "La línea 26 son los salarios menos los créditos por empleo. Conteste que sí si reduce los salarios por el
      Formulario 5884, 8932 u 8994."
  /info/income/schedule-c/interest-allocation:
    body:
      "Conteste que sí si los intereses hipotecarios (línea 16a) u otros intereses (línea 16c) son en parte personales o
      deben asignarse de otra manera. Los intereses de un préstamo de vehículo son la línea 16b y se preguntaron antes."
  /info/income/schedule-c/amortization:
    body:
      "Conteste que sí si algún otro gasto es amortización que comienza en 2026. Eso se declara en el Formulario 4562-B."
  /info/income/schedule-c/part-v:
    body: "Anote cada otro gasto y su monto. El total es la línea 48 y la línea 27b."
  /info/income/schedule-c/part-v-more:
    body:
      "Esta herramienta puede anotar tres otros gastos. Conteste que sí si tiene un cuarto. El formulario permite más y
      tendrá que usar otra manera de presentar la declaración."
  /info/income/schedule-c/at-risk:
    body:
      "Conteste esto solo porque este negocio tiene una pérdida. Si toda su inversión estuvo en riesgo y participó
      materialmente, la pérdida puede declararse. Si parte no estuvo en riesgo, se requiere el Formulario 6198."
  /info/knockout/schedule-c-out-of-scope:
    alertText:
      body:
        - p:
            "Este negocio necesita un formulario o un límite de pérdida que esta herramienta no calcula. Eso incluye
            inventario, gastos de vehículo, depreciación, agotamiento, alquiler de equipo, una oficina en el hogar, el
            Formulario 7205, comidas que no están limitadas al 50 por ciento, créditos por empleo, intereses que deben
            asignarse, amortización nueva, más de tres otros gastos, ingresos de la línea 6 de otro formulario, una
            pérdida en la que no participó materialmente o una pérdida que no está totalmente en riesgo. Tendrá que usar
            otra manera de presentar esta declaración."
