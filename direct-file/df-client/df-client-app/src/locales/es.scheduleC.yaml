# Cadenas del Anexo C / SE (brecha #3, año tributario 2026 presentado en 2027).
# Superposición combinada con es.yaml por locales/featureLocales.ts.
subsubcategories:
  /flow/income/schedule-c:
    schedule-c-eligibility: Ingresos de trabajo por cuenta propia
    schedule-c-business: Información del negocio
headings:
  /heading/income/schedule-c: Ingresos de trabajo por cuenta propia
  /heading/income/schedule-c/intro: ¿Tuvo ingresos de trabajo por cuenta propia, de trabajos esporádicos o como trabajador independiente en {{/taxYear}}?
  /heading/income/schedule-c/qbi-carryforward: ¿Tiene una pérdida de negocio calificada que se traslada de un año anterior?
  /heading/income/schedule-c/qbi-cooperative: ¿Es usted cliente de una cooperativa agrícola u hortícola?
  /heading/income/schedule-c/material-participation: ¿Participó materialmente en este negocio?
  /heading/income/schedule-c/loop-intro: Agregue cada negocio o actividad esporádica
  /heading/income/schedule-c/business-basics: Infórmenos sobre este negocio
  /heading/income/schedule-c/amounts: Ingrese los ingresos brutos y los gastos
  /heading/knockout/schedule-c-qbi: Esta herramienta no puede calcular su deducción por ingreso calificado de negocios
info:
  /info/income/schedule-c/intro:
    body: >-
      Esto incluye los ingresos de un negocio por cuenta propia, trabajos esporádicos o trabajo independiente que
      se declaran en el Anexo C.
  /info/income/schedule-c/qbi-carryforward:
    body: >-
      Usamos los ingresos de su negocio para calcular la deducción por ingreso calificado de negocios (Formulario
      8995). Conteste que sí si su Formulario 8995 u 8995-A del año anterior mostró una pérdida de negocio calificada
      que se traslada o una pérdida que se traslada de dividendos calificados de REIT y de sociedades que cotizan en
      bolsa.
  /info/income/schedule-c/qbi-cooperative:
    body: >-
      Conteste que sí si vende productos a una cooperativa agrícola o de jardinería, o compra suministros por medio de
      ella, y recibe de ella dividendos de patrocinio u otros pagos calificados.
  /info/income/schedule-c/material-participation:
    body: >-
      Usted participa materialmente si trabaja en el negocio de forma regular, continua y considerable. Por ejemplo,
      trabajó más de 500 horas en él este año o hizo casi todo el trabajo.
  /info/income/schedule-c/loop-intro:
    body: >-
      Agregue una entrada por cada negocio o actividad esporádica. Calcularemos la ganancia neta y el impuesto sobre
      el trabajo por cuenta propia.
  /info/income/schedule-c/amounts:
    body: >-
      Los ingresos brutos son el total de los ingresos del negocio antes de los gastos. Los gastos son los costos
      ordinarios y necesarios para operar el negocio (sección 162 del Código de Impuestos Internos).
  /info/knockout/schedule-c-qbi:
    alertText:
      body:
        - p: >-
            Esta herramienta calcula la deducción por ingreso calificado de negocios solo con el Formulario 8995
            simplificado. No acepta una pérdida que se traslada de un año anterior, pagos de cooperativas, ingreso
            tributable por encima del límite del Formulario 8995, ni algunos negocios en los que participa
            materialmente y otros en los que no. Tendrá que usar otra manera de presentar esta declaración.
fields:
  /hadSelfEmploymentIncome:
    boolean:
      "yes": Sí, tuve ingresos de trabajo por cuenta propia, esporádico o independiente
      "no": No, no tuve ingresos de trabajo por cuenta propia
  /qbiHasPriorYearLossCarryforward:
    boolean:
      "yes": Sí, tengo una pérdida que se traslada
      "no": "No"
  /qbiIsCooperativePatron:
    boolean:
      "yes": Sí, soy cliente de una cooperativa
      "no": "No"
  /scheduleCBusinesses/*/materiallyParticipates:
    boolean:
      "yes": Sí, participé materialmente
      "no": No, no participé materialmente
  /scheduleCBusinesses:
    controls:
      add: Agregar un negocio
      complete_zero: No tengo un negocio para agregar
      complete: Terminé de agregar negocios
      back: Ir a la lista de negocios
    collectionListing:
      itemHeading1: "{{/scheduleCBusinesses/*/businessName}}"
      itemHeading2: Negocio incompleto
      label1: "Propietario: {{/scheduleCBusinesses/*/filer/fullName}}"
      label2: Ganancia o (pérdida) neta
      value2: <strong>{{/scheduleCBusinesses/*/netProfitOrLoss}}</strong>
    deleteControl:
      text: <LinkModal1>Eliminar negocio</LinkModal1>
      LinkModal1:
        header: ¿Está seguro de que desea eliminar este negocio?
        body:
          - p: Esta acción no se puede deshacer.
        controls:
          confirm: Eliminar este negocio
          cancel: Cancelar
  /scheduleCBusinesses/*/filer:
    item: "{{/filers/*/firstName}} {{/filers/*/lastName}}"
  /scheduleCBusinesses/*/businessName:
    name: Nombre del negocio o actividad esporádica
  /scheduleCBusinesses/*/writableGrossReceipts:
    name: Ingresos brutos o ventas
  /scheduleCBusinesses/*/writableTotalExpenses:
    name: Total de gastos del negocio
checklist:
  /flow/income/schedule-c:
    heading: Ingresos de trabajo por cuenta propia (Anexo C)
    dataItems:
