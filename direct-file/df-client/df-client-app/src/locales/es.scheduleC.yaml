info:
  /info/income/schedule-c/intro:
    body: >-
      Esto incluye los ingresos de un negocio por cuenta propia, trabajos esporádicos o trabajo independiente que se
      declaran en el Anexo C. También incluye ingresos de agricultura, ingresos como empleado de una iglesia, honorarios
      de notario e ingresos del ministerio. Conteste que sí si alguno corresponde. Conteste que no solo si ninguno
      corresponde.
  /info/income/schedule-c/qbi-carryforward:
    body: >-
      Usamos los ingresos de su negocio para calcular la deducción por ingreso calificado de negocios (Formulario 8995).
      Conteste que sí si su Formulario 8995 u 8995-A del año anterior mostró una pérdida de negocio calificada que se
      traslada o una pérdida que se traslada de dividendos calificados de REIT y de sociedades que cotizan en bolsa.
  /info/income/schedule-c/qbi-cooperative:
    body: >-
      Conteste que sí si vende productos a una cooperativa agrícola o de jardinería, o compra suministros por medio de
      ella, y recibe de ella dividendos de patrocinio u otros pagos calificados.
  /info/income/schedule-c/activity:
    body: >-
      La línea A del Anexo C pide la actividad que produjo la fuente principal de ingresos de la línea 1, incluido el
      campo general y el tipo de producto o servicio. Use la misma descripción en el PA-40 C.
  /info/income/schedule-c/code:
    body: >-
      La línea B del Anexo C es un código de seis dígitos de la tabla de códigos de actividad comercial o profesional
      principal en las instrucciones del Anexo C. No se puede ingresar un código que no esté en esa tabla. Ese código
      también es el código NAICS federal en el PA-40 C.
  /info/income/schedule-c/ein:
    body: >-
      Ingrese el número de identificación del empleador del Formulario SS-4. No ingrese un número de Seguro Social. Si
      este negocio no tiene un EIN, conteste que no. La línea D y la casilla del EIN del PA-40 C quedan en blanco.
  /info/income/schedule-c/address:
    body: >-
      Si operó este negocio desde su hogar en la dirección de la página 1 de su declaración federal, no tiene que
      completar la línea E del Anexo C. Conteste que sí en ese caso. Pensilvania igual necesita la dirección completa
      del negocio, que entonces es la dirección de su declaración. De lo contrario, ingrese la dirección de la calle del
      negocio, no un apartado postal.
  /info/income/schedule-c/accounting-method:
    body: >-
      La línea F del Anexo C es el método de efectivo, el de acumulación, u otro método permitido por el Código de
      Impuestos Internos. El método debe reflejar claramente los ingresos. Esta herramienta puede completar el método de
      efectivo o el de acumulación. Otro método detiene esta declaración. Nada se trata como efectivo hasta que usted
      conteste.
  /info/income/schedule-c/started-or-acquired:
    body: >-
      Si comenzó o adquirió este negocio en 2026, marque la casilla de la línea H. También márquela si está reabriendo o
      reiniciando este negocio después de cerrarlo temporalmente y no presentó un Anexo C de 2025 para este negocio.
      Conteste que sí o que no. Nada se trata como no hasta que usted conteste.
  /info/income/schedule-c/form-1099:
    body: >-
      Si hizo algún pago en 2026 que le obligue a presentar algún Formulario 1099, marque “Sí”. De lo contrario, marque
      “No”. Para 2026, el umbral de información para ciertos pagos declarados en los Formularios 1099 aumentó de $600 a
      $2,000. Conteste que sí o que no. Nada se trata como no hasta que usted conteste.
  /info/income/schedule-c/file-1099:
    body: >-
      Si “Sí”, ¿presentó o presentará los Formularios 1099 requeridos? Esta es la línea J del Anexo C. Se pregunta solo
      cuando la línea I es “Sí”. Conteste que sí o que no. Nada se trata como no hasta que usted conteste.
  /info/income/schedule-c/material-participation:
    body: >-
      Usted participa materialmente si trabaja en el negocio de forma regular, continua y considerable. Por ejemplo,
      trabajó más de 500 horas en él este año o hizo casi todo el trabajo.
  /info/income/schedule-c/loop-intro:
    body: >-
      Agregue una entrada por cada negocio o actividad esporádica. Calcularemos la ganancia neta y el impuesto sobre el
      trabajo por cuenta propia.
  /info/income/schedule-c/amounts:
    body: >-
      Los ingresos brutos son el total de los ingresos del negocio antes de los gastos. Los gastos son los costos
      ordinarios y necesarios para operar el negocio (sección 162 del Código de Impuestos Internos).
  /info/income/schedule-c/farm:
    body: >-
      Las líneas 1a y 1b del Anexo SE son la ganancia de agricultura y los pagos del Programa de Reservas para la
      Conservación. La línea 15 de la Parte II es el método opcional de agricultura. Conteste que sí si alguno
      corresponde. Esta herramienta no puede calcular esas líneas.
  /info/income/schedule-c/church-employee:
    body: >-
      Los ingresos como empleado de una iglesia son salarios del Formulario W-2 por trabajo como empleado de una iglesia
      o de una organización controlada por una iglesia que eligió no pagar los impuestos del empleador del Seguro Social
      y Medicare. No incluyen el pago por servicios como ministro, miembro de una orden religiosa o practicante de la
      Ciencia Cristiana. Van en las líneas 5a y 5b del Anexo SE, aparte de los otros ingresos del trabajo por cuenta
      propia. Conteste solo por la persona que aparece primero en la declaración. Conteste que sí si esa persona los
      tiene.
  /info/income/schedule-c/church-employee-amount:
    body: >-
      Anote los ingresos como empleado de una iglesia de su Formulario W-2. Esa es la línea 5a del Anexo SE de la
      persona que aparece primero en la declaración. No anote aquí los ingresos como empleado de una iglesia de su
      cónyuge. La línea 5b es ese monto por 92.35 por ciento. Si la línea 5b es menor de $100, es cero y esos ingresos
      no están sujetos al impuesto sobre el trabajo por cuenta propia. Las otras ganancias netas se siguen probando en
      $400.
  /info/income/schedule-c/spouse-church-employee:
    body: >-
      Los ingresos como empleado de una iglesia son salarios del Formulario W-2 por trabajo como empleado de una iglesia
      o de una organización controlada por una iglesia que eligió no pagar los impuestos del empleador del Seguro Social
      y Medicare. No incluyen el pago por servicios como ministro, miembro de una orden religiosa o practicante de la
      Ciencia Cristiana. Cada cónyuge calcula el impuesto sobre el trabajo por cuenta propia en un Anexo SE separado.
      Esta herramienta calcula las líneas 5a y 5b solo para la persona que aparece primero. Conteste que sí si su
      cónyuge tiene ingresos como empleado de una iglesia. Tendrá que usar otra manera de presentar.
  /info/income/schedule-c/optional-method:
    body: >-
      El método opcional que no es de agricultura es la línea 4b y las líneas 16 y 17 de la Parte II del Anexo SE. Puede
      usarlo solo cuando sus ganancias netas que no son de agricultura son menores de $8,186 y menores del 72.189% de
      sus ingresos brutos que no son de agricultura, sus ganancias netas del trabajo por cuenta propia fueron de al
      menos $400 en 2 de los 3 años anteriores y ha usado este método en menos de 5 años anteriores. El monto no puede
      ser menor que sus ganancias netas reales ni mayor de $7,560. Conteste que sí si quiere usarlo. El método opcional
      de agricultura es una pregunta aparte.
  /info/income/schedule-c/nonfarm-prior-years:
    body: >-
      El método opcional que no es de agricultura requiere ganancias netas reales de $400 o más en 2 de los 3 años
      inmediatamente anteriores a este año. Conteste que no si eso no es cierto.
  /info/income/schedule-c/nonfarm-prior-uses:
    body: >-
      Puede usar el método opcional que no es de agricultura no más de cinco veces. Los años no tienen que ser
      consecutivos. Conteste que sí si lo ha usado en menos de cinco años anteriores. Conteste que no si este año sería
      el sexto uso o uno posterior.
  /info/income/schedule-c/minister:
    body: >-
      Conteste que sí si es ministro, miembro de una orden religiosa o practicante de la Ciencia Cristiana, o si tiene
      una exención aprobada del Formulario 4361 o 4029. La vivienda y la exención no se calculan aquí.
  /info/income/schedule-c/notary:
    body: >-
      Los honorarios por servicios como notario público no están sujetos al impuesto sobre el trabajo por cuenta
      propia. Ingrese la ganancia neta incluida en la línea 31 del Anexo C de este negocio. Use $0 si ninguna parte de
      la ganancia proviene de ese trabajo. La cantidad no puede ser mayor que la línea 31. Si este es su único ingreso
      sujeto al impuesto sobre el trabajo por cuenta propia, o la cantidad está en una pérdida, esta herramienta no
      puede terminar la declaración. Si tiene otras ganancias netas de $400 o más, la cantidad se resta en la línea 3
      del Anexo SE y se imprime "Exempt—Notary" en la línea punteada junto a la línea 3.
  /info/income/schedule-c/form-8919:
    body: >-
      Los salarios del Formulario 8919 van en la línea 8c del Anexo SE. Conteste que sí si los tiene. Las propinas no
      declaradas del Formulario 4137 detienen la declaración por separado.
  /info/knockout/schedule-se-out-of-scope:
    alertText:
      body:
        - p: >-
            Esta declaración necesita una línea del Anexo SE que esta herramienta no calcula. Eso incluye ingresos de
            agricultura, pagos del Programa de Reservas para la Conservación, el método opcional de agricultura, el
            ministerio o una exención del Formulario 4361 o 4029, ingresos de notario sin otras ganancias netas de $400
            o más, una cantidad de notario en una pérdida o por encima de la línea 31 del Anexo C, salarios del
            Formulario 8919 o
            los ingresos como empleado de una iglesia de su cónyuge. Tendrá que usar otra manera de presentar esta
            declaración.
  /info/knockout/schedule-se-nonfarm-optional-method:
    alertText:
      body:
        - p: >-
            El método opcional que no es de agricultura no se puede usar en esta declaración. Puede ser porque no se
            cumplen las pruebas de montos, el monto de la línea 17 sería menor que sus ganancias netas reales, las
            ganancias netas no fueron de al menos $400 en 2 de los 3 años anteriores, este sería el sexto uso o uno
            posterior, o el recuadro 14 código A del Anexo K-1 (Formulario 1065) es mayor que cero. Tendrá que usar otra
            manera de presentar esta declaración.
  /heading/knockout/schedule-se-nonfarm-optional-method-credits:
    Esta herramienta no puede calcular esos créditos con el método opcional que no es de agricultura
  /info/knockout/schedule-se-nonfarm-optional-method-credits:
    alertText:
      body:
        - p: >-
            Se eligió el método opcional que no es de agricultura y esta declaración también reclama el crédito por
            ingreso del trabajo, el crédito tributario adicional por hijos o el crédito por cuidado de hijos y
            dependientes. El Formulario 2441 usa las líneas 3 y 4b del Anexo SE, menos la deducción de la línea 15 del
            Anexo 1. La línea 4b no se incluye aquí en el ingreso del trabajo, así que esos créditos no se pueden
            calcular con la elección. Tendrá que usar otra manera de presentar esta declaración.
  /info/knockout/schedule-c-qbi:
    alertText:
      body:
        - p: >-
            Esta herramienta calcula la deducción por ingreso calificado de negocios solo con el Formulario 8995
            simplificado. No acepta una pérdida que se traslada de un año anterior, pagos de cooperativas, ingreso
            tributable por encima del límite del Formulario 8995, ni algunos negocios en los que participa materialmente
            y otros en los que no. Tendrá que usar otra manera de presentar esta declaración.
  /info/income/schedule-c/part-i:
    body:
      "Los ingresos brutos son la línea 1. Las devoluciones y rebajas son la línea 2 y se ingresan como un monto
      positivo. Los otros ingresos son la línea 6 (por ejemplo, ventas de desecho). Deje una línea en cero si no
      corresponde."
  /info/income/schedule-c/other-income-form:
    body:
      "Conteste que sí si este monto es un crédito por impuesto sobre combustibles o una recuperación del Formulario
      4797. Esta herramienta no puede calcularlos."
  /info/income/schedule-c/inventory:
    body:
      "Conteste que sí si necesita la línea 4 y la Parte III del Anexo C. El costo y el menor entre el costo o el
      mercado se pueden calcular aquí. Cualquier otro método no."
  /info/income/schedule-c/inventory-method:
    body:
      "La línea 33a es el costo. La línea 33b es el menor entre el costo o el mercado. La línea 33c, cualquier otro
      método, no se puede calcular aquí. Elija materiales y suministros no incidentales solo si no lleva inventario. Ese
      método no usa la Parte III."
  /info/income/schedule-c/inventory-change:
    body:
      "La línea 34 pregunta si las cantidades, los costos o las valoraciones cambiaron entre el inventario inicial y el
      final. Conteste que sí si cambiaron. Esta herramienta no puede calcular ese cambio."
  /info/income/schedule-c/small-business:
    body:
      "Califica como contribuyente de pequeño negocio si sus ingresos brutos anuales promedio de los 3 años tributarios
      anteriores son de $32 millones o menos y no es un refugio fiscal. Ingrese ese promedio. Incluya un negocio
      predecesor y anualice un año corto antes de ingresarlo. Use 0 si el negocio no existía en esos años. Los ingresos
      de este año no son ese promedio. Conteste que sí si es un refugio fiscal. Si el promedio es mayor de $32,000,000,
      o si es un refugio fiscal, esta herramienta no puede calcular la Parte III."
  /info/income/schedule-c/line-35:
    body:
      "La línea 35 es el inventario al principio del año. Si es distinto del inventario final del año pasado, el
      formulario pide adjuntar una explicación. Esta herramienta no puede presentar esa explicación. Conteste que sí si
      los montos difieren. Conteste que no si la línea 35 es igual al inventario final del año pasado, incluido cero
      cuando el negocio es nuevo."
  /info/income/schedule-c/inventory-amounts:
    body:
      "La línea 35 es el inventario al principio del año. La línea 36 son las compras menos los artículos retirados para
      uso personal. La línea 37 es la mano de obra, sin incluir cantidades que se pagó a usted mismo. La línea 38 son
      materiales y suministros. La línea 39 son otros costos. La línea 41 es el inventario al final del año. La línea
      42, que también es la línea 4, es la línea 35 más la línea 36 más las líneas 37 a 39, menos la línea 41. Si ese
      resultado es menor que cero, esta herramienta no puede completar la declaración."
  /info/income/schedule-c/vehicle:
    body:
      "Conteste que sí si tuvo gastos de automóvil y camión (línea 9) o intereses de un préstamo de vehículo (línea
      16b). Esos necesitan el Formulario 4562 o la Parte IV."
  /info/income/schedule-c/depreciation:
    body:
      "Conteste que sí si corresponde la línea 13. La depreciación y la deducción de la sección 179 necesitan el
      Formulario 4562."
  /info/income/schedule-c/depletion:
    body: "Conteste que sí si reclama agotamiento en la línea 12."
  /info/income/schedule-c/vehicle-lease:
    body:
      "Conteste que sí si este negocio alquiló o arrendó un automóvil, camión u otro vehículo. Un arrendamiento de 30
      días o más puede requerir un monto de inclusión. Esta herramienta no puede calcular ese monto."
  /info/income/schedule-c/equipment-rent:
    body:
      "Conteste que sí si alquiló maquinaria o equipo que no es un vehículo. La pantalla siguiente pide la parte del
      alquiler que corresponde al negocio. Ese monto es la línea 20a del Anexo C."
  /info/income/schedule-c/equipment-rent-amount:
    body:
      "Ingrese solo la parte del alquiler que fue para este negocio. Ese monto va en la línea 20a del Anexo C y se
      incluye en el total de gastos."
  /info/income/schedule-c/home-office:
    body:
      "Conteste que sí si reclama gastos por el uso comercial de su hogar en la línea 30 del Anexo C. Conteste que no si
      no los reclama. Las preguntas siguientes cubren el método simplificado. El Formulario 8829 no se calcula aquí."
  /info/income/schedule-c/home-office-method:
    body:
      "El método simplificado es $5 por los pies cuadrados permitidos. Conteste que no si usa el Formulario 8829 para
      los gastos reales. Esta herramienta no puede calcular el Formulario 8829."
  /info/income/schedule-c/home-office-same-area:
    body:
      "Conteste que sí solo si usó la misma área de un solo hogar para este negocio durante todo el año, y usó esa área
      exclusivamente para el negocio. Conteste que no si usó más de un hogar, el área cambió, usó el hogar solo parte
      del año, o un centro de cuidado diurno no se usó exclusivamente para el negocio."
  /info/income/schedule-c/home-office-gross-income:
    body:
      "Conteste que sí solo si cada dólar de los ingresos brutos de este negocio proviene de ese uso del hogar, y ningún
      monto del Formulario 8949 o del Formulario 4797 cambia el límite. La deducción entonces no puede ser mayor que la
      línea 29 del Anexo C. Si la línea 29 es cero o una pérdida, la deducción es cero. Conteste que no si parte de los
      ingresos brutos proviene de otro lugar."
  /info/income/schedule-c/home-office-shared-space:
    body:
      "Conteste que sí si no comparte estos pies cuadrados con otra persona que usa el hogar para un negocio distinto.
      Conteste que no si comparte el espacio. Esta herramienta no asigna el espacio compartido."
  /info/income/schedule-c/home-office-rental:
    body:
      "No puede usar el método simplificado para calcular una deducción por el uso del hogar como alquiler. Conteste que
      sí si este uso no es un alquiler. Conteste que no si es un alquiler."
  /info/income/schedule-c/home-office-carryover:
    body:
      "Conteste que sí si no tiene gastos de operación, pérdidas por hechos fortuitos en exceso ni depreciación
      trasladados del Formulario 8829. Esos montos son las líneas 6a y 6b de la hoja de trabajo del método simplificado
      y no se permiten este año. Conteste que no si tiene un traslado. Esta herramienta no calcula las líneas 6a y 6b."
  /info/income/schedule-c/home-office-square-feet:
    body:
      "Ingrese el total de pies cuadrados del hogar y luego los pies cuadrados que realmente usó para este negocio. El
      área del negocio no puede ser mayor que el hogar. La deducción usa esa área del negocio, pero no más de 300 pies
      cuadrados, por $5. Si más de un negocio usa el método simplificado, esta herramienta no puede dividir los 300 pies
      cuadrados."
  /info/income/schedule-c/energy:
    body: "Conteste que sí si reclama la deducción de la línea 27a. Necesita el Formulario 7205."
  /info/income/schedule-c/has-expenses:
    body:
      "Estos son los costos ordinarios y necesarios para llevar a cabo el negocio (sección 162 del Código de Impuestos
      Internos). No incluya los conceptos preguntados arriba."
  /info/income/schedule-c/which-expenses:
    body:
      "Seleccione cada línea que corresponda. Las comidas se reducen al 50 por ciento en la pantalla siguiente, salvo
      que corresponda otro límite."
  /info/income/schedule-c/expense-amounts:
    body:
      "Ingrese el monto de cada línea que seleccionó. Para las comidas, ingrese el monto total antes del límite del 50
      por ciento."
  /info/income/schedule-c/meals-limit:
    body:
      "En la mayoría de los casos puede deducir el 50 por ciento de las comidas del negocio. Conteste que no si
      corresponde la excepción del 80 por ciento para trabajadores del transporte o una comida del 100 por ciento."
  /info/income/schedule-c/wage-credits:
    body:
      "La línea 26 son los salarios menos los créditos por empleo. Conteste que sí si reduce los salarios por el
      Formulario 5884, 8932 u 8994."
  /info/income/schedule-c/interest-allocation:
    body:
      "Conteste que sí si los intereses hipotecarios (línea 16a) u otros intereses (línea 16c) son en parte personales o
      deben asignarse de otra manera. Los intereses de un préstamo de vehículo son la línea 16b y se preguntaron antes."
  /info/income/schedule-c/amortization:
    body:
      "Conteste que sí si algún otro gasto es amortización que comienza en 2026. Eso se declara en el Formulario 4562-B."
  /info/income/schedule-c/part-v:
    body: "Anote cada otro gasto y su monto. El total es la línea 48 y la línea 27b."
  /info/income/schedule-c/part-v-more:
    body:
      "Esta herramienta puede anotar tres otros gastos. Conteste que sí si tiene un cuarto. El formulario permite más y
      tendrá que usar otra manera de presentar la declaración."
  /info/income/schedule-c/at-risk:
    body:
      "Conteste esto solo porque este negocio tiene una pérdida. Si toda su inversión estuvo en riesgo y participó
      materialmente, la pérdida puede declararse. Si parte no estuvo en riesgo, se requiere el Formulario 6198."
  /info/knockout/schedule-c-accounting-method:
    alertText:
      body:
        - p:
            "La línea F del Anexo C permite el método de efectivo, un método de acumulación u otro método permitido por
            el Código de Impuestos Internos. El método debe reflejar claramente los ingresos. Cambiar de método por lo
            general requiere el Formulario 3115 y un ajuste de la sección 481(a). Esta herramienta calcula solo el
            método de efectivo y el de acumulación, y no imprime la línea F (3). Tendrá que usar otra manera de
            presentar esta declaración."
  /info/knockout/schedule-c-out-of-scope:
    alertText:
      body:
        - p:
            "Este negocio necesita un formulario o un límite de pérdida que esta herramienta no calcula. Eso incluye un
            método de inventario distinto del costo o del menor entre el costo o el mercado, un cambio en cómo se valoró
            el inventario, ingresos brutos anuales promedio de los 3 años anteriores de más de $32,000,000, un refugio
            fiscal, un costo de mercancías vendidas menor que cero, un inventario inicial distinto del inventario final
            del año pasado, una declaración de que no lleva inventario mientras la Parte III sigue llena, gastos de
            vehículo, depreciación, agotamiento, el alquiler o arrendamiento de un vehículo, el Formulario 8829, espacio
            compartido, uso del
            hogar como alquiler, un traslado previo del Formulario 8829, un método simplificado que esta herramienta no
            calcula, más de un negocio que usa el método simplificado, el Formulario 7205, comidas que no están
            limitadas al 50 por ciento, créditos por empleo, intereses que deben asignarse, amortización nueva, más de
            tres otros gastos, ingresos de la línea 6 de otro formulario, una pérdida en la que no participó
            materialmente, una pérdida que no está totalmente en riesgo, una pérdida de más de $128,000 en la línea 3
            del Anexo 1 (Formulario 1040) (Formulario 461, pérdida comercial excedente), o un método de contabilidad
            distinto del de efectivo o del de acumulación. Tendrá que usar otra manera de presentar esta declaración."
