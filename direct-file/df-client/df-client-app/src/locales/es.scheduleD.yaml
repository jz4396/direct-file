# Cadenas del cuestionario del Anexo D / Formulario 8949 (#28). Se combinan en locales/featureLocales.ts.
headings:
  /heading/income/income-sources/capital-assets-sold: En {{/taxYear}}, ¿vendió acciones, activos digitales como criptomonedas u otros bienes de capital, o recibió un Formulario 1099-B o 1099-DA?
  /heading/knockout/capital-assets: Esta herramienta todavía no admite declarar ventas de acciones, activos digitales (criptomonedas) u otros bienes de capital
  /heading/income/income-sources/collectibles: "En {{/taxYear}}, ¿tuvo alguna ganancia o pérdida de artículos de colección, como monedas, arte, antigüedades, gemas o metales preciosos?"
  /heading/knockout/collectibles: Esta herramienta todavía no admite ganancias de artículos de colección
  /heading/income/income-sources/unrecaptured-1250-gain: "En {{/taxYear}}, ¿tuvo ganancia no recuperada de la sección 1250?"
  /heading/knockout/unrecaptured-1250-gain: Esta herramienta todavía no admite la ganancia no recuperada de la sección 1250
  /heading/income/income-sources/wash-sale-loss: "En {{/taxYear}}, ¿se le denegó alguna pérdida por ser una venta ficticia (wash sale)?"
  /heading/knockout/wash-sale-loss: Esta herramienta todavía no admite ventas ficticias (wash sales)
info:
  /info/income/income-sources/capital-assets-sold:
    body: Los bienes de capital incluyen acciones, bonos, participaciones en fondos mutuos, activos digitales como criptomonedas y bienes que tiene como inversión. Las ventas se declaran en el Formulario 8949 y el Anexo D.
  /info/knockout/capital-assets:
    alertText:
      body:
        - p: <Link1>Encuentre otras maneras de presentar sus impuestos federales.</Link1>
      urls:
        Link1: https://www.irs.gov/filing/individuals/how-to-file
  /info/income/income-sources/collectibles:
    body: Esto incluye la ganancia de artículos de colección que aparece en un Formulario 1099-DIV (casilla 2d) o que proviene de un fondo o sociedad colectiva. Esta ganancia puede tributar hasta un 28%.
  /info/knockout/collectibles:
    alertText:
      body:
        - p: <Link1>Encuentre otras maneras de presentar sus impuestos federales.</Link1>
      urls:
        Link1: https://www.irs.gov/filing/individuals/how-to-file
  /info/income/income-sources/unrecaptured-1250-gain:
    body: Por lo general, proviene de la venta de bienes inmuebles depreciados, como una propiedad de alquiler, o aparece en un Formulario 1099-DIV (casilla 2b). Puede tributar hasta un 25%.
  /info/knockout/unrecaptured-1250-gain:
    alertText:
      body:
        - p: <Link1>Encuentre otras maneras de presentar sus impuestos federales.</Link1>
      urls:
        Link1: https://www.irs.gov/filing/individuals/how-to-file
  /info/income/income-sources/wash-sale-loss:
    body: Una venta ficticia ocurre cuando vende acciones o valores con pérdida y compra acciones o valores sustancialmente idénticos dentro de los 30 días antes o después de la venta.
  /info/knockout/wash-sale-loss:
    alertText:
      body:
        - p: <Link1>Encuentre otras maneras de presentar sus impuestos federales.</Link1>
      urls:
        Link1: https://www.irs.gov/filing/individuals/how-to-file
