info:
  /info/income/schedule-e/intro:
    body: >-
      Esto incluye el alquiler de una casa, apartamento, habitación u otro bien raíz que alquiló, y las regalías de
      propiedades de petróleo, gas o minerales, derechos de autor o patentes. Se declara en el Anexo E.
  /info/income/schedule-e/part-ii:
    body: >-
      Conteste que sí si fue socio, accionista de una sociedad anónima de tipo S o beneficiario de un caudal hereditario
      o fideicomiso, aunque no haya tenido ingresos de alquiler o regalías y aunque no haya recibido el dinero. Se puede
      declarar una sociedad colectiva o de tipo S que solo tenga ingreso ordinario del negocio si usted participó de
      forma importante. Otras situaciones del Anexo K-1 detienen esta declaración. Una participación residual en un
      REMIC es una pregunta aparte. No conteste que sí aquí solo porque recibió el Anexo Q (Formulario 1066).
  /info/income/schedule-e/part-ii-line-27:
    body: >-
      Conteste que sí si declara una pérdida que no se permitió en un año anterior por los límites de riesgo o de base,
      una pérdida pasiva no permitida de un año anterior o gastos de sociedad no reembolsados.
  /info/income/schedule-e/part-iii:
    body: >-
      Conteste que sí si es beneficiario de un caudal hereditario o fideicomiso, aunque no haya recibido el ingreso.
      Debe tener un Anexo K-1 (Formulario 1041). Se puede declarar el ingreso ordinario del negocio si usted participó
      de forma importante. Otro ingreso de alquiler detiene esta declaración.
  /info/income/schedule-e/estate-intro:
    body: >-
      Agregue una entrada por cada caudal hereditario o fideicomiso. Use el nombre y las cantidades del Anexo K-1
      (Formulario 1041). Si solo tiene un caudal o fideicomiso, puede terminar la lista de sociedades sin agregar una.
  /info/income/schedule-e/estate-name:
    body: Esta es la línea 33, columna (a), del Anexo E.
  /info/income/schedule-e/estate-scope:
    body: >-
      Conteste que sí a beneficiario extranjero si el punto H del Anexo K-1 (Formulario 1041) dice beneficiario
      extranjero. Conteste que sí si el fideicomiso es extranjero, o si trata una partida de forma distinta al caudal o
      fideicomiso.
  /info/income/schedule-e/estate-boxes:
    body: >-
      Anote las casillas 5, 6, 7 y 8. Anote 0 si una casilla está en blanco. Conteste que sí a la participación
      importante si intervino de forma regular, continua y considerable. La casilla 6 va en la columna (f) si participó
      de forma importante. Las casillas 7 y 8 son ingreso de alquiler y detienen esta declaración.
  /info/income/schedule-e/estate-other:
    body: >-
      Conteste que sí si alguna casilla distinta de las casillas 5, 6, 7 y 8 tiene una cantidad, incluso intereses,
      dividendos, ganancia de capital, deducciones, créditos o la casilla 14.
  /info/income/schedule-e/estate-limits:
    body: >-
      Conteste que sí a la primera pregunta si se aplica un límite de base. Conteste que sí a la segunda si alguna
      cantidad no está en riesgo. Conteste que sí a la tercera si tiene una deducción o pérdida pasiva.
  /info/income/schedule-e/part-iv:
    body: >-
      Conteste que sí si tiene una participación residual en un conducto de inversión hipotecaria inmobiliaria (REMIC),
      aunque no tenga una sociedad colectiva, sociedad anónima de tipo S, caudal hereditario o fideicomiso. Debe tener
      un Anexo Q (Formulario 1066).
  /info/income/schedule-e/k1-intro:
    body: >-
      Agregue una entrada por cada sociedad colectiva o sociedad anónima de tipo S. Use el nombre y el ingreso ordinario
      del negocio del Anexo K-1.
  /info/income/schedule-e/k1-name:
    body: >-
      Elija sociedad colectiva si el Anexo K-1 es el Formulario 1065. Elija sociedad anónima de tipo S si es el
      Formulario 1120-S. En el Anexo E es la columna (b): P o S.
  /info/income/schedule-e/k1-scope:
    body: >-
      Conteste que sí a sociedad extranjera si marcaría la columna (c) de la línea 28 del Anexo E. Conteste que sí si es
      una sociedad que cotiza en bolsa o si el negocio compra y vende instrumentos financieros o productos básicos.
  /info/income/schedule-e/k1-box1:
    body: >-
      Anote la casilla 1, ingreso o pérdida ordinaria del negocio. Conteste que sí a la participación importante si
      intervino en las operaciones de forma regular, continua y considerable. Ese ingreso va en la columna (k), ingreso
      no pasivo.
  /info/income/schedule-e/k1-box14:
    body: >-
      Anote la cantidad de la casilla 14, código A. Anote 0 si esa casilla está en blanco. El ingreso ordinario de una
      sociedad anónima de tipo S no es ganancia del trabajo por cuenta propia; anote 0 para una sociedad de tipo S.
  /info/income/schedule-e/k1-other:
    body: >-
      Conteste que sí a la primera pregunta si el K-1 incluye una declaración para la casilla 20, código Z (Formulario
      1065) o la casilla 17, código V (Formulario 1120-S). Conteste que sí a la segunda pregunta si alguna casilla
      distinta de la casilla 1 tiene una cantidad.
  /info/income/schedule-e/k1-columns:
    body: >-
      Conteste que sí a la primera pregunta si recibió una distribución, dispuso de acciones o recibió un pago de un
      préstamo de una sociedad anónima de tipo S. Conteste que sí a la segunda pregunta si alguna cantidad no está en
      riesgo.
  /info/income/schedule-e/personal-use:
    body: >-
      Conteste que sí si, cualquier día, usted, un copropietario o un familiar usó una casa, apartamento, condominio o
      barco de alquiler para fines personales.
  /info/income/schedule-e/depreciation:
    body: >-
      Esto incluye la depreciación de un edificio o equipo, el agotamiento de una propiedad mineral y cualquier gasto de
      auto o camión (costos reales o la tarifa estándar por milla). Estos requieren el Formulario 4562.
  /info/income/schedule-e/amounts:
    body: >-
      Sume todas sus propiedades. Anote el total de alquileres recibidos, el total de regalías recibidas y el total de
      gastos como publicidad, seguro, intereses hipotecarios, reparaciones, suministros, impuestos y servicios públicos.
      No incluya la depreciación.
  /info/income/schedule-e/any-loss:
    body:
      Conteste que sí si los gastos fueron mayores que los ingresos en alguna propiedad, aunque su total sea una
      ganancia.
  /info/income/schedule-e/substantial-services:
    body: >-
      No cuente la calefacción y la luz, la limpieza de áreas comunes, la recolección de basura ni servicios similares.
      Los alquileres de corto plazo con limpieza y cambio de ropa de cama entre huéspedes generalmente cuentan.
  /info/knockout/schedule-e-substantial-services:
    alertText:
      body:
        - p: >-
            Cuando presta servicios como limpieza regular, cambio de ropa de cama o servicio de limpieza, el alquiler va
            en el Anexo C y puede estar sujeto al impuesto sobre el trabajo por cuenta propia. Esta herramienta todavía
            no lo acepta. Tendrá que usar otra manera de presentar esta declaración.
  /info/income/schedule-e/trade-or-business:
    body: >-
      Conteste que sí si trata un alquiler como una ocupación o negocio, por ejemplo porque usted u otras personas
      prestaron 250 horas o más de servicios de alquiler durante el año, o porque alquila la propiedad a un negocio que
      usted o su familia controlan en común.
  /info/knockout/schedule-e-trade-or-business:
    alertText:
      body:
        - p: >-
            Un alquiler que es una ocupación o negocio puede tener derecho a la deducción por ingreso calificado de
            negocios (Formulario 8995). Esta herramienta todavía no calcula esa deducción. Tendrá que usar otra manera
            de presentar esta declaración.
  /info/knockout/schedule-e-part-ii:
    alertText:
      body:
        - p: >-
            Esta herramienta puede declarar una sociedad colectiva nacional o una sociedad anónima de tipo S que solo
            tenga ingreso ordinario del negocio si usted participó de forma importante. Una pérdida, una actividad
            pasiva, una sociedad extranjera, una sociedad que cotiza en bolsa, una distribución u otro cálculo de base,
            ganancias del trabajo por cuenta propia u otra cantidad del Anexo K-1 necesitan formularios que esta
            herramienta todavía no acepta. Tendrá que usar otra manera de presentar esta declaración.
  /info/knockout/schedule-e-part-ii-line-27:
    alertText:
      body:
        - p: >-
            Una pérdida no permitida de un año anterior o gastos de sociedad no reembolsados pueden estar limitados por
            las reglas de actividades pasivas, de riesgo y de base. Esta herramienta todavía no acepta eso. Tendrá que
            usar otra manera de presentar esta declaración.
  /info/knockout/schedule-e-part-iii:
    alertText:
      body:
        - p: >-
            Esta herramienta puede declarar el ingreso ordinario del negocio de un caudal hereditario o fideicomiso
            nacional si usted participó de forma importante y esa cantidad no es una pérdida. Otro ingreso de alquiler,
            ingreso de alquiler de bienes raíces, una pérdida, una actividad pasiva, otra cantidad del Anexo K-1, un
            fideicomiso extranjero o un límite de base, de riesgo o de pérdida pasiva necesitan formularios que esta
            herramienta todavía no acepta. Tendrá que usar otra manera de presentar esta declaración.
  /info/knockout/schedule-e-part-iv:
    alertText:
      body:
        - p: >-
            Una participación residual en un REMIC se declara en la Parte IV del Anexo E a partir del Anexo Q
            (Formulario 1066). Esta herramienta todavía no acepta eso. Tendrá que usar otra manera de presentar esta
            declaración.
  /info/knockout/schedule-e-personal-use:
    alertText:
      body:
        - p: >-
            Cuando también usa un alquiler para fines personales, sus gastos se tienen que dividir y pueden estar
            limitados. Esta herramienta todavía no lo hace. Tendrá que usar otra manera de presentar esta declaración.
  /info/knockout/schedule-e-depreciation:
    alertText:
      body:
        - p: >-
            La depreciación, el agotamiento y los gastos de auto o camión se calculan en el Formulario 4562, que esta
            herramienta todavía no acepta. Tendrá que usar otra manera de presentar esta declaración.
  /info/knockout/schedule-e-loss:
    alertText:
      body:
        - p: >-
            Las pérdidas de alquiler y regalías pueden estar limitadas por las reglas de actividades pasivas, de riesgo
            y de pérdidas comerciales excesivas (Formularios 8582, 6198 y 461), que esta herramienta todavía no acepta.
            Tendrá que usar otra manera de presentar esta declaración.
  /info/knockout/schedule-e-eitc:
    alertText:
      body:
        - p: >-
            Los ingresos de alquiler y regalías cuentan para el límite de ingresos de inversiones del Crédito por
            Ingreso del Trabajo. Esta herramienta todavía no los incluye en esa prueba. Tendrá que usar otra manera de
            presentar esta declaración.
